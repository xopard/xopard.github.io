<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La ronda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EF;--surface:#FFFFFF;--surface2:#E2E7E4;--ink:#17221E;--muted:#58675F;--line:#CBD4CF;
  --accent:#C98A12;--good:#27745A;--bad:#AE3434;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#131B18;--surface:#1D2824;--surface2:#27342F;--ink:#ECEFEA;--muted:#9BA9A2;--line:#35443D;--good:#5DB592;--bad:#E27575;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding:0 12px 100px}
header{display:flex;align-items:flex-end;justify-content:space-between;padding:16px 2px 10px;gap:8px}
h1{font:700 2.1rem/1 var(--cond);margin:0}
.meta{text-align:right}
.round-no{font:700 1.2rem/1.1 var(--cond);display:block;margin-left:auto;background:none;border:0;padding:0;color:var(--ink)}
.round-name{display:block;font-size:.85rem;max-width:14em;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:.8rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on .dot{background:var(--good)}
.sync.off .dot{background:var(--bad)}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%;overflow-x:auto}
nav.tabs button{flex:1;background:none;border:0;border-top:3px solid transparent;color:var(--muted);font:600 .95rem var(--cond);padding:12px 6px 14px;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}

.selector-box{background:var(--surface2);border-radius:10px;padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-size:.95rem}
.selector-box select{flex:1;min-width:0}
.selector-box.need{border:2px solid var(--accent)}
.place{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px;font:600 1.1rem var(--cond);text-align:left}

.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 12px}
.person{position:relative;overflow:hidden;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:8px 8px 8px 13px;text-align:left;min-height:68px}
.person::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,transparent)}
.person .nm{display:block;font:600 1.12rem/1.1 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .dr{display:block;font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.person .ts{display:block;font-size:.72rem;color:var(--muted)}
.person.pending{border-color:var(--accent)}
.person.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}

.pad-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 2px 8px}
.pad-head h2{font:700 1.6rem/1.1 var(--cond);margin:0}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:430px){.keys{grid-template-columns:repeat(3,minmax(0,1fr))}}
.key{--c:#555;background:var(--c);color:#fff;border:0;border-radius:10px;min-height:70px;padding:9px 12px;font:600 1.3rem/1.05 var(--cond);text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:4px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.28)}
.key small{font:500 .88rem/1.2 var(--body);opacity:.92}
.key:active{transform:translateY(2px)}
.key.ghost{background:var(--surface2);color:var(--ink);box-shadow:inset 0 -4px 0 var(--line)}
.mini{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:600 .95rem var(--cond);white-space:nowrap}
.mini.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.mine{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 12px;margin-bottom:12px}
.drow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow .acts{display:flex;gap:2px;flex-shrink:0}
.note{font-size:.8rem;color:var(--muted)}
.linkish{background:none;border:0;color:var(--muted);font:600 .9rem var(--body);padding:4px 6px}
.linkish.rm{color:var(--bad)}

.btn{display:block;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px 14px;font:600 1.15rem var(--cond);margin-top:10px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn.small{padding:8px 12px;font-size:1rem;margin-top:6px}
.btn:disabled{opacity:.45;cursor:default}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status{margin:10px 2px;color:var(--muted);font-size:.95rem}
.hint{color:var(--muted);padding:16px 4px;font-size:1.05rem}

.ticket{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;font-variant-numeric:tabular-nums}
.ticket h2{font:700 1.5rem var(--cond);margin:0 0 8px}
.line{display:grid;grid-template-columns:3ch 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.line .q{font:700 1.6rem/1 var(--cond);text-align:right}
.line .n{font:600 1.25rem/1.1 var(--cond)}
.total{display:flex;justify-content:space-between;font:700 1.6rem var(--cond);margin-top:12px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
input.price{width:5em;text-align:right}
input:disabled{opacity:.55}

.group{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.group h3{margin:0 0 8px;font:700 1.4rem/1.1 var(--cond);display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font:600 1.08rem var(--cond)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sug{border-color:var(--accent)}
.chip.drink{--c:#555;background:var(--c);color:#fff;border-color:transparent;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.chip.drink.done{background:var(--surface2);color:var(--muted);border-color:var(--line);text-decoration:line-through;text-shadow:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h2{font:700 1.35rem var(--cond);margin:0 0 8px}
.set-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.set-row input[type=text]{flex:1;min-width:0}
.x{background:none;border:0;color:var(--muted);font-size:1.2rem;padding:6px;flex-shrink:0}
.catbox{padding:6px 0 10px 10px;margin:12px 0}
.catname{font:700 1.1rem var(--cond)}
.emo{width:3.2em;text-align:center;padding:8px 4px;flex-shrink:0}
.lock{width:2.2em;text-align:center;flex-shrink:0}
.paused{opacity:.6}
.grip{background:none;border:0;color:var(--muted);font-size:1.25rem;padding:6px 4px;flex-shrink:0;cursor:grab;touch-action:none}
.set-row.dragging,.catbox.dragging{opacity:.75;background:var(--surface2);border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.18)}

table{width:100%;border-collapse:collapse}
table th,table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
table th{font:600 .95rem var(--cond);color:var(--muted)}
table th:first-child,table td:first-child{text-align:left}
.pos{color:var(--good)}.neg{color:var(--bad)}

.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>La ronda</h1>
    <div class="meta">
      <button class="round-no" id="roundNo" data-act="rename" title="Ponerle nombre a la ronda">Ronda 1</button>
      <span class="round-name" id="roundName"></span>
      <span class="sync" id="sync"><span class="dot"></span><span id="syncTxt">Conectando…</span></span>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs"><div class="in">
  <button data-act="tab" data-id="pedir">Pedir</button>
  <button data-act="tab" data-id="comanda">Comanda</button>
  <button data-act="tab" data-id="reparto">Reparto</button>
  <button data-act="tab" data-id="cuentas">Cuentas</button>
  <button data-act="tab" data-id="stats">Stats</button>
  <button data-act="tab" data-id="ajustes">Ajustes</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
/* ===== Catálogo y cuadrilla por defecto ===== */
const DEFAULT_PEOPLE=["Aitor","Amigo 2","Amigo 3","Amigo 4","Amigo 5","Amigo 6","Amigo 7","Amigo 8","Amigo 9"];
const mk=(id,name,price,emoji)=>({id,name,price,emoji:emoji||""});
const DEFAULT_CATALOG=[
  {id:"cerveza",name:"Cerveza",color:"#B97C0C",items:[
    mk("zurito","Zurito",1.8,"🍺"),mk("cana","Caña",2.5,"🍺"),mk("doble","Doble",3.5,"🍺"),mk("tercio","Tercio",3,"🍺"),
    mk("pinta","Pinta",4.5,"🍺"),mk("jarra","Jarra",5,"🍺"),mk("katxi","Katxi",5,"🍺"),mk("clara","Clara",2.5,"🍋"),
    mk("radler","Radler",3,"🍋"),mk("sin","Sin alcohol",2.5,"🍺"),mk("tostada","Tostada",2.8,"🍺"),
    mk("ipa","IPA / artesana",4,"🍺"),mk("negra","Negra",3.5,"🍺"),mk("shandy","Shandy",2.5,"🍋")]},
  {id:"vino",name:"Vino y cava",color:"#86243A",items:[
    mk("tinto","Tinto",2,"🍷"),mk("crianza","Crianza",2.5,"🍷"),mk("reserva","Reserva",3.5,"🍷"),mk("rioja","Rioja",2.5,"🍷"),
    mk("ribera","Ribera",3,"🍷"),mk("blanco","Blanco",2.2,"🥂"),mk("verdejo","Verdejo",2.5,"🥂"),mk("albarino","Albariño",3,"🥂"),
    mk("txakoli","Txakoli",2.5,"🥂"),mk("rosado","Rosado",2,"🍷"),mk("tintoverano","Tinto de verano",3,"🍹"),
    mk("sangria","Sangría",3.5,"🍹"),mk("cava","Cava",3,"🥂"),mk("dulce","Vino dulce",3,"🍷")]},
  {id:"mezclas",name:"Kalimotxo, vermú y sidra",color:"#5A2E63",items:[
    mk("kalimotxo","Kalimotxo",2.5,"🍷"),mk("katximotxo","Katxi de kalimotxo",5,"🍷"),mk("vermurojo","Vermú rojo",3,"🍸"),
    mk("vermublanco","Vermú blanco",3,"🍸"),mk("vermusifon","Vermú con sifón",3.2,"🍸"),mk("martini","Martini",3.5,"🍸"),
    mk("sidra","Sidra",2.5,"🍏"),mk("sidranatural","Sidra natural (txotx)",2.8,"🍏"),mk("mistela","Mistela",2.5,"🍷")]},
  {id:"refresco",name:"Refrescos, zumos y agua",color:"#1F68A0",items:[
    mk("cola","Cola",2.5,"🥤"),mk("colazero","Cola zero",2.5,"🥤"),mk("naranja","Naranja",2.5,"🍊"),mk("limon","Limón",2.5,"🍋"),
    mk("tonica","Tónica",2.5,"🫧"),mk("bitter","Bitter",2.5,"🍅"),mk("gaseosa","Gaseosa",1.8,"🫧"),mk("tefrio","Té frío",2.5,"🧊"),
    mk("isotonica","Isotónica",2.5,"💪"),mk("mosto","Mosto",2,"🍇"),mk("zumo","Zumo",2.5,"🧃"),mk("zumonatural","Zumo natural",3,"🍊"),
    mk("agua","Agua",1.8,"💧"),mk("aguagas","Agua con gas",2,"🫧"),mk("aguagrande","Agua grande",3,"💧")]},
  {id:"cafe",name:"Cafés e infusiones",color:"#6A4630",items:[
    mk("solo","Solo",1.5,"☕"),mk("cortado","Cortado",1.6,"☕"),mk("conleche","Con leche",1.8,"☕"),mk("descafe","Descafeinado",1.8,"☕"),
    mk("americano","Americano",1.8,"☕"),mk("capuchino","Capuchino",2.2,"☕"),mk("bombon","Bombón",2,"☕"),mk("carajillo","Carajillo",2.5,"🥃"),
    mk("leche","Leche",1.5,"🥛"),mk("colacao","Colacao",2,"🥛"),mk("te","Té",1.8,"🍵"),mk("manzanilla","Manzanilla",1.8,"🍵"),
    mk("poleo","Poleo menta",1.8,"🍵"),mk("infusion","Otra infusión",1.8,"🍵")]},
  {id:"copas",name:"Copas y chupitos",color:"#2B7458",items:[
    mk("gintonic","Gin-tonic",8,"🍸"),mk("ginpremium","Gin-tonic premium",10,"🍸"),mk("roncola","Ron-cola",7,"🥃"),
    mk("whiskycola","Whisky-cola",7,"🥃"),mk("vodkalimon","Vodka-limón",7,"🍸"),mk("mojito","Mojito",8,"🍹"),
    mk("whiskysolo","Whisky solo",6,"🥃"),mk("brandy","Brandy",5,"🥃"),mk("tequila","Tequila",5,"🥃"),
    mk("pacharan","Pacharán",3,"🥃"),mk("orujo","Orujo",3,"🥃"),mk("licorcafe","Licor de café",3,"🥃"),
    mk("jager","Jäger",4,"🥃"),mk("chupito","Chupito",2,"🥃")]},
  {id:"picar",name:"Para picar",color:"#A04A1F",items:[
    mk("pintxotortilla","Pintxo de tortilla",2.5,"🍳"),mk("croquetas","Croquetas",2.5,"🍢"),mk("gilda","Gilda",2,"🫒"),
    mk("rabas","Rabas",4,"🦑"),mk("bravas","Patatas bravas",4,"🥔"),mk("jamon","Jamón",4,"🥓"),mk("queso","Queso",4,"🧀"),
    mk("tortillapincho","Tortilla",3,"🍳"),mk("aceitunas","Aceitunas",2,"🫒"),mk("cacahuetes","Cacahuetes",1.5,"🥜"),
    mk("bocata","Bocata pequeño",3.5,"🥪"),mk("empanada","Empanada",2.5,"🥟")]}
];
const PALETTE=["#B97C0C","#86243A","#5A2E63","#1F68A0","#6A4630","#2B7458","#A04A1F","#3D5A80","#7A6A12","#8E3B6E"];

/* ===== Utilidades ===== */
const clone=o=>JSON.parse(JSON.stringify(o));
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"});
const eur=v=>fmt.format(v||0);
const r2=v=>Math.round(v*100)/100;
const hhmm=ts=>ts?new Date(ts).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}):"";
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}

/* ===== Normalización (acepta datos de versiones anteriores) ===== */
function defaults(){return{
  config:{people:DEFAULT_PEOPLE.map((n,i)=>({id:"p"+(i+1),name:n,paused:false})),
          menus:[{id:"m1",name:"Carta principal",fromDefault:true,catalog:clone(DEFAULT_CATALOG)}],menu:"m1",assignerMode:"",pin:""},
  current:{n:1,name:"",orders:{},delivered:{}},rounds:[]};}
function normCatalog(cat){
  if(!Array.isArray(cat)||!cat.length)return clone(DEFAULT_CATALOG);
  return cat.filter(c=>c&&c.id).map(c=>({id:c.id,name:c.name||"?",color:c.color||"#555",
    items:(Array.isArray(c.items)?c.items:[]).filter(it=>it&&it.id).map(it=>({id:it.id,name:it.name||"?",price:Number(it.price)||0,emoji:it.emoji||""}))}));
}
function normList(v){
  if(v==null)return[];
  if(typeof v==="string")return v?[{drink:v}]:[];
  if(Array.isArray(v))return v.map(x=>typeof x==="string"?{drink:x}:(x&&typeof x==="object"?x:null)).filter(Boolean);
  if(typeof v==="object"&&(v.drink||v.custom))return[v];
  return[];
}
function normOrders(o){const r={};if(o&&typeof o==="object")Object.keys(o).forEach(k=>{const l=normList(o[k]);if(l.length)r[k]=l});return r}
function normCurrent(c){c=c||{};return{n:Number(c.n)||1,name:typeof c.name==="string"?c.name.slice(0,40):"",orders:normOrders(c.orders),delivered:(c.delivered&&typeof c.delivered==="object")?c.delivered:{}}}
function normConfig(c){
  const d=defaults().config;c=c||{};
  const pin=(typeof c.pin==="string"&&c.pin.trim())?c.pin.trim().slice(0,8):"";
  const ppl=Array.isArray(c.people)&&c.people.length?c.people.filter(p=>p&&p.id).map(p=>({id:p.id,name:p.name||"?",paused:!!p.paused})):d.people;
  let ms=Array.isArray(c.menus)&&c.menus.length
    ? c.menus.filter(m=>m&&m.id).map(m=>({id:m.id,name:m.name||"Carta",fromDefault:!!m.fromDefault,catalog:normCatalog(m.catalog)}))
    : [{id:"m1",name:"Carta principal",catalog:normCatalog(c.catalog)}];   // migra la carta única antigua
  if(!ms.length)ms=clone(d.menus);
  const am=c.assignerMode;
  return{people:ppl,menus:ms,menu:ms.some(m=>m.id===c.menu)?c.menu:ms[0].id,assignerMode:(typeof am==="string"&&am&&am!=="OFF")?am:"",pin};
}
function loadLocal(){
  try{const s=JSON.parse(lsGet("ronda.state"));
    if(s&&s.config&&s.current)return{config:normConfig(s.config),current:normCurrent(s.current),rounds:(s.rounds||[]).map(r=>Object.assign({},r,{orders:normOrders(r.orders)}))};
  }catch(e){}
  return defaults();
}

/* ===== Firebase ===== */
const firebaseConfig={apiKey:"AIzaSyC4T6yZls3yYdKLqTSQN-HyirYx9DZgQyM",authDomain:"la-ronda-d659f.firebaseapp.com",projectId:"la-ronda-d659f",storageBucket:"la-ronda-d659f.firebasestorage.app",messagingSenderId:"1038336383449",appId:"1:1038336383449:web:dce83053f28d5bc85be1c8"};
let db=null;
try{firebase.initializeApp(firebaseConfig);db=firebase.firestore()}catch(e){console.error("Firebase init:",e)}
const DEL=()=>firebase.firestore.FieldValue.delete();
if(db){try{db.enablePersistence({synchronizeTabs:true}).catch(e=>console.warn("persistencia offline:",e&&e.code))}catch(e){console.warn(e)}}
let netCache=false,netPending=false;

/* ===== Estado ===== */
let S=loadLocal(), IDX={}, mode=db?"connecting":"local", pending=false;
let me=lsGet("ronda.me");
let askNote=lsGet("ronda.ask")==="1";
const ui={tab:"pedir",sel:null,cat:null,payer:null,confirmReset:false,confirmClear:false,multi:false,group:[],repView:"persona",payFor:null,flow:"personas",pending:null};

function saveLocal(){if(mode!=="firebase")lsSet("ronda.state",JSON.stringify(S))}
const people=()=>S.config.people;
const activePeople=()=>people().filter(p=>!p.paused);
const findP=id=>people().find(p=>p.id===id);
const pname=id=>(findP(id)||{name:id||"?"}).name;
const menus=()=>S.config.menus;
const curMenu=()=>menus().find(m=>m.id===S.config.menu)||menus()[0];
const catalog=()=>curMenu().catalog;
function reindex(){IDX={};menus().forEach(m=>m.catalog.forEach(c=>c.items.forEach(it=>{if(!IDX[it.id])IDX[it.id]=Object.assign({},it,{cat:c})})))}
const drinks=pid=>(S.current.orders&&S.current.orders[pid])||[];
const isNada=o=>!!o&&o.drink==="nada";
const label=o=>{if(!o)return"";if(o.custom)return o.custom;if(o.drink==="nada")return"No toma nada";return IDX[o.drink]?IDX[o.drink].name:"(bebida borrada)"};
const priceOf=o=>{if(!o||isNada(o))return 0;if(o.price!=null&&!isNaN(o.price))return Number(o.price)||0;return Number(IDX[o.drink]&&IDX[o.drink].price)||0};
const basePrice=o=>{if(!o||isNada(o)||o.custom)return null;return IDX[o.drink]?Number(IDX[o.drink].price):null};
const hasOverride=o=>!!o&&!o.custom&&o.price!=null&&basePrice(o)!==null&&r2(o.price)!==r2(basePrice(o));
const canon=x=>String(x==null?"":x).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
const emoji=o=>{if(!o)return"";if(isNada(o))return"🚫";if(o.custom)return"🔧";const it=IDX[o.drink];return it&&it.emoji?it.emoji:""};
const colorOf=o=>{if(!o)return"transparent";if(isNada(o))return"#7A8781";if(o.custom)return"#777";const it=IDX[o.drink];return it?it.cat.color:"transparent"};
const byName=by=>by?pname(by):"—";
const isLocked=()=>!me||(S.config.assignerMode&&S.config.assignerMode!==me);
const roundLabel=r=>"Ronda "+r.n+(r.name?" · "+r.name:"");
function usedIds(){const s=new Set();const add=o=>Object.keys(o||{}).forEach(k=>(o[k]||[]).forEach(x=>{if(x&&x.drink&&x.drink!=="nada")s.add(x.drink)}));add(S.current.orders);S.rounds.forEach(r=>add(r.orders));return s}
function personUsed(pid){if(drinks(pid).length)return true;return S.rounds.some(r=>((r.orders||{})[pid]||[]).length||r.payer===pid)}

function freshCatalog(src){return src.map(c=>({id:uid("c"),name:c.name,color:c.color,items:c.items.map(it=>({id:uid("x"),name:it.name,price:it.price,emoji:it.emoji}))}))}
const hasDefaultMenu=()=>menus().some(m=>m.fromDefault);
function commitOrder(kind,ids){

  if(kind==="people")editConfig(c=>{c.people.sort(by)});
  else if(kind==="cats")editMenu(m=>{m.catalog.sort(by)});
  else if(kind.indexOf("items:")===0){const cid=kind.slice(6);editMenu(m=>{const c=m.catalog.find(x=>x.id===cid);if(c)c.items.sort(by)})}

function exportMenu(){
  const m=curMenu();
  return JSON.stringify({ronda:1,name:m.name,catalog:m.catalog.map(c=>({name:c.name,color:c.color,items:c.items.map(it=>({name:it.name,price:it.price,emoji:it.emoji}))}))},null,1);
}
function parseMenu(txt){
  let o;try{o=JSON.parse(txt)}catch(e){return{error:"No es un texto de carta válido (JSON)."}}
  const cats=Array.isArray(o)?o:(o&&o.catalog);
  if(!Array.isArray(cats)||!cats.length)return{error:"No encuentro categorías dentro."};
  const catalog=[];
  cats.forEach((c,i)=>{
    if(!c||!Array.isArray(c.items))return;
    catalog.push({id:uid("c"),name:String(c.name||"Categoría "+(i+1)).slice(0,30),color:c.color||PALETTE[catalog.length%PALETTE.length],
      items:c.items.filter(it=>it&&it.name).map(it=>({id:uid("x"),name:String(it.name).slice(0,30),price:r2(Number(String(it.price).replace(",","."))||0),emoji:String(it.emoji||"").slice(0,4)}))});
  });
  if(!catalog.length)return{error:"Las categorías no tienen bebidas."};
  const n=catalog.reduce((a,c)=>a+c.items.length,0);
  return{menu:{id:uid("m"),name:String((o&&o.name)||"Carta importada").slice(0,30),catalog},count:n};
}
function flash(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(flash.t);flash.t=setTimeout(()=>el.classList.remove("show"),2200)}
function docRef(path){const a=path.split("/");return db.collection(a[0]).doc(a[1])}
function dbSet(path,data){if(!db||mode!=="firebase")return Promise.resolve();return docRef(path).set(data).catch(e=>{console.error(e);flash("Error guardando")})}
function dbUpdate(path,data,fb){if(!db||mode!=="firebase")return Promise.resolve();return docRef(path).update(data).catch(e=>{console.warn(e);return fb?dbSet(path,fb()):null})}
function dbDelete(path){if(!db||mode!=="firebase")return Promise.resolve();return docRef(path).delete().catch(e=>console.error(e))}

/* ===== Acciones sobre la ronda ===== */
function writeOrders(pid){
  if(mode!=="firebase"){saveLocal();return}
  const arr=clone(drinks(pid)),u={};u["orders."+pid]=arr.length?arr:DEL();
  dbUpdate("bar/current",u,()=>clone(S.current));
}
function findItemByName(txt){
  const c=canon(txt);if(!c)return null;let hit=null;
  catalog().forEach(cat=>cat.items.forEach(it=>{if(!hit&&canon(it.name)===c)hit=it}));
  if(!hit)menus().forEach(m=>m.catalog.forEach(cat=>cat.items.forEach(it=>{if(!hit&&canon(it.name)===c)hit=it})));
  return hit;
}
function tidy(d){
  if(d.custom){
    const hit=findItemByName(d.custom+" "+(d.clarification||""))||findItemByName(d.custom);
    if(hit){const n={drink:hit.id};if(d.clarification&&canon(d.clarification)&&!canon(hit.name).includes(canon(d.clarification)))n.clarification=d.clarification;return n}
    return d;
  }
  if(d.drink&&d.drink!=="nada"&&d.clarification){
    const base=IDX[d.drink]?IDX[d.drink].name:"";
    const hit=findItemByName(base+" "+d.clarification)||findItemByName(d.clarification);
    if(hit&&hit.id!==d.drink){const n={drink:hit.id};if(d.price!=null)n.price=d.price;return n}
  }
  return d;
}
function addDrinks(pids,d){
  d=tidy(d);
  const ts=Date.now(),u={};
  pids.forEach(pid=>{S.current.orders[pid]=drinks(pid).concat([Object.assign({},d,{ts,by:me})]);u["orders."+pid]=clone(S.current.orders[pid])});
  if(mode==="firebase")dbUpdate("bar/current",u,()=>clone(S.current));else saveLocal();
}
function addDrink(pid,d){addDrinks([pid],d)}
function setNote(pid,idx,txt){
  const arr=drinks(pid).slice(),old=arr[idx];if(!old)return;
  const base=Object.assign({},old);
  if(txt)base.clarification=txt;else delete base.clarification;
  const t=tidy(base),keep={ts:old.ts,by:old.by};
  arr[idx]=Object.assign({},t,keep);
  S.current.orders[pid]=arr;writeOrders(pid);
  if(t.drink&&old.drink!==t.drink&&IDX[t.drink])flash("Convertido a "+IDX[t.drink].name);
}
function setItemPrice(pid,idx,v){
  const arr=drinks(pid).slice();if(!arr[idx])return;
  const it=Object.assign({},arr[idx]);
  if(v==null)delete it.price;else it.price=r2(v);
  arr[idx]=it;S.current.orders[pid]=arr;writeOrders(pid);
}
function setGroupPrice(items,v){
  const byPid={};items.forEach(x=>{(byPid[x.pid]=byPid[x.pid]||[]).push(x.i)});
  Object.keys(byPid).forEach(pid=>{
    const arr=drinks(pid).slice();
    byPid[pid].forEach(i=>{if(arr[i])arr[i]=Object.assign({},arr[i],{price:r2(v)})});
    S.current.orders[pid]=arr;writeOrders(pid);
  });
}
function removeDrink(pid,idx){
  const arr=drinks(pid).slice();arr.splice(idx,1);
  if(arr.length)S.current.orders[pid]=arr;else delete S.current.orders[pid];
  const del=S.current.delivered,u={};
  Object.keys(del).forEach(k=>{if(k.indexOf(pid+"_")===0){delete del[k];u["delivered."+k]=DEL()}});
  writeOrders(pid);
  if(mode==="firebase"&&Object.keys(u).length)dbUpdate("bar/current",u);
}
function setDeliveredBulk(pairs,val){
  const del=S.current.delivered,u={};
  pairs.forEach(k=>{if(val){del[k]=true;u["delivered."+k]=true}else{delete del[k];u["delivered."+k]=DEL()}});
  if(mode==="firebase")dbUpdate("bar/current",u,()=>clone(S.current));else saveLocal();
}
function toggleDelivered(pid,idx){const k=pid+"_"+idx;setDeliveredBulk([k],!S.current.delivered[k])}
function keysOf(pid){return drinks(pid).map((o,i)=>isNada(o)?null:pid+"_"+i).filter(Boolean)}
function allKeys(){return people().reduce((a,p)=>a.concat(keysOf(p.id)),[])}

function setConfig(cfg){S.config=cfg;if(mode==="firebase")dbSet("bar/config",clone(cfg));else saveLocal()}
function editConfig(fn){const c=clone(S.config);fn(c);setConfig(c);render(true)}
function editMenu(fn){editConfig(c=>{const m=c.menus.find(x=>x.id===c.menu)||c.menus[0];fn(m,c)})}
function roundPrice(r,o){if(isNada(o))return 0;if(o.price!=null&&!isNaN(o.price))return Number(o.price)||0;if(r&&r.prices&&r.prices[o.drink]!=null)return Number(r.prices[o.drink])||0;return priceOf(o)}
function roundTotal(){return r2(people().reduce((s,p)=>s+drinks(p.id).reduce((ss,o)=>ss+priceOf(o),0),0))}
function anyOrders(){return Object.keys(S.current.orders).some(k=>drinks(k).length)}

function logLine(what){return{ts:Date.now(),by:me||"",what}}
function requirePin(){
  if(!S.config.pin)return true;
  const v=prompt("PIN de seguridad:");
  if(v===null)return false;
  if(String(v).trim()!==String(S.config.pin)){flash("PIN incorrecto");return false}
  return true;
}
function setRoundPayer(rid,payer){
  const r=S.rounds.find(x=>x.id===rid);if(!r)return;
  const before=r.payer?pname(r.payer):"sin pagar";
  r.payer=payer||"";
  r.log=(r.log||[]).concat([logLine(`Pagador: ${before} → ${payer?pname(payer):"sin pagar"}`)]);
  const doc=Object.assign({},r);delete doc.id;
  if(mode==="firebase")dbSet("rounds/"+rid,clone(doc));else saveLocal();
}
function closeRound(payer){
  const orders=clone(S.current.orders),prices={};let total=0;
  Object.keys(orders).forEach(pid=>orders[pid].forEach(o=>{const pr=priceOf(o);if(o.drink&&!o.custom&&!isNada(o))prices[o.drink]=pr;total+=pr}));
  const n=S.current.n,id="r"+String(n).padStart(4,"0");
  const round={n,name:S.current.name||"",orders,prices,payer:payer||"",total:r2(total),ts:Date.now(),log:[logLine(payer?"Cerrada, paga "+pname(payer):"Cerrada sin pagar")]};
  S.rounds=S.rounds.filter(r=>r.id!==id).concat([Object.assign({id},round)]);
  S.current={n:n+1,name:S.current.name||"",orders:{},delivered:{}};
  if(mode==="firebase"){dbSet("rounds/"+id,round);dbSet("bar/current",clone(S.current))}else saveLocal();
}
function clearRound(){S.current={n:S.current.n,name:S.current.name||"",orders:{},delivered:{}};if(mode==="firebase")dbSet("bar/current",clone(S.current));else saveLocal()}
function undoLast(){
  if(!S.rounds.length)return;
  const last=sortedRounds().pop();
  S.rounds=S.rounds.filter(r=>r.id!==last.id);
  S.current={n:last.n,name:last.name||"",orders:clone(last.orders||{}),delivered:{}};
  if(mode==="firebase"){dbDelete("rounds/"+last.id);dbSet("bar/current",clone(S.current))}else saveLocal();
}
function newNight(){
  const ids=S.rounds.map(r=>r.id);S.rounds=[];S.current={n:1,name:"",orders:{},delivered:{}};
  if(mode==="firebase"){ids.forEach(id=>dbDelete("rounds/"+id));dbSet("bar/current",clone(S.current))}else saveLocal();
}

/* ===== Cálculos ===== */
function sortedRounds(){return S.rounds.slice().sort((a,b)=>a.n-b.n)}
function lastDrinkOf(pid){const rs=sortedRounds();for(let i=rs.length-1;i>=0;i--){const ds=(rs[i].orders||{})[pid];if(ds&&ds.length){const o=ds[ds.length-1];if(o.drink&&!isNada(o)&&IDX[o.drink])return o.drink}}return null}
function favDrink(pid){const d={};S.rounds.forEach(r=>((r.orders||{})[pid]||[]).forEach(o=>{if(isNada(o))return;const k=o.custom||o.drink;if(k)d[k]=(d[k]||0)+1}));let best=null,max=0;Object.keys(d).forEach(x=>{if(d[x]>max){best=x;max=d[x]}});return best?{k:best,n:max}:null}
function balances(){
  const b={},drank={},paid={},times={};
  people().forEach(p=>{b[p.id]=0;drank[p.id]=0;paid[p.id]=0;times[p.id]=0});
  S.rounds.forEach(r=>{
    Object.keys(r.orders||{}).forEach(pid=>{if(pid in drank)(r.orders[pid]||[]).forEach(o=>{drank[pid]+=roundPrice(r,o)})});
    if(r.payer in paid){paid[r.payer]+=Number(r.total)||0;times[r.payer]++}
  });
  people().forEach(p=>{b[p.id]=r2(paid[p.id]-drank[p.id])});
  return{b,drank,paid,times};
}
function suggestPayer(B){
  let c=activePeople().filter(p=>drinks(p.id).some(o=>!isNada(o)));
  if(!c.length)c=activePeople();
  if(!c.length)c=people();
  return c.slice().sort((x,y)=>(B.b[x.id]-B.b[y.id])||(B.times[x.id]-B.times[y.id]))[0].id;
}
function settle(b){
  const d=[],c=[];
  people().forEach(p=>{const v=Math.round((b[p.id]||0)*100);if(v<0)d.push({id:p.id,v:-v});else if(v>0)c.push({id:p.id,v})});
  d.sort((x,y)=>y.v-x.v);c.sort((x,y)=>y.v-x.v);
  const o=[];let i=0,j=0;
  while(i<d.length&&j<c.length){const m=Math.min(d[i].v,c[j].v);o.push({from:d[i].id,to:c[j].id,v:m/100});d[i].v-=m;c[j].v-=m;if(!d[i].v)i++;if(!c[j].v)j++}
  return o;
}
let GROUPS=[];
function comandaGroups(){
  const gs={},order=[];
  Object.keys(S.current.orders).forEach(pid=>drinks(pid).forEach((o,i)=>{
    if(isNada(o))return;
    const k=(o.custom?"c:"+canon(o.custom):"d:"+o.drink)+"|"+canon(o.clarification||"")+"|"+(o.price!=null?r2(o.price):"");
    if(!gs[k]){gs[k]={o,count:0,items:[]};order.push(k)}
    gs[k].count++;gs[k].items.push({pid,i});
  }));
  GROUPS=order.map(k=>gs[k]).sort((a,b)=>b.count-a.count||label(a.o).localeCompare(label(b.o),"es")||canon(a.o.clarification||"").localeCompare(canon(b.o.clarification||"")));
  return GROUPS;
}
const gLabel=o=>label(o)+(o.clarification?" · "+o.clarification:"");

/* ===== Vistas ===== */
function vMe(){
  return `<div class="selector-box${me?"":" need"}"><label for="selectMe">Eres:</label><select id="selectMe"><option value="">Elige quién eres…</option>${people().map(p=>`<option value="${p.id}"${p.id===me?" selected":""}>${esc(p.name)}${p.paused?" (en pausa)":""}</option>`).join("")}</select></div>`;
}
function vKeys(){
  const cat=ui.cat&&catalog().find(x=>x.id===ui.cat);
  let h="";
  if(!cat){
    h+='<div class="keys">';
    const prev=(ui.multi||ui.flow==="bebida")?null:lastDrinkOf(ui.sel);
    if(prev)h+=`<button class="key" style="--c:${IDX[prev].cat.color}" data-act="pick" data-id="${prev}">Lo mismo<small>${emoji({drink:prev})} ${esc(IDX[prev].name)}</small></button>`;
    h+=catalog().map(c=>`<button class="key" style="--c:${c.color}" data-act="cat" data-id="${c.id}">${esc(c.name)}</button>`).join("");
    h+=`<button class="key ghost" data-act="pickOther">🔧 Otra bebida<small>Fuera de la carta</small></button>`;
    h+=`<button class="key ghost" data-act="pick" data-id="nada">🚫 No toma nada<small>Queda apuntado, paga 0 €</small></button></div>`;
  }else{
    h+=`<div class="keys"><button class="key ghost" data-act="back">← Atrás</button>`+cat.items.map(it=>`<button class="key" style="--c:${cat.color}" data-act="pick" data-id="${it.id}">${it.emoji?it.emoji+" ":""}${esc(it.name)}<small>${eur(it.price)}</small></button>`).join("")+'</div>';
  }
  return h;
}
function vGrid(ps,multi){
  return '<div class="people">'+ps.map(p=>{
    const ods=drinks(p.id),last=ods[ods.length-1];
    const txt=last?(ods.length>1?ods.length+"× · ":"")+label(last):"Sin pedir";
    const on=multi?ui.group.includes(p.id):p.id===ui.sel;
    return `<button class="person${on?" sel":""}${last?"":" pending"}" style="--c:${colorOf(last)}" data-act="sel" data-id="${p.id}"><span class="nm">${multi?(on?"☑ ":"☐ "):""}${esc(p.name)}</span><span class="dr">${last?emoji(last)+" ":""}${esc(txt)}</span>${last?`<span class="ts">${hhmm(last.ts)}</span>`:""}</button>`;
  }).join("")+'</div>';
}
function vPedir(){
  let h=vMe();
  if(!me)return h+`<p class="hint">👆 Elige quién eres para poder apuntar. Solo se pregunta una vez en cada móvil.</p>`;
  const am=S.config.assignerMode,locked=isLocked(),ps=activePeople(),paused=people().filter(p=>p.paused);
  h+=`<button class="place" data-act="rename"><span>📍 ${S.current.name?esc(S.current.name):'<span class="note">Ponle nombre a la ronda (p. ej. el bar)</span>'}</span><span class="note">${S.current.name?"cambiar":""}</span></button>`;
  if(am)h+=`<p class="status">🔐 Modo asignador: ${am===me?"lo tienes tú":esc(pname(am))+" apunta por todos. Solo puedes mirar."}</p>`;
  if(!ui.sel||!findP(ui.sel)||(findP(ui.sel).paused&&ui.sel!==me))ui.sel=(ps[0]||people()[0]).id;
  ui.group=ui.group.filter(id=>findP(id)&&!findP(id).paused);
  if(locked){ui.multi=false;ui.flow="personas";ui.pending=null}

  if(!locked)h+=`<div class="row2" style="margin-bottom:10px"><button class="mini${ui.flow==="personas"?" on":""}" data-act="flow" data-id="personas">1º persona</button><button class="mini${ui.flow==="bebida"?" on":""}" data-act="flow" data-id="bebida">1º bebida</button></div>`;

  /* --- flujo: primero la bebida, luego a quién --- */
  if(!locked&&ui.flow==="bebida"){
    if(!ui.pending){
      h+=`<div class="pad-head"><h2>¿Qué se pide?</h2></div><p class="note" style="margin:0 2px 10px">Elige la bebida y después marcas a quién se le apunta.</p>`;
      return h+vKeys();
    }
    const d=ui.pending,n=ui.group.length;
    h+=`<div class="pad-head"><h2>${emoji(d)} ${esc(label(d))} → ¿para quién?</h2><button class="mini on" data-act="pendingCancel">✕</button></div>`;
    h+=vGrid(ps,true);
    if(paused.length)h+=`<p class="note" style="margin:-4px 2px 12px">⏸ En pausa: ${esc(paused.map(p=>p.name).join(", "))}</p>`;
    h+=`<div class="chips" style="margin-bottom:10px"><button class="chip" data-act="groupAll">Todos</button><button class="chip" data-act="groupMissing">Los que faltan</button><button class="chip" data-act="groupNone">Ninguno</button></div>`;
    h+=`<button class="btn primary" data-act="assignPending"${n?"":" disabled"}>${n?`Apuntar ${esc(label(d))} a ${n} persona${n===1?"":"s"}`:"Marca al menos a una persona"}</button>`;
    return h;
  }

  /* --- flujo normal: primero la persona --- */
  h+=vGrid(ps,ui.multi);
  if(paused.length)h+=`<p class="note" style="margin:-4px 2px 12px">⏸ En pausa: ${esc(paused.map(p=>p.name).join(", "))} · se reanudan en Ajustes</p>`;
  if(ui.multi){
    const n=ui.group.length;
    h+=`<div class="pad-head"><h2>Para ${n} persona${n===1?"":"s"}</h2><button class="mini on" data-act="multiOff">✕ Cancelar</button></div>`;
    h+=`<p class="note" style="margin:0 2px 8px">${n?esc(ui.group.map(pname).join(", ")):"Toca arriba a quién apuntar."}</p>`;
    h+=`<div class="chips" style="margin-bottom:12px"><button class="chip" data-act="groupAll">Todos</button><button class="chip" data-act="groupMissing">Los que faltan</button><button class="chip" data-act="groupNone">Ninguno</button></div>`;
  }else{
    const ds=drinks(ui.sel);
    h+=`<div class="pad-head"><h2>${esc(pname(ui.sel))}</h2>${locked?"":'<button class="mini" data-act="multiOn">👥 Varios a la vez</button>'}</div>`;
    if(ds.length){
      h+='<div class="mine">'+ds.map((o,i)=>{
        const pr=(o.custom||hasOverride(o))?` <span class="note">· ${eur(priceOf(o))}</span>`:"";
        return `<div class="drow"><div><div>${emoji(o)} ${esc(label(o))}${o.clarification?` <span class="note">· ${esc(o.clarification)}</span>`:""}${pr}</div><div class="note">${hhmm(o.ts)||"—"} · apuntó ${esc(byName(o.by))}</div></div>${locked?"":`<div class="acts"><button class="linkish" data-act="itemPrice" data-pid="${ui.sel}" data-idx="${i}" title="Precio">€</button><button class="linkish" data-act="note" data-pid="${ui.sel}" data-idx="${i}">${o.clarification?"✏️":"+ nota"}</button><button class="linkish rm" data-act="removeDrink" data-pid="${ui.sel}" data-idx="${i}">Quitar</button></div>`}</div>`;
      }).join("")+'</div>';
    }
  }
  if(locked)return h;
  h+=vKeys();
  if(S.rounds.length&&!ui.multi)h+=`<button class="btn" data-act="repeatLast">Repetir última ronda a quien falte</button>`;
  return h;
}

function vComanda(){
  const gs=comandaGroups();
  const nada=people().filter(p=>drinks(p.id).length&&drinks(p.id).every(isNada)).map(p=>p.name);
  const faltan=activePeople().filter(p=>!drinks(p.id).length).map(p=>p.name);
  if(!gs.length&&!nada.length)return`<p class="hint">Nadie ha pedido todavía en la ${esc(roundLabel(S.current).toLowerCase())}.</p>`;
  let h=`<div class="ticket"><h2>${esc(roundLabel(S.current))}</h2>`;
  h+=gs.map((g,gi)=>{
    const o=g.o,own=o.custom||o.price!=null;
    const cell=own
      ? `<input class="price" type="number" step="0.05" inputmode="decimal" value="${r2(priceOf(o))}" data-gidx="${gi}"> €`
      : `<input class="price" type="number" step="0.05" inputmode="decimal" value="${IDX[o.drink]?IDX[o.drink].price:0}" data-price="${esc(o.drink)}"> €`;
    return `<div class="line"><span class="q">${g.count}</span><span><span class="n">${emoji(o)} ${esc(label(o))}</span>${o.clarification?`<br><span class="note">· ${esc(o.clarification)} (${g.count===1?"esta":"estas "+g.count})</span>`:""}${own?'<br><span class="note">precio propio de esta ronda</span>':""}</span><span>${cell}</span></div>`;
  }).join("");
  h+=`<div class="total"><span>Total</span><span>${eur(roundTotal())}</span></div></div>`;
  if(nada.length)h+=`<p class="status">🚫 No toman nada: ${esc(nada.join(", "))}</p>`;
  if(faltan.length)h+=`<p class="status">Sin pedir: ${esc(faltan.join(", "))}</p>`;
  h+=`<button class="btn" data-act="copy">📋 Copiar comanda</button>`;
  h+=`<button class="btn primary" data-act="tab" data-id="cuentas">Cerrar ronda y pasar a la siguiente →</button>`;
  return h;
}

function vReparto(){
  const del=S.current.delivered;
  const rows=people().map(p=>({p,ds:drinks(p.id).map((o,i)=>({o,i})).filter(x=>!isNada(x.o))})).filter(x=>x.ds.length);
  if(!rows.length)return`<p class="hint">No hay nada que repartir en la ronda ${S.current.n}.</p>`;
  let total=0,done=0;
  rows.forEach(r=>r.ds.forEach(x=>{total++;if(del[r.p.id+"_"+x.i])done++}));
  let h=`<p class="status">${total-done} de ${total} por entregar.</p>`;
  h+=`<div class="row2"><button class="mini${ui.repView==="persona"?" on":""}" data-act="repView" data-id="persona">Por persona</button><button class="mini${ui.repView==="bebida"?" on":""}" data-act="repView" data-id="bebida">Por bebida</button></div>`;
  h+=`<div class="row2"><button class="btn small" data-act="deliverAll">✓ Marcar todo</button><button class="btn small" data-act="deliverNone">↺ Desmarcar todo</button></div>`;
  if(ui.repView==="persona"){
    rows.forEach(r=>{
      const pend=r.ds.filter(x=>!del[r.p.id+"_"+x.i]).length;
      h+=`<div class="group" style="margin-top:10px"><h3><span>${esc(r.p.name)}</span><button class="mini${pend?"":" on"}" data-act="deliverPerson" data-pid="${r.p.id}">${pend?"✓ Todo":"↺ Deshacer"}</button></h3><div class="chips">`;
      r.ds.forEach(x=>{
        const on=!!del[r.p.id+"_"+x.i];
        h+=`<button class="chip drink${on?" done":""}" style="--c:${colorOf(x.o)}" data-act="deliver" data-pid="${r.p.id}" data-idx="${x.i}">${emoji(x.o)} ${esc(label(x.o))}${x.o.clarification?" · "+esc(x.o.clarification):""}</button>`;
      });
      h+='</div></div>';
    });
  }else{
    comandaGroups().forEach((g,gi)=>{
      const pend=g.items.filter(x=>!del[x.pid+"_"+x.i]).length;
      h+=`<div class="group" style="margin-top:10px;border-left:7px solid ${colorOf(g.o)}"><h3><span>${g.count}× ${emoji(g.o)} ${esc(label(g.o))}${g.o.clarification?` <span class="note">· ${esc(g.o.clarification)}</span>`:""}</span><button class="mini${pend?"":" on"}" data-act="deliverGroup" data-gidx="${gi}">${pend?"✓ Todo":"↺ Deshacer"}</button></h3><div class="chips">`;
      g.items.forEach(x=>{
        const on=!!del[x.pid+"_"+x.i];
        h+=`<button class="chip drink${on?" done":""}" style="--c:${colorOf(g.o)}" data-act="deliver" data-pid="${x.pid}" data-idx="${x.i}">${esc(pname(x.pid))}</button>`;
      });
      h+='</div></div>';
    });
  }
  if(total&&done===total)h+=`<button class="btn primary" data-act="tab" data-id="cuentas">Todo entregado → Cerrar ronda</button>`;
  return h;
}

function vCuentas(){
  const B=balances(),ps=people();
  if(ui.payer&&!findP(ui.payer))ui.payer=null;
  const payers=ps.filter(p=>!p.paused||drinks(p.id).length||B.drank[p.id]>0);
  let h=`<section class="card"><h2>${esc(roundLabel(S.current))} · ${eur(roundTotal())}</h2>`;
  if(anyOrders()){
    const sug=suggestPayer(B);
    h+=`<p class="note">¿Quién paga esta ronda?${S.rounds.length?" Sugerido: <b>"+esc(pname(sug))+"</b> (el que más debe).":""}</p><div class="chips">${payers.map(p=>`<button class="chip${ui.payer===p.id?" on":""}${S.rounds.length&&p.id===sug?" sug":""}" data-act="payer" data-id="${p.id}">${p.paused?"⏸ ":""}${esc(p.name)}</button>`).join("")}</div>`;
    h+=`<button class="btn primary" data-act="close"${ui.payer?"":" disabled"}>${ui.payer?`Cerrar ronda ${S.current.n} (paga ${esc(pname(ui.payer))}) → Ronda ${S.current.n+1}`:"Elige quién paga para cerrar la ronda"}</button>`;
    h+=`<button class="btn" data-act="closeUnpaid">Cerrar sin pagar (se asigna luego)</button>`;
    h+=`<button class="btn warn" data-act="clearRound">${ui.confirmClear?"¿Seguro? Toca otra vez para vaciar":"Vaciar ronda actual sin guardarla"}</button>`;
  }else h+=`<p class="note">Aún no hay pedidos en esta ronda.</p>`;
  h+="</section>";
  if(S.rounds.length){
    h+=`<section class="card"><h2>Saldos (${S.rounds.length} ronda${S.rounds.length>1?"s":""})</h2><table><thead><tr><th>Quién</th><th>Bebido</th><th>Pagado</th><th>Saldo</th></tr></thead><tbody>`;
    ps.forEach(p=>{const v=B.b[p.id];h+=`<tr class="${p.paused?"paused":""}"><td>${p.paused?"⏸ ":""}${esc(p.name)}</td><td>${eur(B.drank[p.id])}</td><td>${eur(B.paid[p.id])}</td><td class="${v>0.004?"pos":v<-0.004?"neg":""}">${v>0?"+":""}${eur(v)}</td></tr>`});
    h+="</tbody></table></section>";
    const st=settle(B.b);
    if(st.length)h+=`<section class="card"><h2>Para quedar en paz</h2>${st.map(s=>`<p style="margin:4px 0">${esc(pname(s.from))} → ${esc(pname(s.to))}: <b>${eur(s.v)}</b></p>`).join("")}</section>`;
    const last=sortedRounds()[S.rounds.length-1];
    h+=`<section class="card"><h2>Historial</h2>`;
    sortedRounds().slice().reverse().forEach(r=>{
      h+=`<div class="drow"><div><div>${esc(roundLabel(r))} · ${hhmm(r.ts)} · <b>${eur(r.total)}</b></div><div class="note">${r.payer?"pagó "+esc(pname(r.payer)):"⚠️ sin pagar"}</div></div><div class="acts"><button class="linkish" data-act="payFor" data-id="${r.id}">✏️ pagador</button>${r.id===last.id?`<button class="linkish" data-act="undo">↶ reabrir</button>`:""}</div></div>`;
      if(ui.payFor===r.id)h+=`<div class="chips" style="margin:6px 0 10px"><button class="chip${r.payer?"":" on"}" data-act="setPayer" data-id="${r.id}" data-pid="">Nadie</button>${people().map(p=>`<button class="chip${r.payer===p.id?" on":""}" data-act="setPayer" data-id="${r.id}" data-pid="${p.id}">${esc(p.name)}</button>`).join("")}</div>`;
      if((r.log||[]).length)h+=`<div class="note" style="margin:-2px 0 8px">${r.log.slice(-4).map(l=>`${hhmm(l.ts)} · ${esc(byName(l.by))}: ${esc(l.what)}`).join("<br>")}</div>`;
    });
    h+=`</section>`;
  }
  h+=`<button class="btn warn" data-act="newNight">${ui.confirmReset?"¿Seguro? Se borra todo. Toca otra vez":"🌙 Noche nueva (borra rondas y saldos)"}</button>`;
  return h;
}

function vStats(){
  if(!S.rounds.length)return`<p class="hint">Las estadísticas aparecen cuando se cierra la primera ronda.</p>`;
  let h='<section class="card"><h2>Bebida favorita</h2>';
  people().forEach(p=>{const f=favDrink(p.id);h+=`<div class="drow"><b>${p.paused?"⏸ ":""}${esc(p.name)}</b><span>${f?(IDX[f.k]?emoji({drink:f.k})+" "+esc(IDX[f.k].name):"🔧 "+esc(f.k))+` <span class="note">(${f.n})</span>`:"—"}</span></div>`});
  h+='</section><section class="card"><h2>Últimas rondas</h2>';
  const rs=sortedRounds().slice(-5);
  people().forEach(p=>{const l=rs.map(r=>((r.orders||{})[p.id]||[]).map(o=>label(o)).join(" + ")||"—");h+=`<div class="drow"><b>${esc(p.name)}</b><span class="note">${esc(l.join(" | "))}</span></div>`});
  return h+'</section>';
}

  return h;

const VIEWS={pedir:vPedir,comanda:vComanda,reparto:vReparto,cuentas:vCuentas,stats:vStats,ajustes:vAjustes};

function render(force){
  if(dragging){pending=true;return}
  const ae=document.activeElement;
  if(!force&&ae&&ae.tagName==="INPUT"&&ae.closest("#view")){pending=true;return}
  pending=false;
  reindex();
  if(me&&!findP(me)){me=null;lsSet("ronda.me",null)}
  $("#roundNo").textContent="Ronda "+S.current.n;
  $("#roundName").textContent=S.current.name?"📍 "+S.current.name:"";
  $("#sync").className="sync"+(mode==="firebase"?" on":mode==="local"?" off":"");
  $("#syncTxt").textContent=mode==="firebase"?((netCache||netPending)?"Sin cobertura · se enviará":"Compartida"):mode==="connecting"?"Conectando…":"Sin conexión (solo este móvil)";
  if(mode==="firebase"&&(netCache||netPending))$("#sync").className="sync off";
  document.querySelectorAll("nav.tabs button").forEach(b=>{b.dataset.id===ui.tab?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current")});
  let html;
  try{html=VIEWS[ui.tab]()}catch(err){console.error(err);html=`<p class="hint">⚠️ Error en esta pestaña: ${esc(err.message)}</p>`}
  $("#view").innerHTML=html;
}
document.addEventListener("focusout",()=>setTimeout(()=>{if(pending)render()},0));

/* ===== Eventos ===== */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const id=b.dataset.id;
  switch(b.dataset.act){
    case"tab":ui.tab=id;ui.cat=null;window.scrollTo(0,0);break;
    case"sel":if(ui.multi||ui.pending){const k=ui.group.indexOf(id);k<0?ui.group.push(id):ui.group.splice(k,1)}else{ui.sel=id;ui.cat=null}break;
    case"cat":ui.cat=id;break;
    case"back":ui.cat=null;break;

    case"pick":case"pickOther":{
      if(isLocked())return;
      const first=ui.flow==="bebida"&&!ui.pending;
      const pids=first?[]:(ui.multi?ui.group.slice():[ui.sel]);
      if(!first&&!pids.length){flash("Elige al menos una persona");return}
      const who=pids.length>1?pids.length+" personas":(pids.length?pname(pids[0]):"");
      let d;
      if(b.dataset.act==="pickOther"){
        const n=prompt(`${who}: ¿qué bebida?`);if(!n||!n.trim())return;
        const pr=parseFloat(String(prompt("¿Precio en € (por unidad)?","2")||"0").replace(",","."))||0;
        d={custom:n.trim().slice(0,40),price:r2(pr)};
      }else if(id==="nada"){d={drink:"nada"}}
      else{
        d={drink:id};
        if(askNote){const c=prompt(`${who}: ${IDX[id]?IDX[id].name:""}\nAclaración (opcional):`,"");if(c&&c.trim())d.clarification=c.trim().slice(0,60)}
      }
      if(first){ui.pending=tidy(d);ui.cat=null;ui.group=[];break}
      addDrinks(pids,d);ui.cat=null;ui.multi=false;ui.group=[];flash(`${label(d)} → ${who}`);break;
    }
    case"note":{
      if(isLocked())return;
      const cur=(drinks(b.dataset.pid)[b.dataset.idx]||{}).clarification||"";
      const v=prompt("Aclaración (p. ej. sin espuma, con hielo). Vacío para quitarla:",cur);
      if(v===null)return;setNote(b.dataset.pid,parseInt(b.dataset.idx,10),v.trim().slice(0,60));break;
    }
    case"removeDrink":if(!isLocked())removeDrink(b.dataset.pid,parseInt(b.dataset.idx,10));break;
    case"itemPrice":{
      if(isLocked())return;
      const o=drinks(b.dataset.pid)[b.dataset.idx];if(!o)return;
      const v=prompt(`Precio de esta consumición (${label(o)}). Vacío = precio de la carta:`,String(r2(priceOf(o))));
      if(v===null)return;
      const t=String(v).trim();
      setItemPrice(b.dataset.pid,parseInt(b.dataset.idx,10),t===""?null:(parseFloat(t.replace(",","."))||0));
      break;
    }
    case"flow":ui.flow=id;ui.pending=null;ui.cat=null;ui.group=[];ui.multi=false;break;
    case"pendingCancel":ui.pending=null;ui.group=[];break;
    case"assignPending":{
      if(isLocked()||!ui.pending||!ui.group.length)return;
      const d=ui.pending,n=ui.group.length;
      addDrinks(ui.group.slice(),d);
      ui.pending=null;ui.group=[];ui.cat=null;
      flash(`${label(d)} → ${n} persona${n===1?"":"s"}`);break;
    }
    case"multiOn":ui.multi=true;ui.group=ui.sel?[ui.sel]:[];ui.cat=null;break;
    case"multiOff":ui.multi=false;ui.group=[];break;
    case"groupAll":ui.group=activePeople().map(p=>p.id);break;
    case"groupMissing":ui.group=activePeople().filter(p=>!drinks(p.id).length).map(p=>p.id);break;
    case"groupNone":ui.group=[];break;
    case"repeatLast":{
      if(isLocked())return;
      const last=sortedRounds().pop();if(!last)return;let k=0;
      activePeople().forEach(p=>{
        if(drinks(p.id).length)return;
        const prev=(last.orders||{})[p.id];
        if(prev&&prev.length){prev.forEach(o=>{const d=o.custom?{custom:o.custom,price:o.price}:{drink:o.drink};if(o.clarification)d.clarification=o.clarification;addDrink(p.id,d)});k++}
      });
      flash(k?`Repetido a ${k} persona${k>1?"s":""}`:"No falta nadie de la última ronda");break;
    }
    case"rename":{
      const v=prompt("Nombre de la ronda (p. ej. el bar). Las siguientes lo heredan. Vacío para quitarlo:",S.current.name||"");
      if(v===null)return;S.current.name=v.trim().slice(0,40);
      if(mode==="firebase")dbUpdate("bar/current",{name:S.current.name},()=>clone(S.current));else saveLocal();break;
    }

    case"repView":ui.repView=id;break;
    case"deliver":toggleDelivered(b.dataset.pid,parseInt(b.dataset.idx,10));break;
    case"deliverGroup":{
      const g=GROUPS[parseInt(b.dataset.gidx,10)];if(!g)return;
      const ks=g.items.map(x=>x.pid+"_"+x.i);
      setDeliveredBulk(ks,ks.some(k=>!S.current.delivered[k]));break;
    }
    case"deliverPerson":{const ks=keysOf(b.dataset.pid);setDeliveredBulk(ks,ks.some(k=>!S.current.delivered[k]));break}
    case"deliverAll":setDeliveredBulk(allKeys(),true);break;
    case"deliverNone":setDeliveredBulk(allKeys(),false);break;

    case"payer":ui.payer=ui.payer===id?null:id;break;
    case"close":if(ui.payer){const n=S.current.n;closeRound(ui.payer);ui.payer=null;ui.tab="pedir";flash(`Ronda ${n} cerrada. Empieza la ${n+1}`)}break;
    case"closeUnpaid":{
      if(!anyOrders())return;
      if(!confirm("¿Cerrar la ronda sin pagador? Quedará marcada como 'sin pagar' y podrás asignarlo después en el historial."))return;
      const n=S.current.n;closeRound("");ui.payer=null;ui.tab="pedir";flash(`Ronda ${n} cerrada sin pagar`);break;
    }
    case"payFor":ui.payFor=ui.payFor===id?null:id;break;
    case"setPayer":{
      if(!requirePin())return;
      setRoundPayer(id,b.dataset.pid||"");ui.payFor=null;flash("Pagador actualizado");break;
    }
    case"clearRound":if(!ui.confirmClear){ui.confirmClear=true;setTimeout(()=>{ui.confirmClear=false;render()},3000)}else{ui.confirmClear=false;if(!requirePin())return;clearRound();flash("Ronda vaciada")}break;
    case"undo":if(confirm("¿Reabrir la última ronda cerrada? Se deshace su pago y vuelve a estar editable.")){if(!requirePin())return;undoLast();ui.tab="pedir";flash("Ronda reabierta")}break;
    case"newNight":if(!ui.confirmReset){ui.confirmReset=true;setTimeout(()=>{ui.confirmReset=false;render()},3000)}else{ui.confirmReset=false;if(!requirePin())return;newNight();flash("Noche nueva")}break;
    case"copy":{
      const txt=roundLabel(S.current)+"\n"+comandaGroups().map(g=>`${g.count} ${label(g.o)}${g.notes.length?" ("+g.notes.join(", ")+")":""}`).join("\n");
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>flash("Comanda copiada")).catch(()=>prompt("Copia la comanda:",txt));return;
    }
    case"toggleAsk":askNote=!askNote;lsSet("ronda.ask",askNote?"1":null);break;

    case"addPerson":{const n=prompt("Nombre:","Nuevo");if(!n||!n.trim())return;editConfig(c=>{c.people.push({id:uid("p"),name:n.trim().slice(0,24),paused:false})});return}
    case"setPin":{
      if(S.config.pin&&!requirePin())return;
      const v=prompt("PIN nuevo (vacío para quitarlo):",S.config.pin||"");
      if(v===null)return;
      editConfig(c=>{c.pin=String(v).trim().slice(0,8)});
      flash(String(v).trim()?"PIN guardado":"PIN quitado");return;
    }
    case"rmPerson":{
      if(personUsed(id)){flash("Ya ha participado esta noche: ponlo en pausa");return}
      if(people().length<2)return;
      if(!requirePin())return;
      if(!confirm(`¿Quitar a ${pname(id)} de la cuadrilla?`))return;
      editConfig(c=>{c.people=c.people.filter(p=>p.id!==id)});return;
    }
    case"pausePerson":editConfig(c=>{c.people.forEach(p=>{if(p.id===id)p.paused=!p.paused})});return;
    case"assignerOn":if(me&&!S.config.assignerMode)editConfig(c=>{c.assignerMode=me});return;
    case"assignerOff":{
      if(S.config.assignerMode!==me){if(!confirm(`¿Quitarle el modo asignador a ${pname(S.config.assignerMode)}?`))return;if(!requirePin())return}
      editConfig(c=>{c.assignerMode=""});return;
    }

    case"menuPick":if(id!==S.config.menu)editConfig(c=>{c.menu=id});ui.cat=null;return;
    case"menuDup":{
      const n=prompt("Nombre de la copia:",curMenu().name+" (copia)");if(!n||!n.trim())return;
      const copy={id:uid("m"),name:n.trim().slice(0,30),catalog:catalog().map(c=>({id:uid("c"),name:c.name,color:c.color,items:c.items.map(it=>({id:uid("x"),name:it.name,price:it.price,emoji:it.emoji}))}))};
      editConfig(c=>{c.menus.push(copy);c.menu=copy.id});flash("Carta duplicada");return;
    }
    case"menuNew":{
      const n=prompt("Nombre de la carta nueva:","Carta 2");if(!n||!n.trim())return;
      const m={id:uid("m"),name:n.trim().slice(0,30),catalog:[{id:uid("c"),name:"Bebidas",color:PALETTE[0],items:[]}]};
      editConfig(c=>{c.menus.push(m);c.menu=m.id});flash("Carta creada");return;
    }
    case"menuRename":{const n=prompt("Nombre de la carta:",curMenu().name);if(!n||!n.trim())return;editConfig(c=>{const m=c.menus.find(x=>x.id===c.menu);if(m)m.name=n.trim().slice(0,30)});return}
    case"menuExport":{
      const txt=exportMenu();
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject())
        .then(()=>flash("Carta copiada al portapapeles"))
        .catch(()=>prompt("Copia este texto para guardar o enviar la carta:",txt));
      return;
    }
    case"menuImport":{
      const txt=prompt("Pega aquí el texto de la carta:");
      if(!txt||!txt.trim())return;
      const res=parseMenu(txt.trim());
      if(res.error){alert(res.error);return}
      if(!confirm(`Se añadirá "${res.menu.name}" con ${res.count} productos. ¿Seguir?`))return;
      editConfig(c=>{c.menus.push(res.menu);c.menu=res.menu.id});ui.cat=null;flash("Carta importada");return;
    }
    case"menuFromDefault":{
      const m={id:uid("m"),name:"Carta completa",fromDefault:true,catalog:freshCatalog(DEFAULT_CATALOG)};
      editConfig(c=>{c.menus.push(m);c.menu=m.id});ui.cat=null;flash("Carta completa añadida y activada");return;
    }
    case"menuDel":{
      if(menus().length<2)return;
      if(!requirePin())return;
      const used=usedIds(),m=curMenu();
      if(m.catalog.some(c=>c.items.some(it=>used.has(it.id)))){flash("Tiene bebidas pedidas esta noche");return}
      if(!confirm(`¿Borrar la carta "${m.name}"?`))return;
      editConfig(c=>{c.menus=c.menus.filter(x=>x.id!==m.id);c.menu=c.menus[0].id});ui.cat=null;return;
    }
    case"menuDefaults":{
      if(!confirm("Se guardará una copia de la carta actual y esta pasará a ser la de por defecto. ¿Seguir?"))return;
      if(!requirePin())return;
      const backup={id:uid("m"),name:(curMenu().name+" "+hhmm(Date.now())).slice(0,30),catalog:clone(catalog())};
      editConfig(c=>{c.menus.push(backup);const m=c.menus.find(x=>x.id===c.menu);if(m){m.catalog=freshCatalog(DEFAULT_CATALOG);m.fromDefault=true}});
      flash("Restaurada. La anterior se guardó como copia");return;
    }

    case"addCat":{
      const n=prompt("Nombre de la nueva categoría:");if(!n||!n.trim())return;
      const usedCol=catalog().map(c=>c.color),col=PALETTE.find(x=>!usedCol.includes(x))||PALETTE[catalog().length%PALETTE.length];
      editMenu(m=>{m.catalog.push({id:uid("c"),name:n.trim().slice(0,30),color:col,items:[]})});flash("Categoría creada");return;
    }
    case"dupCat":{
      const cat=catalog().find(c=>c.id===id);if(!cat)return;
      const n=prompt("Nombre de la copia:",cat.name+" (copia)");if(!n||!n.trim())return;
      const usedCol=catalog().map(c=>c.color),col=PALETTE.find(x=>!usedCol.includes(x))||cat.color;
      editMenu(m=>{m.catalog.push({id:uid("c"),name:n.trim().slice(0,30),color:col,items:cat.items.map(it=>({id:uid("x"),name:it.name,price:it.price,emoji:it.emoji}))})});
      flash("Categoría duplicada");return;
    }
    case"rmCat":{
      const cat=catalog().find(c=>c.id===id);if(!cat)return;
      const used=usedIds();if(cat.items.some(it=>used.has(it.id))){flash("Tiene bebidas pedidas esta noche");return}
      if(!confirm(`¿Borrar la categoría "${cat.name}"${cat.items.length?` y sus ${cat.items.length} bebidas`:""}?`))return;
      if(ui.cat===id)ui.cat=null;
      editMenu(m=>{m.catalog=m.catalog.filter(x=>x.id!==id)});return;
    }
    case"addItem":{
      const cat=catalog().find(c=>c.id===id);if(!cat)return;
      const n=prompt(`Nueva bebida en ${cat.name}:`);if(!n||!n.trim())return;
      const pr=parseFloat(String(prompt("Precio en €:","2")||"0").replace(",","."))||0;
      const em=(prompt("Emoji (opcional):","")||"").trim().slice(0,4);
      editMenu(m=>{m.catalog.forEach(x=>{if(x.id===id)x.items.push({id:uid("x"),name:n.trim().slice(0,30),price:r2(pr),emoji:em})})});
      flash("Añadida: "+n.trim());return;
    }
    case"dupItem":{
      let src=null,catId=null;
      catalog().forEach(c=>c.items.forEach(it=>{if(it.id===id){src=it;catId=c.id}}));
      if(!src)return;
      const n=prompt("Nombre de la copia:",src.name+" (copia)");if(!n||!n.trim())return;
      const pr=parseFloat(String(prompt("Precio en €:",String(src.price))||"0").replace(",","."))||0;
      editMenu(m=>{m.catalog.forEach(c=>{if(c.id===catId)c.items.push({id:uid("x"),name:n.trim().slice(0,30),price:r2(pr),emoji:src.emoji})})});
      flash("Duplicada: "+n.trim());return;
    }
    case"rmItem":{
      if(usedIds().has(id)){flash("Ya se ha pedido esta noche");return}
      if(!confirm(`¿Borrar "${IDX[id]?IDX[id].name:""}" de la carta?`))return;
      editMenu(m=>{m.catalog.forEach(c=>{c.items=c.items.filter(it=>it.id!==id)})});return;
    }
    default:return;
  }
  render(true);
});

/* --- arrastrar y soltar (ratón y dedo) --- */
let dragging=null;
const kids=list=>Array.prototype.filter.call(list.children,c=>c.dataset&&c.dataset.key);
document.addEventListener("pointerdown",e=>{
  const g=e.target.closest&&e.target.closest("[data-grip]");if(!g)return;
  const row=g.closest("[data-key]"),list=g.closest("[data-droplist]");
  if(!row||!list)return;
  e.preventDefault();
  dragging={row,list,ptr:e.pointerId};
  row.classList.add("dragging");
  try{g.setPointerCapture(e.pointerId)}catch(_){}
});
document.addEventListener("pointermove",e=>{
  if(!dragging)return;
  e.preventDefault();
  const rows=kids(dragging.list);
  for(let k=0;k<rows.length;k++){
    const r=rows[k];if(r===dragging.row)continue;
    const b=r.getBoundingClientRect();
    if(e.clientY>=b.top&&e.clientY<=b.bottom){
      dragging.list.insertBefore(dragging.row,e.clientY<b.top+b.height/2?r:r.nextSibling);
      break;
    }
  }
});
function endDrag(){
  if(!dragging)return;
  const list=dragging.list;
  dragging.row.classList.remove("dragging");
  const ids=kids(list).map(r=>r.dataset.key),kind=list.dataset.droplist;
  dragging=null;
  commitOrder(kind,ids);
}
document.addEventListener("pointerup",endDrag);
document.addEventListener("pointercancel",endDrag);

document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="selectMe"){me=t.value||null;lsSet("ronda.me",me);ui.sel=me;render(true);return}
  if(t.dataset.gidx){const v=parseFloat(String(t.value).replace(",","."));if(isNaN(v)||v<0)return;const g=GROUPS[parseInt(t.dataset.gidx,10)];if(g)setGroupPrice(g.items,v);render(true);return}
  if(t.dataset.price){const v=parseFloat(String(t.value).replace(",","."));if(isNaN(v)||v<0)return;editConfig(c=>{c.menus.forEach(m=>m.catalog.forEach(cat=>cat.items.forEach(it=>{if(it.id===t.dataset.price)it.price=r2(v)})))});return}
  if(t.dataset.pname){const v=t.value.trim();if(!v)return;editConfig(c=>{c.people.forEach(p=>{if(p.id===t.dataset.pname)p.name=v.slice(0,24)})});return}
  if(t.dataset.cname){const v=t.value.trim();if(!v)return;editMenu(m=>{m.catalog.forEach(cat=>{if(cat.id===t.dataset.cname)cat.name=v.slice(0,30)})});return}
  if(t.dataset.iemoji){const v=t.value.trim().slice(0,4);editMenu(m=>{m.catalog.forEach(cat=>cat.items.forEach(it=>{if(it.id===t.dataset.iemoji)it.emoji=v}))});return}
  if(t.dataset.iname){const v=t.value.trim();if(!v)return;editMenu(m=>{m.catalog.forEach(cat=>cat.items.forEach(it=>{if(it.id===t.dataset.iname)it.name=v.slice(0,30)}))});return}
});

/* ===== Arranque ===== */
function goLocal(err){if(err)console.error(err);if(mode!=="firebase"){mode="local";render()}}
function initFirebase(){
  if(!db){goLocal();return}
  const META={includeMetadataChanges:true};
  db.collection("bar").doc("config").onSnapshot(META,snap=>{
    if(snap.exists)S.config=normConfig(snap.data());
    mode="firebase";
    if(!snap.exists)dbSet("bar/config",clone(S.config));
    render();
  },goLocal);
  db.collection("bar").doc("current").onSnapshot(META,snap=>{
    netCache=!!(snap.metadata&&snap.metadata.fromCache);netPending=!!(snap.metadata&&snap.metadata.hasPendingWrites);
    if(snap.exists)S.current=normCurrent(snap.data());
    else{mode="firebase";dbSet("bar/current",clone(S.current))}
    render();
  },goLocal);
  db.collection("rounds").onSnapshot(qs=>{
    S.rounds=qs.docs.map(x=>{const d=x.data();return Object.assign({id:x.id},d,{orders:normOrders(d.orders)})});
    render();
  },goLocal);
  setTimeout(()=>{if(mode==="connecting")goLocal()},10000);
}
render();
initFirebase();
