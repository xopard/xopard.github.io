<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La ronda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EF;--surface:#FFFFFF;--surface2:#E2E7E4;--ink:#17221E;--muted:#58675F;--line:#CBD4CF;
  --accent:#C98A12;--good:#27745A;--bad:#AE3434;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#131B18;--surface:#1D2824;--surface2:#27342F;--ink:#ECEFEA;--muted:#9BA9A2;--line:#35443D;--good:#5DB592;--bad:#E27575;}
}
:root[data-theme="dark"]{--bg:#131B18;--surface:#1D2824;--surface2:#27342F;--ink:#ECEFEA;--muted:#9BA9A2;--line:#35443D;--good:#5DB592;--bad:#E27575;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding:0 12px 100px}
header{display:flex;align-items:flex-end;justify-content:space-between;padding:16px 2px 10px;gap:8px}
h1{font:700 2.1rem/1 var(--cond);margin:0}
.meta{text-align:right}
.round-no{font:700 1.2rem/1.1 var(--cond);display:block}
.sync{font-size:.8rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on .dot{background:var(--good)}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5;overflow-x:auto}
nav.tabs .in{display:flex;max-width:560px;width:100%;flex-wrap:nowrap}
nav.tabs button{background:none;border:0;border-top:3px solid transparent;color:var(--muted);font:600 .95rem var(--cond);padding:12px 8px 14px;white-space:nowrap;flex-shrink:0}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}

.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 16px}
.person{position:relative;overflow:hidden;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:8px 8px 8px 13px;text-align:left;min-height:62px;transition:all .2s}
.person::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,transparent)}
.person .nm{display:block;font:600 1.12rem/1.1 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .dr{display:block;font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.person .ts{display:block;font-size:.75rem;color:var(--muted);opacity:.7}
.person.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.person.pending{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.person.me .nm::after{content:" (yo)";font-weight:500;color:var(--muted)}

.pad-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px}
.pad-head h2{font:700 1.6rem/1.1 var(--cond);margin:0}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:430px){.keys{grid-template-columns:repeat(3,minmax(0,1fr))}}
.key{--c:#555;background:var(--c);color:#fff;border:0;border-radius:10px;min-height:70px;padding:9px 12px;font:600 1.35rem/1.05 var(--cond);text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:4px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.28)}
.key small{font:500 .88rem/1.2 var(--body);opacity:.92}
.key:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.28)}
.key:disabled{opacity:.4;cursor:default}
.key.ghost{background:var(--surface2);color:var(--ink);box-shadow:inset 0 -4px 0 var(--line)}
.key.ghost small{color:var(--muted);opacity:1}
.key.chosen{outline:3px solid var(--ink);outline-offset:2px}

.btn{display:block;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px 14px;font:600 1.15rem var(--cond)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;margin-top:12px}
.status{margin:14px 2px;color:var(--muted);font-size:.95rem}
.hint{color:var(--muted);padding:20px 4px;font-size:1.05rem}
.linkish{background:none;border:0;color:var(--muted);font:600 1rem var(--cond);text-decoration:underline;padding:4px}
.warning{background:var(--surface2);border:2px solid var(--bad);color:var(--bad);border-radius:10px;padding:12px 14px;margin:12px 0;font:600 1.05rem var(--body)}

.selector-box{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.selector-box h3{font:600 1.15rem var(--cond);margin:0 0 8px;color:var(--muted)}
.selector-box select{width:100%;padding:8px;font-size:1rem}

.ticket{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;font-variant-numeric:tabular-nums}
.ticket h2{font:700 1.5rem var(--cond);margin:0 0 8px}
.line{display:grid;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line.compact{grid-template-columns:2ch 1fr auto;align-items:center}
.line.full{grid-template-columns:1fr}
.line .q{font:700 1.7rem/1 var(--cond);text-align:right}
.line .n{font:600 1.35rem/1.1 var(--cond)}
.line .p{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:.9rem}
.line .meta{font-size:.85rem;color:var(--muted);margin-top:4px}
.total{display:flex;justify-content:space-between;font:700 1.6rem var(--cond);margin-top:12px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;min-width:0}
input.price{width:5em;text-align:right;padding:6px}
input[type=text].clarify{font-size:.9rem;color:var(--muted);padding:6px}

.group{--c:var(--line);background:var(--surface);border:1px solid var(--line);border-left:7px solid var(--c);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.group h3{margin:0 0 8px;font:700 1.4rem/1.1 var(--cond);display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font:600 1.08rem var(--cond)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sug{border-color:var(--accent)}
.chip.done{text-decoration:line-through;opacity:.5}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h2{font:700 1.35rem var(--cond);margin:0 0 8px}
.cat-h{font:700 1.15rem var(--cond);margin:14px 0 6px;padding-left:8px;border-left:5px solid var(--c)}
.set-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.set-row input[type=text]{flex:1}
.x{background:none;border:0;color:var(--muted);font-size:1.35rem;line-height:1;padding:6px 8px}

.scroll{overflow-x:auto}
table.bal{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.bal th,table.bal td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.bal th{font:600 .95rem var(--cond);color:var(--muted)}
table.bal th:first-child,table.bal td:first-child{text-align:left}
.pos{color:var(--good);font-weight:600}.neg{color:var(--bad);font-weight:600}
.hist{padding:8px 0;border-bottom:1px solid var(--line)}
.hist strong{font:600 1.1rem var(--cond)}
.hist span{display:block;color:var(--muted);font-size:.88rem}

.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.stat-card h3{font:700 1.25rem var(--cond);margin:0 0 6px}
.stat-card .stat-item{display:flex;justify-content:space-between;font-size:.95rem;padding:4px 0;border-bottom:1px solid var(--line)}
.stat-card .stat-item:last-child{border:0}

.drink-item{background:var(--surface2);border-radius:6px;padding:8px;margin-bottom:6px;font-size:.95rem}
.drink-item .name{font-weight:600;font-size:1.05rem}
.drink-item .clarify{color:var(--muted);font-size:.85rem;font-style:italic}
.drink-item .meta{color:var(--muted);font-size:.8rem;margin-top:2px}

.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>La ronda</h1>
    <div class="meta">
      <span class="round-no" id="roundNo">Ronda 1</span>
      <span class="sync" id="sync"><span class="dot"></span><span id="syncTxt">Conectando...</span></span>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs"><div class="in">
  <button data-act="tab" data-id="pedir">Pedir</button>
  <button data-act="tab" data-id="comanda">Comanda</button>
  <button data-act="tab" data-id="reparto">Reparto</button>
  <button data-act="tab" data-id="cuentas">Cuentas</button>
  <button data-act="tab" data-id="stats">Estadísticas</button>
  <button data-act="tab" data-id="ajustes">Ajustes</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const DEFAULT_PEOPLE=["Aitor","Amigo 2","Amigo 3","Amigo 4","Amigo 5","Amigo 6","Amigo 7","Amigo 8","Amigo 9"];
const mk=(id,name,price,emoji="")=>({id,name,price,emoji});
const DEFAULT_CATALOG=[
  {id:"cerveza",name:"Cerveza",color:"#B97C0C",items:[mk("cana","Caña",2.5,"🍺"),mk("zurito","Zurito",1.8,"🍺"),mk("tercio","Tercio",3,"🍺"),mk("pinta","Pinta",4.5,"🍺"),mk("sin","Sin alcohol",2.5,"🍹"),mk("clara","Clara",2.5,"🍺")]},
  {id:"vino",name:"Vino",color:"#86243A",items:[mk("tinto","Tinto",2,"🍷"),mk("crianza","Crianza",2.5,"🍷"),mk("blanco","Blanco",2.2,"🍾"),mk("txakoli","Txakoli",2.5,"🍾"),mk("rosado","Rosado",2,"🍷")]},
  {id:"mezclas",name:"Kalimotxo y vermú",color:"#5A2E63",items:[mk("kalimotxo","Kalimotxo",2.5,"🍸"),mk("vermurojo","Vermú rojo",3,"🍸"),mk("vermublanco","Vermú blanco",3,"🍸"),mk("sidra","Sidra",2.5,"🍎")]},
  {id:"refresco",name:"Refrescos y agua",color:"#1F68A0",items:[mk("cola","Cola",2.5,"🥤"),mk("colazero","Cola zero",2.5,"🥤"),mk("naranja","Naranja",2.5,"🧡"),mk("limon","Limón",2.5,"🍋"),mk("tonica","Tónica",2.5,"💧"),mk("mosto","Mosto",2,"🍇"),mk("agua","Agua",1.8,"💧"),mk("aguagas","Agua con gas",2,"🫧")]},
  {id:"cafe",name:"Café",color:"#6A4630",items:[mk("solo","Solo",1.5,"☕"),mk("cortado","Cortado",1.6,"☕"),mk("conleche","Con leche",1.8,"☕"),mk("descafe","Descafeinado",1.8,"☕"),mk("infusion","Infusión",1.8,"🍵")]},
  {id:"copas",name:"Copas",color:"#2B7458",items:[mk("gintonic","Gin-tonic",8,"🍸"),mk("roncola","Ron-cola",7,"🥃"),mk("whiskycola","Whisky-cola",7,"🥃"),mk("vodka","Vodka",7,"🍹"),mk("pacharan","Pacharán",3,"🍑"),mk("chupito","Chupito",2,"🥃")]}
];

const clone=o=>JSON.parse(JSON.stringify(o));
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"});
const eur=v=>fmt.format(v||0);
const r2=v=>Math.round(v*100)/100;
const fmtTime=ts=>ts?new Date(ts).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}):"—";
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}

function defaults(){return{config:{people:DEFAULT_PEOPLE.map((n,i)=>({id:"p"+(i+1),name:n})),catalog:clone(DEFAULT_CATALOG),assignerMode:""},current:{n:1,orders:{},delivered:{}},rounds:[]}}
function loadLocal(){try{const s=JSON.parse(lsGet("ronda.state"));if(s&&s.config&&s.current)return s}catch(e){}return defaults()}

// Firebase config
const firebaseConfig={
  apiKey:"AIzaSyC4T6yZls3yYdKLqTSQN-HyirYx9DZgQyM",
  authDomain:"la-ronda-d659f.firebaseapp.com",
  projectId:"la-ronda-d659f",
  storageBucket:"la-ronda-d659f.firebasestorage.app",
  messagingSenderId:"1038336383449",
  appId:"1:1038336383449:web:dce83053f28d5bc85be1c8"
};

let app, db;
try{
  app=firebase.initializeApp(firebaseConfig);
  db=firebase.firestore();
}catch(e){
  console.error("Error inicializando Firebase:",e);
  db=null;
}

let S=loadLocal(), IDX={}, mode="local", readOnly=false, pending=false;
let me=lsGet("ronda.me");
const ui={tab:"pedir",selPid:null,cat:null,payer:null,confirmReset:false,customName:"",inCustom:false};

function saveLocal(){if(mode==="local")lsSet("ronda.state",JSON.stringify(S))}
function reindex(){IDX={};S.config.catalog.forEach(c=>c.items.forEach(it=>{IDX[it.id]=Object.assign({},it,{cat:c})}))}
const people=()=>S.config.people;
const pname=id=>(people().find(p=>p.id===id)||{name:"?"}).name;
const drinks=pid=>(S.current.orders&&S.current.orders[pid])||[];
const label=o=>{if(!o)return"Nada";if(o.custom)return o.custom;return o.drink==="nada"?"Nada":(IDX[o.drink]?IDX[o.drink].name:"Bebida borrada")};
const priceOf=o=>{if(!o||o.drink==="nada")return 0;if(o.custom)return o.price||2;return Number(IDX[o.drink]?.price)||0};
const emoji=o=>{if(!o||o.custom)return"";return IDX[o.drink]?IDX[o.drink].emoji:""};

function flash(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(flash.t);flash.t=setTimeout(()=>el.classList.remove("show"),2200)}

/* ---- escritura en la base compartida ---- */
async function dbWrite(path,data){
  if(!db)return;
  try{
    const docRef=db.collection(path.split("/")[0]).doc(path.split("/")[1]);
    await docRef.update(data);
  }catch(e){
    if(e.code==="invalid-argument"||e.code==="not-found"){await db.collection(path.split("/")[0]).doc(path.split("/")[1]).set(data)}
  }
}
async function dbSet(path,data){if(!db)return;try{await db.collection(path.split("/")[0]).doc(path.split("/")[1]).set(data)}catch(e){}}
async function dbDelete(path){if(!db)return;try{await db.collection(path.split("/")[0]).doc(path.split("/")[1]).delete()}catch(e){}}

/* ---- operaciones ---- */
function addDrink(pid,drink){
  if(readOnly)return flash("Solo lectura.");
  if(!S.current.orders[pid])S.current.orders[pid]=[];
  const o={...drink,ts:Date.now(),by:me||"Anónimo"};
  S.current.orders[pid].push(o);
  if(mode==="firebase")dbWrite("bar/current",{orders:clone(S.current.orders)}).catch(e=>flash("Error al guardar"));
  else saveLocal();
}
function removeDrink(pid,idx){
  if(readOnly)return;
  if(S.current.orders[pid])S.current.orders[pid].splice(idx,1);
  if(mode==="firebase")dbWrite("bar/current",{orders:clone(S.current.orders)}).catch(e=>flash("Error al guardar"));
  else saveLocal();
}
function setDelivered(pid,idx,val){
  if(readOnly)return;
  S.current.delivered=S.current.delivered||{};
  const key=pid+"_"+idx;
  if(val)S.current.delivered[key]=true;
  else delete S.current.delivered[key];
  if(mode==="firebase")dbWrite("bar/current",{delivered:clone(S.current.delivered||{})}).catch(e=>flash("Error al guardar"));
  else saveLocal();
}
function setConfig(cfg){
  if(readOnly)return flash("Solo lectura.");
  S.config=cfg;
  if(mode==="firebase")dbSet("bar/config",clone(cfg)).catch(e=>flash("Error al guardar"));
  else saveLocal();
}
function editConfig(fn){const c=clone(S.config);fn(c);setConfig(c);render()}
function roundTotal(){return r2(people().reduce((s,p)=>{const ds=drinks(p.id);return s+ds.reduce((ss,o)=>ss+priceOf(o),0)},0))}

function closeRound(payer){
  if(readOnly)return flash("Solo lectura.");
  const orders={},prices={};let total=0;
  people().forEach(p=>{
    const ds=drinks(p.id);
    if(!ds.length)return;
    orders[p.id]=ds;
    ds.forEach(o=>{if(!o.drink||o.drink!=="nada"){const pr=priceOf(o);if(o.drink)prices[o.drink]=pr;total+=pr}})
  });
  const n=S.current.n, id="r"+String(n).padStart(4,"0");
  const round={n,orders,prices,payer,total:r2(total),ts:Date.now()};
  S.rounds=S.rounds.filter(r=>r.id!==id).concat([Object.assign({id},round)]);
  S.current={n:n+1,orders:{},delivered:{}};
  if(mode==="firebase"){
    dbSet("rounds/"+id,clone(round)).catch(e=>flash("Error al guardar"));
    dbSet("bar/current",{n:n+1,orders:{},delivered:{}}).catch(e=>flash("Error al guardar"));
  }else saveLocal();
}
function undoLast(){
  if(readOnly||!S.rounds.length)return;
  const last=S.rounds.slice().sort((a,b)=>a.n-b.n).pop();
  S.rounds=S.rounds.filter(r=>r.id!==last.id);
  S.current={n:last.n,orders:clone(last.orders||{}),delivered:{}};
  if(mode==="firebase"){
    dbDelete("rounds/"+last.id).catch(e=>flash("Error al guardar"));
    dbSet("bar/current",clone(S.current)).catch(e=>flash("Error al guardar"));
  }else saveLocal();
}
function newNight(){
  if(readOnly)return;
  const ids=S.rounds.map(r=>r.id);
  S.rounds=[];S.current={n:1,orders:{},delivered:{}};
  if(mode==="firebase"){
    ids.forEach(id=>dbDelete("rounds/"+id).catch(e=>{}));
    dbSet("bar/current",{n:1,orders:{},delivered:{}}).catch(e=>flash("Error al guardar"));
  }else saveLocal();
}

/* ---- cálculos ---- */
function sortedRounds(){return S.rounds.slice().sort((a,b)=>a.n-b.n)}
function lastDrinkOf(pid){const rs=sortedRounds();for(let i=rs.length-1;i>=0;i--){const ds=rs[i].orders&&rs[i].orders[pid];if(ds&&ds.length){const o=ds[ds.length-1];if(o.drink&&o.drink!=="nada"&&(o.drink==="nada"||IDX[o.drink]))return o.drink}}return null}
function favDrink(pid){
  const drinks={};
  S.rounds.forEach(r=>{const ds=r.orders&&r.orders[pid];if(ds)ds.forEach(o=>{const d=o.drink;if(d&&d!=="nada")drinks[d]=(drinks[d]||0)+1})});
  let best=null,max=0;
  Object.keys(drinks).forEach(d=>{if(drinks[d]>max){best=d;max=drinks[d]}});
  return best;
}
function balances(){
  const b={},drank={},paid={},times={};
  people().forEach(p=>{b[p.id]=0;drank[p.id]=0;paid[p.id]=0;times[p.id]=0});
  S.rounds.forEach(r=>{
    Object.keys(r.orders||{}).forEach(pid=>{const ds=r.orders[pid];if(!ds)return;ds.forEach(o=>{drank[pid]+=Number((r.prices||{})[o.drink])||0})});
    if(r.payer in paid){paid[r.payer]+=Number(r.total)||0;times[r.payer]++}
  });
  people().forEach(p=>{b[p.id]=r2(paid[p.id]-drank[p.id])});
  return{b,drank,paid,times};
}
function suggestPayer(B){
  const ps=people();
  let cand=ps.filter(p=>{const ds=drinks(p.id);return ds&&ds.some(o=>!o.drink||o.drink!=="nada")});
  if(!cand.length)cand=ps;
  return cand.slice().sort((x,y)=>(B.b[x.id]-B.b[y.id])||(B.times[x.id]-B.times[y.id])||(ps.indexOf(x)-ps.indexOf(y)))[0].id;
}
function settle(b){
  const d=[],c=[];
  people().forEach(p=>{const v=Math.round((b[p.id]||0)*100);if(v<0)d.push({id:p.id,v:-v});else if(v>0)c.push({id:p.id,v})});
  d.sort((x,y)=>y.v-x.v);c.sort((x,y)=>y.v-x.v);
  const out=[];let i=0,j=0;
  while(i<d.length&&j<c.length){const m=Math.min(d[i].v,c[j].v);out.push({from:d[i].id,to:c[j].id,v:m/100});d[i].v-=m;c[j].v-=m;if(!d[i].v)i++;if(!c[j].v)j++}
  return out;
}
function groups(orders){
  const g={};
  people().forEach(p=>{const ds=drinks(p.id);if(!ds)return;ds.forEach(o=>{if(!o.drink||o.drink==="nada")return;const d=o.drink;(g[d]=g[d]||[]).push(p.id)})});
  const out=[];
  S.config.catalog.forEach(c=>c.items.forEach(it=>{if(g[it.id])out.push({id:it.id,pids:g[it.id]})}));
  Object.keys(g).forEach(id=>{if(!IDX[id])out.push({id,pids:g[id]})});
  return out;
}
function changesSinceLastRound(){
  if(S.rounds.length<2)return[];
  const prev=sortedRounds()[S.rounds.length-2];
  const changes=[];
  people().forEach(p=>{
    const curr=drinks(p.id);
    const prevDs=prev.orders[p.id];
    const prevD=prevDs&&prevDs.length?prevDs[prevDs.length-1].drink:null;
    const currD=curr&&curr.length?curr[curr.length-1].drink:null;
    if(currD!==prevD)changes.push({pid:p.id,from:prevD,to:currD});
  });
  return changes;
}

/* ---- vistas ---- */
function vPedir(){
  if(!me)return'<div class="warning">⚠️ Primero debes elegir quién eres</div><div class="selector-box"><h3>Eres:</h3><select id="selectMe" aria-label="¿Quién eres?"><option value="">Elige tu nombre...</option>'+people().map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")+`<option value="@guest">👤 Apuntar para alguien fuera</option></select></div>`;
  
  const ps=people();
  if(!ui.selPid||!ps.find(p=>p.id===ui.selPid)){const mine=me&&ps.find(p=>p.id===me);ui.selPid=mine?me:(ps.find(p=>!drinks(p.id).length)||ps[0]).id}
  
  let h='';
  if(S.config.assignerMode){h+=`<div class="warning">🔐 ${esc(pname(S.config.assignerMode))} está en modo asignador — solo puede apuntar él</div>`}
  
  if(S.config.assignerMode&&me!==S.config.assignerMode)return h+'<p class="hint">Espera a que '+esc(pname(S.config.assignerMode))+' termine de apuntar.</p>';
  
  h+=`<div class="selector-box"><h3>Quien pide:</h3><select id="selectSel" aria-label="Quién pide"><option value="">-- Selecciona --</option>`+ps.map(p=>`<option value="${p.id}"${ui.selPid===p.id?" selected":""}>${esc(p.name)}</option>`).join("")+`<option value="@custom">👤 Alguien que no está aquí</option></select>`;
  if(ui.selPid==="@custom")h+=`<input type="text" id="customName" placeholder="¿Nombre?" value="${esc(ui.customName)}" style="margin-top:8px">`;
  h+='</div>';
  
  if(!ui.selPid||ui.selPid==="@custom"&&!ui.customName)return h;
  
  const cur=ui.selPid==="@custom"?{name:ui.customName}:{name:pname(ui.selPid)};
  const curDrinks=ui.selPid==="@custom"?[]:drinks(ui.selPid);
  h+=`<div class="pad-head"><h2>${esc(cur.name)}</h2></div>`;
  
  if(curDrinks.length)h+=`<div style="margin-bottom:12px"><strong style="display:block;margin-bottom:6px;font-size:1.05rem">Lleva apuntadas:</strong>`+curDrinks.map((o,i)=>`<div class="drink-item"><span class="name">${emoji(o)} ${esc(label(o))}</span>${o.clarification?`<div class="clarify">${esc(o.clarification)}</div>`:""}${priceOf(o)?`<div class="meta">${eur(priceOf(o))}</div>`:""}${ui.selPid===me||me===S.config.assignerMode?`<button class="linkish" data-act="removeDrink" data-pid="${ui.selPid}" data-idx="${i}" style="display:block;margin-top:4px">Quitar</button>`:""}</div>`).join("")+`</div>`;
  
  let cat=ui.cat&&S.config.catalog.find(c=>c.id===ui.cat);
  if(!cat){
    ui.cat=null;
    h+='<div class="keys">'+S.config.catalog.map(c=>`<button class="key" style="--c:${c.color}" data-act="cat" data-id="${c.id}">${esc(c.name)}<small>${c.items.length} opciones</small></button>`).join("")+
      `<button class="key ghost" data-act="pickOther">🔧 Otra bebida<small>Especificar</small></button>`;
    const prev=lastDrinkOf(ui.selPid);
    if(prev)h+=`<button class="key ghost" data-act="pick" data-id="${prev}">${emoji({drink:prev})} Lo mismo<small>${esc(label({drink:prev}))}</small></button>`;
    h+=`</div>`;
  }else{
    h+=`<div class="keys"><button class="key ghost" data-act="back">← Volver<small>${esc(cat.name)}</small></button>`+
      cat.items.map(it=>`<button class="key" style="--c:${cat.color}" data-act="pick" data-id="${it.id}">${it.emoji} ${esc(it.name)}<small>${eur(it.price)}</small></button>`).join("")+"</div>";
  }
  
  const n=ps.filter(p=>drinks(p.id).length).length;
  h+=`<p class="status">${n} de ${ps.length} han pedido. Esta ronda va por ${eur(roundTotal())}.</p>`;
  if(S.rounds.length)h+='<button class="btn" data-act="repeatAll">Repetir última ronda a quien falte</button>';
  return h;
}

function vComanda(){
  const gs=groups();
  if(!gs.length)return'<p class="hint">Todavía nadie ha pedido en esta ronda. Empezad en Pedir.</p>';
  let h=`<div class="ticket"><h2>Ronda ${S.current.n}</h2>`;
  const changes=changesSinceLastRound();
  if(changes.length)h+=`<div style="background:var(--surface2);border-radius:6px;padding:8px;margin-bottom:10px;font-size:.9rem;color:var(--muted)">Cambios desde ronda anterior: ${changes.map(c=>`${esc(pname(c.pid))}`).join(", ")}</div>`;
  h+=gs.map(g=>{
    const pids=g.pids.slice();
    return `<div class="line full"><div class="line compact"><span class="q">${pids.length}</span><span class="n">${emoji({drink:g.id})} ${esc(label({drink:g.id}))}</span><span class="p">${IDX[g.id]?`<input class="price" type="number" inputmode="decimal" step="0.05" min="0" value="${IDX[g.id].price}" data-price="${g.id}" aria-label="Precio"> €`:""}</span></div><div class="meta">${pids.map(pid=>{const ds=drinks(pid);const o=ds.find(x=>!x.drink||x.drink===g.id);return o?`${esc(pname(pid))} (${fmtTime(o.ts)}, apuntó ${esc(o.by)})`:""}).filter(Boolean).join(" · ")}</div></div>`}).join("")+
    `<div class="total"><span>Total</span><span>${eur(roundTotal())}</span></div></div>`;
  const all=people().filter(p=>drinks(p.id).length);
  const faltan=people().filter(p=>!drinks(p.id).length);
  if(faltan.length)h+=`<p class="status">Faltan por pedir: ${faltan.map(p=>esc(p.name)).join(", ")}.</p>`;
  h+='<div class="row"><button class="btn" data-act="copy">Copiar comanda</button><button class="btn primary" data-act="tab" data-id="reparto">Ir al reparto</button></div>';
  return h;
}

function vReparto(){
  if(!people().some(p=>drinks(p.id).length))return'<p class="hint">Cuando la ronda tenga pedidos, aquí verás de quién es cada bebida.</p>';
  const del=S.current.delivered||{};
  let h='';
  
  people().forEach(p=>{
    const ds=drinks(p.id);
    if(!ds.length)return;
    h+=`<div class="group"><h3>${esc(pname(p.id))}</h3><div class="chips">`;
    ds.forEach((o,i)=>{
      const key=p.id+"_"+i;
      const done=!!del[key];
      h+=`<button class="chip${done?" done":""}" data-act="deliver" data-pid="${p.id}" data-idx="${i}" aria-pressed="${done}">${emoji(o)} ${esc(label(o))}${o.clarification?` · ${esc(o.clarification)}`:""}</button>`;
    });
    h+='</div></div>';
  });
  
  const all=people().reduce((a,p)=>a+drinks(p.id).length,0);
  const left=all-Object.keys(del).length;
  h=`<p class="status">${left?`Quedan ${left} por entregar.`:"Todo entregado."}</p>`+h;
  if(!left)h+='<div class="row"><button class="btn primary" data-act="tab" data-id="cuentas">Cerrar y apuntar quién paga</button></div>';
  return h;
}

function vCuentas(){
  const B=balances(),tot=roundTotal();
  const any=people().some(p=>drinks(p.id).some(o=>!o.drink||o.drink!=="nada"));
  if(ui.payer&&!people().find(p=>p.id===ui.payer))ui.payer=null;
  const sug=suggestPayer(B);
  let h=`<section class="card"><h2>Ronda ${S.current.n}: ${eur(tot)}</h2>`;
  if(any){
    h+=S.rounds.length?`<p class="status" style="margin-top:0">Le toca a <strong>${esc(pname(sug))}</strong>, que es quien menos ha puesto hasta ahora.</p>`:'<p class="status" style="margin-top:0">Primera ronda: elegid quién abre.</p>';
    h+=`<div class="chips">${people().map(p=>`<button class="chip${ui.payer===p.id?" on":""}${S.rounds.length&&p.id===sug?" sug":""}" data-act="payer" data-id="${p.id}" aria-pressed="${ui.payer===p.id}">${esc(p.name)}</button>`).join("")}</div>`;
    h+=`<div class="row"><button class="btn primary" data-act="close" ${ui.payer?"":"disabled"}>${ui.payer?`Cerrar ronda: paga ${esc(pname(ui.payer))}`:"Elige quién paga"}</button></div>`;
  }else h+='<p class="status" style="margin:0">Cuando pidáis, aquí se cierra la ronda y se apunta quién paga.</p>';
  h+="</section>";
  if(S.rounds.length){
    h+=`<section class="card"><h2>Cómo vamos</h2><div class="scroll"><table class="bal"><thead><tr><th>Quién</th><th>Bebido</th><th>Pagado</th><th>Saldo</th></tr></thead><tbody>`+
      people().map(p=>{const v=B.b[p.id];return`<tr><td>${esc(p.name)}</td><td>${eur(B.drank[p.id])}</td><td>${eur(B.paid[p.id])}</td><td class="${v>0.004?"pos":v<-0.004?"neg":""}">${v>0?"+":""}${eur(v)}</td></tr>`}).join("")+
      "</tbody></table></div>";
    const st=settle(B.b);
    h+=st.length?`<h2 style="margin-top:6px">Para quedar en paz ahora</h2>`+st.map(s=>`<p style="margin:4px 0">${esc(pname(s.from))} paga <strong>${eur(s.v)}</strong> a ${esc(pname(s.to))}</p>`).join(""):'<p class="status">Estáis en paz.</p>';
    h+="</section>";
    h+='<section class="card"><h2>Rondas de hoy</h2>'+sortedRounds().reverse().map(r=>{
      return`<div class="hist"><strong>Ronda ${r.n}: pagó ${esc(pname(r.payer))}, ${eur(r.total)}</strong></div>`}).join("")+
      '<div class="row"><button class="btn" data-act="undo">Reabrir la última ronda</button></div></section>';
  }
  h+=`<button class="btn warn" data-act="newNight">${ui.confirmReset?"Pulsa otra vez para borrar todas las rondas":"Empezar noche nueva"}</button>`;
  return h;
}

function vStats(){
  let h='<section class="card"><h2>Bebidas favoritas</h2>';
  const fav=people().map(p=>{const f=favDrink(p.id);return{pid:p.id,drink:f}}).filter(x=>x.drink);
  if(!fav.length)h+='<p class="hint">Aún no hay bastantes rondas para estadísticas.</p>';
  else fav.forEach(f=>{h+=`<div class="stat-card"><h3>${emoji({drink:f.drink})} ${esc(pname(f.pid))}</h3><p style="margin:0">${esc(label({drink:f.drink}))}</p></div>`});
  h+='</section>';
  h+='<section class="card"><h2>Últimas 5 rondas por persona</h2>';
  people().forEach(p=>{
    const hist=sortedRounds().slice(-5).map(r=>{const ds=r.orders[p.id];return ds&&ds.length?{drink:ds[ds.length-1].drink,n:r.n}:null}).filter(Boolean).reverse();
    if(!hist.length)return;
    h+=`<div class="stat-card"><h3>${esc(pname(p.id))}</h3>`;
    hist.forEach(h_item=>h+=`<div class="stat-item"><span>Ronda ${h_item.n}</span><span>${emoji({drink:h_item.drink})} ${esc(label({drink:h_item.drink}))}</span></div>`);
    h+='</div>';
  });
  h+='</section>';
  return h;
}

function vAjustes(){
  const ps=people();
  let h='<section class="card"><h2>Cuadrilla</h2>'+ps.map(p=>`<div class="set-row"><input type="text" value="${esc(p.name)}" data-pname="${p.id}" aria-label="Nombre"><button class="x" data-act="rmPerson" data-id="${p.id}" aria-label="Quitar a ${esc(p.name)}">×</button></div>`).join("")+
    '<button class="btn" data-act="addPerson">Añadir persona</button></section>';
  h+=`<section class="card"><h2>Modo asignador</h2><p class="status" style="margin-top:0">Si lo activas, solo tú puedes apuntar bebidas hasta que lo desactives. Útil para evitar bromas.</p><div class="chips">${["OFF",...ps.map(p=>p.id)].map(id=>`<button class="chip${S.config.assignerMode===id?" on":""}" data-act="toggleAssigner" data-id="${id}">${id==="OFF"?"Desactivado":esc(pname(id))}</button>`).join("")}</div></section>`;
  h+='<section class="card"><h2>Carta y precios</h2><p class="status" style="margin-top:0">Precios orientativos. Ajustadlos al bar donde estéis.</p>'+
    S.config.catalog.map(c=>`<h3 class="cat-h" style="--c:${c.color}">${esc(c.name)}</h3>`+c.items.map(it=>`<div class="set-row"><input type="text" value="${esc(it.name)}" data-iname="${it.id}" aria-label="Nombre de la bebida"><input class="price" type="number" inputmode="decimal" step="0.05" min="0" value="${it.price}" data-price="${it.id}" aria-label="Precio"> €<button class="x" data-act="rmItem" data-id="${it.id}" aria-label="Quitar ${esc(it.name)}">×</button></div>`).join("")+
      `<button class="chip" data-act="addItem" data-id="${c.id}">Añadir en ${esc(c.name)}</button>`).join("")+
    '<div class="row"><button class="btn" data-act="resetPrices">Volver a los precios genéricos</button></div></section>';
  h+=`<section class="card"><h2>Sincronización</h2><p style="margin:0">${mode==="firebase"?"✅ Conectada a la nube — todos veis lo mismo en tiempo real.":"⚠️ Solo este móvil — los datos no se sincronizan."}</p></section>`;
  return h;
}

const VIEWS={pedir:vPedir,comanda:vComanda,reparto:vReparto,cuentas:vCuentas,stats:vStats,ajustes:vAjustes};

function render(){
  const a=document.activeElement;
  if(a&&$("#view").contains(a)&&(a.tagName==="INPUT"||a.tagName==="SELECT")){pending=true;return}
  pending=false;reindex();
  S.current.orders=S.current.orders||{};S.current.delivered=S.current.delivered||{};
  $("#roundNo").textContent="Ronda "+S.current.n;
  $("#sync").className="sync"+(mode==="firebase"?" on":"");
  $("#syncTxt").textContent=mode==="firebase"?"Compartida":"Solo este móvil";
  document.querySelectorAll("nav.tabs button").forEach(b=>{if(b.dataset.id===ui.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  $("#view").innerHTML=VIEWS[ui.tab]();
}
document.addEventListener("focusout",()=>setTimeout(()=>{if(pending)render()},0));

/* ---- eventos ---- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const id=b.dataset.id;
  switch(b.dataset.act){
    case"tab":ui.tab=id;ui.cat=null;window.scrollTo(0,0);break;
    case"cat":ui.cat=id;break;
    case"back":ui.cat=null;break;
    case"pick":{const drink={drink:id};const clarify=prompt("¿Algo que especificar? (opcional)");if(clarify)drink.clarification=clarify;addDrink(ui.selPid,drink);ui.cat=null;render();break}
    case"pickOther":{const name=prompt("¿Qué bebida?");if(!name)return;const price=parseFloat(prompt("¿Precio? (opcional, defecto 2€)")||"2")||2;addDrink(ui.selPid,{custom:name,price:r2(price)});ui.cat=null;render();break}
    case"removeDrink":removeDrink(b.dataset.pid,parseInt(b.dataset.idx));render();break;
    case"deliver":setDelivered(b.dataset.pid,parseInt(b.dataset.idx),!(S.current.delivered||{})[b.dataset.pid+"_"+b.dataset.idx]);render();break;
    case"payer":ui.payer=ui.payer===id?null:id;render();break;
    case"close":if(ui.payer){const n=S.current.n,who=pname(ui.payer);closeRound(ui.payer);ui.payer=null;ui.selPid=null;flash(`Ronda ${n} cerrada. Pagó ${who}.`);render()}break;
    case"undo":undoLast();flash("Última ronda reabierta");render();break;
    case"newNight":if(!ui.confirmReset){ui.confirmReset=true;setTimeout(()=>{ui.confirmReset=false;if(ui.tab==="cuentas")render()},4000);render()}else{ui.confirmReset=false;newNight();flash("Noche nueva");render()}break;
    case"copy":{const txt=`Ronda ${S.current.n}\n`+groups().map(g=>`${g.pids.length} ${label({drink:g.id})}`).join("\n");try{navigator.clipboard.writeText(txt).then(()=>flash("Comanda copiada"),()=>flash("No se pudo copiar"))}catch(err){flash("No se pudo copiar")}return}
    case"addPerson":editConfig(c=>{c.people.push({id:"p"+Date.now().toString(36),name:"Nuevo"})});return;
    case"rmPerson":{if(S.rounds.some(r=>(r.orders&&r.orders[id])||(r.orders&&Object.keys(r.orders).length>0&&r.payer===id)))return flash("Tiene rondas apuntadas.");if(people().length<=1)return;editConfig(c=>{c.people=c.people.filter(p=>p.id!==id)});return}
    case"addItem":editConfig(c=>{const cat=c.catalog.find(x=>x.id===id);if(cat)cat.items.push({id:"i"+Date.now().toString(36),name:"Nueva bebida",price:2,emoji:""})});return;
    case"rmItem":editConfig(c=>{c.catalog.forEach(cat=>{cat.items=cat.items.filter(it=>it.id!==id)})});return;
    case"resetPrices":{const d={};DEFAULT_CATALOG.forEach(c=>c.items.forEach(it=>{d[it.id]=it.price}));editConfig(c=>{c.catalog.forEach(cat=>cat.items.forEach(it=>{if(it.id in d)it.price=d[it.id]}))});flash("Precios genéricos restaurados");return}
    case"toggleAssigner":editConfig(c=>{c.assignerMode=S.config.assignerMode===id?"":id});return;
    case"repeatAll":{const last=sortedRounds().pop();const cnt={};people().forEach(p=>{if(drinks(p.id).length)return;const ds=last&&last.orders[p.id];if(ds&&ds.length){const o=ds[ds.length-1];if(o.drink&&o.drink!=="nada"&&(IDX[o.drink]||o.custom)){addDrink(p.id,{drink:o.drink,custom:o.custom,price:o.price,clarification:o.clarification});cnt[p.id]=1}}});if(Object.keys(cnt).length){flash("Repetido para "+Object.keys(cnt).length)}else flash("No hay nada que repetir");render();return}
  }
});

document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="selectMe"){me=t.value||null;lsSet("ronda.me",me);if(me)render()}
  else if(t.id==="selectSel"){
    const v=t.value;
    if(v==="@custom"){ui.selPid="@custom";ui.customName=""}else{ui.selPid=v;ui.customName=""}
    render();
  }
  else if(t.id==="customName"){ui.customName=t.value;pending=true}
  else if(t.dataset.price){const v=parseFloat(String(t.value).replace(",","."));if(isNaN(v)||v<0)return;const id=t.dataset.price;const c=clone(S.config);c.catalog.forEach(cat=>cat.items.forEach(it=>{if(it.id===id)it.price=r2(v)}));setConfig(c)}
  else if(t.dataset.pname){const v=t.value.trim();if(!v)return;const id=t.dataset.pname;const c=clone(S.config);c.people.forEach(p=>{if(p.id===id)p.name=v.slice(0,24)});setConfig(c)}
  else if(t.dataset.iname){const v=t.value.trim();if(!v)return;const id=t.dataset.iname;const c=clone(S.config);c.catalog.forEach(cat=>cat.items.forEach(it=>{if(it.id===id)it.name=v.slice(0,30)}));setConfig(c)}
  pending=true;
});

/* ---- inicializar Firebase y sincronizar ---- */
function initFirebase(){
  if(!db){mode="local";$("#syncTxt").textContent="Solo este móvil";render();return}
  db.collection("bar").doc("config").onSnapshot(snap=>{
    mode="firebase";if(snap.exists){S.config=clone(snap.data());render()}
    else{S.config=defaults().config;dbSet("bar/config",clone(S.config))}
  },err=>{console.error("Error en config:",err);mode="local";$("#syncTxt").textContent="Sin conexión";render()});
  db.collection("bar").doc("current").onSnapshot(snap=>{
    mode="firebase";if(snap.exists){const c=snap.data();S.current={n:c.n||1,orders:c.orders||{},delivered:c.delivered||{}};render()}
    else{S.current={n:1,orders:{},delivered:{}};dbSet("bar/current",clone(S.current))}
  },err=>{console.error("Error en current:",err);mode="local"});
  db.collection("rounds").orderBy("n").onSnapshot(qs=>{
    mode="firebase";S.rounds=qs.docs.map(x=>Object.assign({id:x.id},clone(x.data())));render();
  },err=>{console.error("Error en rounds:",err);mode="local"});
}
render();setTimeout(initFirebase,500);
</script>
