<meta name="apple-mobile-web-app-title" content="Eskari">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EF;--surface:#FFFFFF;--surface2:#E2E7E4;--ink:#17221E;--muted:#58675F;--line:#CBD4CF;
  --accent:#C98A12;--good:#27745A;--bad:#AE3434;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#131B18;--surface:#1D2824;--surface2:#27342F;--ink:#ECEFEA;--muted:#9BA9A2;--line:#35443D;--good:#5DB592;--bad:#E27575;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding:0 12px 100px}
header{display:flex;align-items:center;justify-content:flex-start;padding:8px 2px 6px;gap:6px}
h1{font:700 1.45rem/1 var(--cond);margin:0;flex-shrink:0;display:flex;align-items:center;gap:7px}
h1 img{width:28px;height:28px;display:block}
h1 .i{color:var(--accent)}
.nochebar{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;margin:0 0 10px;font:600 1rem/1.25 var(--cond);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nochebar b{color:var(--ink)}
.noche{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.noche:last-child{border-bottom:0}
.noche .ir{flex:1;min-width:0;background:none;border:0;text-align:left;padding:4px 0}
.noche .ir b{display:block;font:600 1.1rem/1.2 var(--cond)}
.noche.aqui .ir b::after{content:" ● aquí";color:var(--accent);font-size:.85rem}
.hbtn{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font:600 1rem/1.1 var(--cond);max-width:42vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#roundBtn{margin-left:auto}
.sync{font-size:.78rem;color:var(--muted);display:inline-flex;align-items:center;gap:4px;flex-shrink:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on .dot{background:var(--good)}
.sync.off .dot{background:var(--bad)}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%;overflow-x:auto}
nav.tabs button{flex:1;background:none;border:0;border-top:3px solid transparent;color:var(--muted);font:600 .95rem var(--cond);padding:12px 6px 14px;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}

.selector-box{background:var(--surface2);border-radius:10px;padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-size:.95rem}
.selector-box select{flex:1;min-width:0}
.selector-box.need{border:2px solid var(--accent)}
.place{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px;font:600 1.1rem var(--cond);text-align:left}

.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 12px}
.person{position:relative;overflow:hidden;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:8px 8px 8px 13px;text-align:left;min-height:68px}
.person::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,transparent)}
.person .nm{display:block;font:600 1.12rem/1.1 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .dr{display:block;font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.person .ts{display:block;font-size:.72rem;color:var(--muted)}
.person.pending{border-color:var(--accent)}
.person.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}

.pad-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 2px 8px}
.pad-head h2{font:700 1.6rem/1.1 var(--cond);margin:0}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:430px){.keys{grid-template-columns:repeat(3,minmax(0,1fr))}}
.key{--c:#555;background:var(--c);color:#fff;border:0;border-radius:10px;min-height:70px;padding:9px 12px;font:600 1.3rem/1.05 var(--cond);text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:4px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.28)}
.key small{font:500 .88rem/1.2 var(--body);opacity:.92}
.key:active{transform:translateY(2px)}
.key.ghost{background:var(--surface2);color:var(--ink);box-shadow:inset 0 -4px 0 var(--line)}
/* Atajos ("lo de siempre"): fondo claro con franja de color, para no confundirlos con las
   categorías, que son bloques macizos de color. */
.favs{background:var(--surface2);border-radius:12px;padding:8px 8px 10px;margin:0 0 14px}
.favs h3{font:700 1.15rem/1.2 var(--cond);margin:2px 4px 8px}
.key.fav{background:var(--surface);color:var(--ink);border:1px solid var(--line);padding-left:18px;box-shadow:inset 7px 0 0 var(--c),inset 0 -4px 0 var(--line)}
.key.fav small{color:var(--muted);opacity:1}
.key.fav .tag{font-weight:600;color:var(--accent)}
.keys-title{font:700 1.15rem/1.2 var(--cond);margin:0 4px 8px}
.mini{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:600 .95rem var(--cond);white-space:nowrap}
.mini.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.mine{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 12px;margin-bottom:12px}
.drow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow .acts{display:flex;gap:2px;flex-shrink:0}
.note{font-size:.8rem;color:var(--muted)}
.sub{font:600 1.05rem/1.2 var(--cond);color:var(--muted)}
.anot{font:600 1.15rem/1.2 var(--cond);color:var(--ink)}
.mine .drow>div>div:first-child{font-size:1.05rem}
.linkish{background:none;border:0;color:var(--muted);font:600 .9rem var(--body);padding:4px 6px}
.linkish.rm{color:var(--bad)}
.linkish.on{background:var(--ink);color:var(--bg);border-radius:6px}
.mixbox{background:var(--surface2);border-radius:8px;padding:8px;margin:0 0 8px}

.btn{display:block;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px 14px;font:600 1.15rem var(--cond);margin-top:10px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn.small{padding:8px 12px;font-size:1rem;margin-top:6px}
.btn:disabled{opacity:.45;cursor:default}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status{margin:10px 2px;color:var(--muted);font-size:.95rem}
.hint{color:var(--muted);padding:16px 4px;font-size:1.05rem}

.ticket{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;font-variant-numeric:tabular-nums}
.ticket h2{font:700 1.5rem var(--cond);margin:0 0 8px}
.line{display:grid;grid-template-columns:3ch 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.line .q{font:700 1.6rem/1 var(--cond);text-align:right}
.line .n{font:600 1.25rem/1.1 var(--cond)}
.total{display:flex;justify-content:space-between;font:700 1.6rem var(--cond);margin-top:12px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
input.price{width:5em;text-align:right}
input:disabled{opacity:.55}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}

.group{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.group h3{margin:0 0 8px;font:700 1.4rem/1.1 var(--cond);display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font:600 1.08rem var(--cond)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sug{border-color:var(--accent)}
.chip.drink{--c:#555;background:var(--c);color:#fff;border-color:transparent;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.chip.drink.done{background:var(--surface2);color:var(--muted);border-color:var(--line);text-decoration:line-through;text-shadow:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h2{font:700 1.35rem var(--cond);margin:0 0 8px}
.set-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.set-row input[type=text]{flex:1;min-width:0}
.x{background:none;border:0;color:var(--muted);font-size:1.2rem;padding:6px;flex-shrink:0}
.catbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px 10px 2px 6px;margin:8px 0}
.catbox.open{padding-bottom:10px}
.grpbox{border:1px dashed var(--line);border-radius:8px;padding:2px 8px;margin:8px 0}
.grpbox.open{padding-bottom:10px}
.fold{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;text-align:left;padding:10px 4px}
.fold .catname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fold .note{flex-shrink:0}
.buscar{width:100%;margin:0 0 10px;font-size:1.05rem;padding:10px 12px}
.found{border-bottom:1px solid var(--line);padding:6px 0}
.found:last-child{border-bottom:0}
.catname{font:700 1.1rem var(--cond)}
.emo{width:3.2em;text-align:center;padding:8px 4px;flex-shrink:0}
.set-row input.emo{flex:0 0 3em}
/* Fila de producto del editor de carta, en dos líneas: nombre a todo el ancho arriba,
   precio y botones debajo. */
.item2{flex-direction:column;align-items:stretch;gap:4px;padding:6px 0;margin:0;border-bottom:1px solid var(--line)}
.item2:last-child{border-bottom:0}
.item2 .l1,.item2 .l2{display:flex;align-items:center;gap:6px}
.item2 .l2{justify-content:flex-end}
.lock{width:2.2em;text-align:center;flex-shrink:0}
.paused{opacity:.6}
.grip{background:none;border:0;color:var(--muted);font-size:1.25rem;padding:6px 4px;flex-shrink:0;cursor:grab;touch-action:none}
.set-row.dragging,.catbox.dragging{opacity:.75;background:var(--surface2);border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.18)}

table{width:100%;border-collapse:collapse}
table th,table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
table th{font:600 .95rem var(--cond);color:var(--muted)}
table th:first-child,table td:first-child{text-align:left}
.pos{color:var(--good)}.neg{color:var(--bad)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));z-index:20}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%;max-width:420px;max-height:80vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.sheet h2{font:700 1.4rem var(--cond);margin:0 0 10px}
.sheet input[type=text]{width:100%}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
</style>

/* ===== Utilidades ===== */
const clone=o=>JSON.parse(JSON.stringify(o));
const $=s=>document.querySelector(s);
{const ic=$('link[rel="icon"][type="image/svg+xml"]'),lg=$("#logo");if(ic&&lg)lg.src=ic.href}   // el icono, también en la cabecera
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"});
const eur=v=>fmt.format(v||0);
const r2=v=>Math.round(v*100)/100;
const hhmm=ts=>ts?new Date(ts).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}):"";
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}

/* ===== Normalización (acepta datos de versiones anteriores) ===== */
function defaults(){return{
  config:{people:DEFAULT_PEOPLE.map((n,i)=>({id:"p"+(i+1),name:n,paused:false})),
          menus:[{id:"m1",name:DEFAULT_NAME,fromDefault:true,catalog:normCatalog(clone(DEFAULT_CATALOG))}],menu:"m1",assignerMode:"",pin:""},
  current:{n:1,name:"",bar:"",night:"",orders:{},delivered:{},shared:{}},rounds:[],bares:{}};}
// Bares (bar/precios → {bares:{id:{name,last,prices:{productoId:precio}}}}): cada bar guarda
// solo los precios que difieren de la carta.
function normBares(b){
  const out={};if(!b||typeof b!=="object")return out;
  Object.keys(b).forEach(id=>{const x=b[id];if(!x||typeof x!=="object"||!x.name)return;
    const pr={};Object.keys(x.prices||{}).forEach(k=>{const v=Number(x.prices[k]);if(!isNaN(v))pr[k]=v});
    out[id]={name:String(x.name).slice(0,40),last:Number(x.last)||0,prices:pr}});
  return out;
}
function normMix(m){
  if(!m)return null;
  const opts=(Array.isArray(m.options)?m.options:[]).map(o=>typeof o==="string"?{id:uid("o"),name:o,extra:0}:{id:(o&&o.id)||uid("o"),name:String(o&&o.name||""),extra:Number(o&&o.extra)||0}).filter(o=>o.name);
  if(!opts.length)return null;
  return{def:typeof m.def==="string"?m.def:opts[0].name,options:opts};
}
function normNode(n,depth){
  if(!n||!n.id)return null;
  if(n.group||Array.isArray(n.items))
    return{id:n.id,name:n.name||"?",emoji:n.emoji||"",group:true,mix:normMix(n.mix),
      items:depth>=1?[]:(n.items||[]).map(x=>normNode(x,depth+1)).filter(Boolean)};
  return{id:n.id,name:n.name||"?",price:Number(n.price)||0,emoji:n.emoji||"",mix:normMix(n.mix)};
}
function normCatalog(cat){
  if(!Array.isArray(cat)||!cat.length)return clone(DEFAULT_CATALOG);
  return cat.filter(c=>c&&c.id).map(c=>({id:c.id,name:c.name||"?",color:c.color||"#555",mix:normMix(c.mix),
    items:(Array.isArray(c.items)?c.items:[]).map(n=>normNode(n,0)).filter(Boolean)}));
}
function normList(v){
  if(v==null)return[];
  if(typeof v==="string")return v?[{drink:v}]:[];
  if(Array.isArray(v))return v.map(x=>typeof x==="string"?{drink:x}:(x&&typeof x==="object"?x:null)).filter(Boolean);
  if(typeof v==="object"&&(v.drink||v.custom))return[v];
  return[];
}
function normOrders(o){const r={};if(o&&typeof o==="object")Object.keys(o).forEach(k=>{const l=normList(o[k]);if(l.length)r[k]=l});return r}
const ticketOk=v=>(v!=null&&v!==""&&!isNaN(Number(v)))?r2(Number(v)):null;
// Raciones para compartir (010): shared = { id: { drink|custom, clarification?, price?, qty, who:[pid], ts, by } }.
function normShared(m){
  const out={};if(!m||typeof m!=="object")return out;
  Object.keys(m).forEach(id=>{const s=m[id];if(!s||(!s.drink&&!s.custom))return;
    const x={qty:Math.max(1,parseInt(s.qty,10)||1),who:Array.isArray(s.who)?s.who.filter(w=>typeof w==="string"):[],ts:Number(s.ts)||0,by:s.by||""};
    if(s.drink)x.drink=s.drink;else x.custom=String(s.custom).slice(0,40);
    if(s.clarification)x.clarification=String(s.clarification).slice(0,60);
    if(s.price!=null&&!isNaN(s.price))x.price=Number(s.price);
    out[id]=x});
  return out;
}

function parsePrice(x){
  const m=String(x==null?"":x).replace(/[^0-9,.\-]/g," ").trim().replace(",",".").match(/-?\d+(\.\d+)?/);
  return m?r2(parseFloat(m[0])):null;
}
function splitCells(line){
  if(line.indexOf("\t")>=0)return line.split("\t");
  if(line.indexOf(";")>=0)return line.split(";");
  if(line.indexOf("|")>=0)return line.split("|").filter(x=>x.trim()!=="");
  if(/,\s*\D/.test(line)&&line.split(",").length>2)return line.split(",");
  return [line];
}
function parseTable(txt){
  txt=String(txt||"").trim();
  if(!txt)return{cats:[],count:0,skipped:[]};
  if(txt[0]==="{"||txt[0]==="["){                       // JSON: se conserva tal cual, con grupos y opciones
    const r=parseMenu(txt);
    if(r.error)return{cats:[],count:0,skipped:[r.error]};
    return{menu:r.menu,cats:[],count:r.count,skipped:[],name:r.menu.name};
  }
  const cats=[],skipped=[];let cur=null,count=0;
  const push=(catName,name,price,emoji)=>{
    const cn=catName||"Importado";
    let c=cats.find(x=>canon(x.name)===canon(cn));
    if(!c){c={name:cn.slice(0,30),items:[]};cats.push(c)}
    if(c.items.some(it=>canon(it.name)===canon(name)))return;
    c.items.push({name:name.slice(0,30),price:price,emoji:emoji||""});count++;
  };
  txt.split(/\r?\n/).forEach(raw=>{
    const line=raw.trim();
    if(!line)return;
    if(/^(categor|producto|bebida|nombre|precio|concepto)/i.test(canon(line))&&parsePrice(line)===null)return; // cabecera de tabla
    let cells=splitCells(line).map(x=>x.trim()).filter((x,i,a)=>!(x===""&&a.length>1));
    if(cells.length>=3){
      const price=parsePrice(cells[cells.length-1]);
      if(price===null){skipped.push(line);return}
      push(cells[0],cells[cells.length-2],price);return;
    }
    if(cells.length===2){
      const price=parsePrice(cells[1]);
      if(price===null){cur=cells[0];return}
      push(cur,cells[0],price);return;
    }
    const m=line.match(/^(.*?)[\s.·:\-–]*(\d+(?:[.,]\d{1,2})?)\s*(?:€|eur|euros)?$/i);
    if(m&&m[1].trim()&&parsePrice(m[2])!==null){push(cur,m[1].trim(),parsePrice(m[2]));return}
    if(parsePrice(line)===null&&line.length<40){cur=line;return}   // línea sin precio = categoría
    skipped.push(line);
  });
  return{cats:cats.filter(c=>c.items.length),count,skipped};
}

  if(!sub)return t;

  if(!g){g={id:uid("g"),name:sub.slice(0,30),emoji:"",group:true,mix:null,items:[]};t.items.push(g)}

}

const campoOk=k=>/^[A-Za-z_][A-Za-z0-9_]*$/.test(k);

// Recalcula los suplementos automáticos de la ronda actual (no los precios puestos a mano)
// cuando cambia el bar o el precio de un producto en el bar. antes = cómo se calculaba hasta ahora.
function recalcAuto(antes,soloProducto){
  Object.keys(S.current.orders).forEach(pid=>{
    let cambia=false;
    const arr=drinks(pid).map(o=>{
      if(soloProducto&&o.drink!==soloProducto)return o;
      if(!antes(o))return o;
      const nuevo=priceWith(o.drink,o.clarification);
      if(Math.abs(nuevo-o.price)<0.005)return o;
      cambia=true;return Object.assign({},o,{price:nuevo});
    });
    if(cambia){S.current.orders[pid]=arr;writeOrders(pid)}
  });
}

  if(barId&&S.bares[barId]){S.bares[barId].last=Date.now();barWrite({["bares."+barId+".last"]:S.bares[barId].last})}
  if(mode==="firebase")curUpdate({bar:S.current.bar,name:S.current.name});else saveLocal();
  recalcAuto(eraAuto);

// Al cerrar una ronda con bar, el bar recuerda el precio de todo lo pedido (cerrar = darlo por
// bueno). Así, si después cambia la carta, lo ya pedido en ese bar no se descuadra. Los precios
// puestos a mano con € son excepciones de esa consumición y no se aprenden.
function aprenderPrecios(barId,orders){
  const b=S.bares[barId];if(!b)return;
  const campos={};
  Object.keys(orders).forEach(pid=>(orders[pid]||[]).forEach(o=>{
    if(!o||!o.drink||o.custom||isNada(o)||!IDX[o.drink])return;
    let base;
    if(o.price==null)base=precioBase(o.drink,barId);
    else if(precioAuto(o,barId))base=r2(o.price-extraOf(o.drink,o.clarification));
    else return;
    if(b.prices[o.drink]!=null&&Math.abs(b.prices[o.drink]-base)<0.005)return;
    b.prices[o.drink]=base;campos["bares."+barId+".prices."+o.drink]=base;
  }));
  if(Object.keys(campos).length)barWrite(campos);
}
// Qué consumiciones tenían el suplemento calculado por la app con el bar anterior.
function snapshotAuto(barId){const set=new Set();Object.keys(S.current.orders).forEach(pid=>drinks(pid).forEach(o=>{if(precioAuto(o,barId))set.add(o)}));return o=>set.has(o)}

function roundPrice(r,o){if(isNada(o))return 0;if(o.price!=null&&!isNaN(o.price))return Number(o.price)||0;if(r&&r.prices&&r.prices[o.drink]!=null)return Number(r.prices[o.drink])||0;return priceOf(o)}
function roundTotal(){return r2(people().reduce((s,p)=>s+drinks(p.id).reduce((ss,o)=>ss+priceOf(o),0),0)+compartidos().reduce((s,x)=>s+totalCompartido(x),0))}
function anyOrders(){return Object.keys(S.current.orders).some(k=>drinks(k).length)||compartidos().length>0}

/* --- raciones para compartir --- */
// Lista de raciones de la ronda en curso (o de una ronda cerrada r), de la más antigua a la más nueva.
const compartidos=r=>{const m=(r||S.current).shared||{};return Object.keys(m).map(id=>Object.assign({id},m[id])).sort((a,b)=>a.ts-b.ts)};
// Precio de una unidad: el propio si lo tiene; en una ronda cerrada, el de esa ronda; si no, el del bar o la carta.
function precioCompartido(s,r){
  if(s.price!=null&&!isNaN(s.price))return Number(s.price)||0;
  if(!s.drink)return 0;
  if(r){if(r.prices&&r.prices[s.drink]!=null)return Number(r.prices[s.drink])||0;return precioBase(s.drink,r.bar||"")}
  return precioBase(s.drink);
}
const totalCompartido=(s,r)=>r2(precioCompartido(s,r)*(s.qty||1));
// A partes iguales entre quienes comparten; los céntimos que sobran, uno a uno a los primeros
// (en el orden de la cuadrilla), para que la suma dé exacta.
function partesCompartido(s,r){
  const orden=people().map(p=>p.id),who=(s.who||[]).slice().sort((a,b)=>orden.indexOf(a)-orden.indexOf(b));
  const out={};if(!who.length)return out;
  const cts=Math.round(totalCompartido(s,r)*100),base=Math.floor(cts/who.length);let resto=cts-base*who.length;
  who.forEach(pid=>{out[pid]=(base+(resto>0?1:0))/100;if(resto>0)resto--});
  return out;
}

/* --- Corregir rondas cerradas (009): se editan en su sitio, sin reabrirlas. Cada cambio se
   guarda al momento en rounds/ y en el archivo, con su línea en el registro. --- */
const sumaRonda=r=>{let t=0;Object.keys(r.orders||{}).forEach(pid=>(r.orders[pid]||[]).forEach(o=>{t+=roundPrice(r,o)}));compartidos(r).forEach(s=>{t+=totalCompartido(s,r)});return r2(t)};
// El total guardado no cuadra con la suma de sus líneas: rondas cerradas con el fallo de la 008.
const rondaDescuadrada=r=>Math.abs(sumaRonda(r)-(Number(r.total)||0))>=0.005;
function guardarRonda(r,what,sinRecalcular){
  if(!sinRecalcular)r.total=sumaRonda(r);
  if(what)r.log=(r.log||[]).concat([logLine(what)]);
  actualizarResumen();

  const doc=clone(Object.assign({},r));delete doc.id;

}
function gruposRonda(r){
  const gs={},order=[];
  Object.keys(r.orders||{}).forEach(pid=>(r.orders[pid]||[]).forEach((o,i)=>{
    if(isNada(o))return;
    const pr=roundPrice(r,o);
    const k=(o.custom?"c:"+canon(o.custom):"d:"+o.drink)+"|"+canon(o.clarification||"")+"|"+r2(pr)+"|"+(o.price!=null?"p":"");
    if(!gs[k]){gs[k]={o,count:0,items:[],price:pr};order.push(k)}
    gs[k].count++;gs[k].items.push({pid,i});
  }));
  return order.map(k=>gs[k]).sort((a,b)=>b.count-a.count||label(a.o).localeCompare(label(b.o),"es")||canon(a.o.clarification||"").localeCompare(canon(b.o.clarification||"")));
}
// Cambia el precio de una línea de una ronda cerrada. Sin precio propio, cambia el del producto
// en esa ronda; con precio propio, el de esas consumiciones. Si la ronda tenía bar, el bar lo
// aprende (sin el suplemento si es una mezcla), salvo los precios puestos a mano.
function corregirPrecio(r,g,v){
  const o=g.o,ex=o.drink?extraOf(o.drink,o.clarification):0;
  let aprende=null;
  if(o.price==null&&o.drink&&!o.custom){r.prices=Object.assign({},r.prices,{[o.drink]:r2(v)});aprende=r2(v)}
  else{g.items.forEach(x=>{const a=r.orders[x.pid];if(a&&a[x.i])a[x.i]=Object.assign({},a[x.i],{price:r2(v)})});if(o.drink&&!o.custom&&ex)aprende=r2(v-ex)}
  guardarRonda(r,`Precio de ${gLabel(o)}: ${eur(g.price)} → ${eur(v)}`);
  if(aprende!=null&&aprende>=0&&r.bar&&S.bares[r.bar]){
    const eraAuto=S.current.bar===r.bar?snapshotAuto(r.bar):null;
    setBarPrice(r.bar,o.drink,aprende);
    if(eraAuto)recalcAuto(eraAuto,o.drink);
  }
}

  return`<p class="status" style="color:var(--bad)">${d>0?`Faltan ${eur(d)}: el ticket es mayor que lo apuntado`:`Sobran ${eur(-d)}: el ticket es menor que lo apuntado`}</p>`;
}

/* ===== Cálculos ===== */
function sortedRounds(){return S.rounds.slice().sort((a,b)=>a.n-b.n)}
function lastDrinkOf(pid){const rs=sortedRounds();for(let i=rs.length-1;i>=0;i--){const ds=(rs[i].orders||{})[pid];if(ds&&ds.length){const o=ds[ds.length-1];if(o.drink&&!isNada(o)&&IDX[o.drink])return o.drink}}return null}
function inActive(id){                       // traduce un producto a su equivalente en la carta activa
  const it=IDX[id];if(!it)return{id,same:true};
  let here=null,alt=null;const c0=canon(it.name);
  eachCatalog(catalog(),n=>{if(n.group)return;if(n.id===id)here=n.id;if(!alt&&canon(n.name)===c0)alt=n.id});
  if(here)return{id:here,same:true};
  return alt?{id:alt,same:true,moved:true}:{id,same:false};
}
function shortcuts(pid,max){
  const rs=sortedRounds(),n=rs.length,w={},meta={};
  const bump=(o,weight)=>{
    if(!o||o.custom||isNada(o)||!o.drink)return;
    const act=inActive(o.drink);if(!act.same)return;
    const key=act.id+"|"+(o.clarification||"");
    w[key]=(w[key]||0)+weight;meta[key]={id:act.id,clar:o.clarification||""};
  };
  rs.forEach((r,i)=>{const w0=Math.pow(0.5,Math.max(0,(n-1-i)-1));((r.orders||{})[pid]||[]).forEach(o=>bump(o,w0))});
  drinks(pid).forEach(o=>bump(o,1));
  let keys=Object.keys(w).sort((a,b)=>w[b]-w[a]);
  let lastKey=null;
  for(let i=rs.length-1;i>=0&&!lastKey;i--){
    const ds=(rs[i].orders||{})[pid]||[];
    for(let k=ds.length-1;k>=0;k--){
      const o=ds[k];if(o.custom||isNada(o)||!o.drink)continue;
      const act=inActive(o.drink);if(!act.same)continue;
      lastKey=act.id+"|"+(o.clarification||"");meta[lastKey]=meta[lastKey]||{id:act.id,clar:o.clarification||""};break;
    }
  }
  if(lastKey){keys=[lastKey].concat(keys.filter(k=>k!==lastKey));meta[lastKey]=Object.assign({},meta[lastKey],{ultima:true})}
  return keys.slice(0,max).map(k=>meta[k]).filter(m=>m&&IDX[m.id]&&!IDX[m.id].group);
}
function favDrink(pid){const d={};S.rounds.forEach(r=>((r.orders||{})[pid]||[]).forEach(o=>{if(isNada(o))return;const k=o.custom||o.drink;if(k)d[k]=(d[k]||0)+1}));let best=null,max=0;Object.keys(d).forEach(x=>{if(d[x]>max){best=x;max=d[x]}});return best?{k:best,n:max}:null}
function balances(){
  const b={},drank={},paid={},times={};
  people().forEach(p=>{b[p.id]=0;drank[p.id]=0;paid[p.id]=0;times[p.id]=0});
  S.rounds.forEach(r=>{
    Object.keys(r.orders||{}).forEach(pid=>{if(pid in drank)(r.orders[pid]||[]).forEach(o=>{drank[pid]+=roundPrice(r,o)})});
    compartidos(r).forEach(s=>{const pt=partesCompartido(s,r);Object.keys(pt).forEach(pid=>{if(pid in drank)drank[pid]+=pt[pid]})});
    if(r.payer in paid){paid[r.payer]+=Number(r.total)||0;times[r.payer]++}
  });
  // Pagos entre personas (015): quien paga sube su saldo y quien cobra lo baja.
  const pag={};people().forEach(p=>{pag[p.id]=0});
  (S.pagos||[]).forEach(x=>{if(x.de in pag)pag[x.de]+=x.importe;if(x.a in pag)pag[x.a]-=x.importe});
  people().forEach(p=>{b[p.id]=r2(paid[p.id]-drank[p.id]+pag[p.id])});
  return{b,drank,paid,times,pag};
}

/* --- Pagos entre personas (015): noches/{noche}/pagos/{id} = { de, a, importe, ts, by }.
   Cada pago, documento aparte: dos móviles apuntando a la vez no se pisan, y cerrar una ronda
   (que reescribe la noche) no los toca. --- */
S.pagos=[];
let unsubPagos=null,pagosDe="",avisoPagos="";
const pagoPath=id=>"noches/"+NOCHE+"/pagos/"+id;
function normPago(id,d){d=d||{};const v=r2(Number(d.importe)||0);if(!d.de||!d.a||d.de===d.a||!(v>0))return null;return{id,de:d.de,a:d.a,importe:v,ts:Number(d.ts)||0,by:d.by||""}}
function escucharPagos(){
  if(!db||!SALA||!NOCHE||pagosDe===NOCHE)return;
  if(typeof unsubPagos==="function")unsubPagos();
  const id=NOCHE;pagosDe=id;S.pagos=[];
  unsubPagos=colRef("noches").doc(id).collection("pagos").onSnapshot(qs=>{
    if(id!==NOCHE)return;
    S.pagos=qs.docs.map(x=>normPago(x.id,x.data())).filter(Boolean).sort((a,b)=>a.ts-b.ts);avisoPagos="";render();
  },e=>{
    console.warn("pagos:",e);
    if(String(e&&(e.code||e.message)||"").toLowerCase().indexOf("permission")>=0)avisoPagos="Faltan las reglas nuevas de Firestore para los pagos (versión 015). Lo demás funciona; los pagos no se pueden apuntar hasta pegarlas en la consola de Firebase y volver a abrir la app.";
    render();
  });
}
function crearPago(de,a,v){
  if(!de||!a||de===a||!(v>0))return false;
  const id=uid("g"),x={de,a,importe:r2(v),ts:Date.now(),by:me||""};
  S.pagos=S.pagos.concat([Object.assign({id},x)]);
  if(mode==="firebase")dbSet(pagoPath(id),x);else saveLocal();
  return true;
}
function suggestPayer(B){
  let c=activePeople().filter(p=>drinks(p.id).some(o=>!isNada(o)));
  if(!c.length)c=activePeople();
  if(!c.length)c=people();
  return c.slice().sort((x,y)=>(B.b[x.id]-B.b[y.id])||(B.times[x.id]-B.times[y.id]))[0].id;
}
function settle(b){
  const d=[],c=[];
  people().forEach(p=>{const v=Math.round((b[p.id]||0)*100);if(v<0)d.push({id:p.id,v:-v});else if(v>0)c.push({id:p.id,v})});
  d.sort((x,y)=>y.v-x.v);c.sort((x,y)=>y.v-x.v);
  const o=[];let i=0,j=0;
  while(i<d.length&&j<c.length){const m=Math.min(d[i].v,c[j].v);o.push({from:d[i].id,to:c[j].id,v:m/100});d[i].v-=m;c[j].v-=m;if(!d[i].v)i++;if(!c[j].v)j++}
  return o;
}
let GROUPS=[];
function comandaGroups(){
  const gs={},order=[];
  Object.keys(S.current.orders).forEach(pid=>drinks(pid).forEach((o,i)=>{
    if(isNada(o))return;
    const k=(o.custom?"c:"+canon(o.custom):"d:"+o.drink)+"|"+canon(o.clarification||"")+"|"+(o.price!=null?r2(o.price):"");
    if(!gs[k]){gs[k]={o,count:0,items:[]};order.push(k)}
    gs[k].count++;gs[k].items.push({pid,i});
  }));
  GROUPS=order.map(k=>gs[k]).sort((a,b)=>b.count-a.count||label(a.o).localeCompare(label(b.o),"es")||canon(a.o.clarification||"").localeCompare(canon(b.o.clarification||"")));
  return GROUPS;
}

      ? `<input class="price" type="number" step="0.05" inputmode="decimal" value="${r2(priceOf(o))}" data-gidx="${gi}"> €`
      : `<input class="price" type="number" step="0.05" inputmode="decimal" value="${r2(priceOf(o))}" data-bprice="${esc(o.drink)}"${auto?` data-extra="${extraOf(o.drink,o.clarification)}"`:""}> €`;
    const nota=own?"precio propio de esta ronda":auto?`incluye suplemento +${eur(extraOf(o.drink,o.clarification))}`:"";
    return `<div class="line"><span class="q">${g.count}</span><span><span class="n">${emoji(o)} ${esc(label(o))}</span>${o.clarification?`<br><span class="anot">· ${esc(o.clarification)}</span>`:""}${nota?`<br><span class="note">${nota}</span>`:""}</span><span>${cell}</span></div>`;
  }).join("");
  // Raciones para compartir: una línea cada una. El precio es el de una unidad.
  h+=ss.map(s=>{
    const own=s.custom||s.price!=null,n=(s.who||[]).length;
    const cell=own
      ? `<input class="price" type="number" step="0.05" inputmode="decimal" value="${r2(precioCompartido(s))}" data-sprice="${s.id}"> €`
      : `<input class="price" type="number" step="0.05" inputmode="decimal" value="${r2(precioCompartido(s))}" data-bprice="${esc(s.drink)}"> €`;
    return `<div class="line"><span class="q">${s.qty}</span><span><span class="n">${emoji(s)} ${esc(label(s))}</span>${s.clarification?`<br><span class="anot">· ${esc(s.clarification)}</span>`:""}<br><span class="note">🍽️ para compartir entre ${n}${n?` · ${eur(totalCompartido(s)/n)} cada uno`:""}${s.qty>1?" · precio por unidad":""}</span></span><span>${cell}</span></div>`;
  }).join("");
  h+=`<div class="total"><span>Total</span><span>${eur(roundTotal())}</span></div>`;
  h+=campoTicket("ticket",S.current.ticket)+cuadreTicket(roundTotal(),S.current.ticket)+`</div>`;
  if(nada.length)h+=`<p class="status">🚫 No toman nada: ${esc(nada.join(", "))}</p>`;
  if(faltan.length)h+=`<p class="status">Sin pedir: ${esc(faltan.join(", "))}</p>`;
  h+=`<button class="btn" data-act="copy">📋 Copiar comanda</button>`;
  h+=`<button class="btn primary" data-act="tab" data-id="cuentas">Cerrar ronda y pasar a la siguiente →</button>`;
  return h;
}

function vReparto(){
  const del=S.current.delivered;
  const rows=people().map(p=>({p,ds:drinks(p.id).map((o,i)=>({o,i})).filter(x=>!isNada(x.o))})).filter(x=>x.ds.length);
  const ss=compartidos();
  if(!rows.length&&!ss.length)return`<p class="hint">No hay nada que repartir en la ronda ${S.current.n}.</p>`;
  let total=0,done=0;
  rows.forEach(r=>r.ds.forEach(x=>{total++;if(del[r.p.id+"_"+x.i])done++}));
  ss.forEach(s=>{total++;if(del["s_"+s.id])done++});
  // Las raciones para compartir son una sola entrega, para la mesa.
  const grupoMesa=ss.length?`<div class="group" style="margin-top:10px"><h3><span>🍽️ Para compartir</span></h3><div class="chips">${ss.map(s=>`<button class="chip drink${del["s_"+s.id]?" done":""}" style="--c:${colorOf(s)}" data-act="deliverShared" data-id="${s.id}">${s.qty>1?s.qty+"× ":""}${emoji(s)} ${esc(label(s))}${s.clarification?" · "+esc(s.clarification):""}</button>`).join("")}</div></div>`:"";
  let h=`<p class="status">${total-done} de ${total} por entregar.</p>`;
  h+=`<div class="row2"><button class="mini${ui.repView==="persona"?" on":""}" data-act="repView" data-id="persona">Por persona</button><button class="mini${ui.repView==="bebida"?" on":""}" data-act="repView" data-id="bebida">Por bebida</button></div>`;
  h+=`<div class="row2"><button class="btn small" data-act="deliverAll">✓ Marcar todo</button><button class="btn small" data-act="deliverNone">↺ Desmarcar todo</button></div>`;
  if(ui.repView==="persona"){
    rows.forEach(r=>{
      const pend=r.ds.filter(x=>!del[r.p.id+"_"+x.i]).length;
      h+=`<div class="group" style="margin-top:10px"><h3><span>${esc(r.p.name)}</span><button class="mini${pend?"":" on"}" data-act="deliverPerson" data-pid="${r.p.id}">${pend?"✓ Todo":"↺ Deshacer"}</button></h3><div class="chips">`;
      r.ds.forEach(x=>{
        const on=!!del[r.p.id+"_"+x.i];
        h+=`<button class="chip drink${on?" done":""}" style="--c:${colorOf(x.o)}" data-act="deliver" data-pid="${r.p.id}" data-idx="${x.i}">${emoji(x.o)} ${esc(label(x.o))}${x.o.clarification?" · "+esc(x.o.clarification):""}</button>`;
      });
      h+='</div></div>';
    });
  }else{
    comandaGroups().forEach((g,gi)=>{
      const pend=g.items.filter(x=>!del[x.pid+"_"+x.i]).length;
      h+=`<div class="group" style="margin-top:10px;border-left:7px solid ${colorOf(g.o)}"><h3><span>${g.count}× ${emoji(g.o)} ${esc(label(g.o))}${g.o.clarification?` <span class="anot">· ${esc(g.o.clarification)}</span>`:""}</span><button class="mini${pend?"":" on"}" data-act="deliverGroup" data-gidx="${gi}">${pend?"✓ Todo":"↺ Deshacer"}</button></h3><div class="chips">`;
      g.items.forEach(x=>{
        const on=!!del[x.pid+"_"+x.i];
        h+=`<button class="chip drink${on?" done":""}" style="--c:${colorOf(g.o)}" data-act="deliver" data-pid="${x.pid}" data-idx="${x.i}">${esc(pname(x.pid))}</button>`;
      });
      h+='</div></div>';
    });
  }
  h+=grupoMesa;
  if(total&&done===total)h+=`<button class="btn primary" data-act="tab" data-id="cuentas">Todo entregado → Cerrar ronda</button>`;
  return h;
}

    ps.forEach(p=>{const v=B.b[p.id],g=B.pag[p.id];h+=`<tr class="${p.paused?"paused":""}"><td>${p.paused?"⏸ ":""}${esc(p.name)}</td><td>${eur(B.drank[p.id])}</td><td>${eur(B.paid[p.id])}</td>${conPagos?`<td>${Math.abs(g)<0.005?"—":(g>0?"+":"")+eur(g)}</td>`:""}<td class="${v>0.004?"pos":v<-0.004?"neg":""}">${v>0?"+":""}${eur(v)}</td></tr>`});
    h+="</tbody></table></section>";
    // Para quedar en paz: cada línea se salda de un toque; «＋ Apuntar un pago» para cualquier otro importe.
    if(st.length)h+=`<section class="card"><h2>Para quedar en paz</h2>${st.map(s=>`<div class="drow"><div>${esc(pname(s.from))} → ${esc(pname(s.to))}: <b>${eur(s.v)}</b></div>${avisoPagos?"":`<div class="acts"><button class="mini" data-act="pagoSaldar" data-de="${s.from}" data-a="${s.to}" data-v="${s.v}">✓ Pagado</button></div>`}</div>`).join("")}</section>`;
    else if(S.rounds.length)h+=`<section class="card"><h2 class="pos">✓ Todo en paz</h2><p class="note">Nadie debe nada a nadie en esta noche.</p></section>`;

    h+=S.pagos.length?S.pagos.map(x=>`<div class="drow"><div><div>${esc(pname(x.de))} → ${esc(pname(x.a))}: <b>${eur(x.importe)}</b></div><div class="note">${hhmm(x.ts)} · apuntó ${esc(byName(x.by))}</div></div><div class="acts"><button class="linkish rm" data-act="pagoBorrar" data-id="${x.id}" aria-label="Quitar este pago">✕</button></div></div>`).join(""):`<p class="note">Cuando alguien le dé dinero a otro para quedar en paz, apúntalo aquí. Puede ser justo lo que debe, menos o más: los saldos se recalculan.</p>`;
    if(ui.pagoForm&&!avisoPagos){
      const f=ui.pagoForm,quien=ps.filter(p=>!p.paused||Math.abs(B.b[p.id])>0.004||B.drank[p.id]>0||B.paid[p.id]>0);
      const sug=f.de&&f.a?(st.find(s=>s.from===f.de&&s.to===f.a)||{}).v:null;
      h+=`<p class="note" style="margin:10px 0 4px">¿Quién paga?</p><div class="chips">${quien.map(p=>`<button class="chip${f.de===p.id?" on":""}" data-act="pagoDe" data-id="${p.id}">${esc(p.name)}</button>`).join("")}</div>`;
      h+=`<p class="note" style="margin:10px 0 4px">¿A quién?</p><div class="chips">${quien.filter(p=>p.id!==f.de).map(p=>`<button class="chip${f.a===p.id?" on":""}" data-act="pagoA" data-id="${p.id}">${esc(p.name)}</button>`).join("")}</div>`;
      h+=`<div class="set-row" style="margin-top:10px"><label for="pagoImporte" style="flex:1">¿Cuánto?</label><input id="pagoImporte" class="price" type="number" step="0.05" inputmode="decimal" value="${sug!=null?sug:""}" placeholder="0,00"> €</div>`;

    h+=`</section>`;
  }
  if(S.rounds.length){
    const last=sortedRounds()[S.rounds.length-1];
    h+=`<section class="card"><h2>Historial</h2>`;
    sortedRounds().slice().reverse().forEach(r=>{
      const tk=ticketOk(r.ticket),avisos=[];
      if(tk!=null)avisos.push(Math.abs(tk-r.total)<0.005?"✓ cuadra con el ticket":`⚠️ no cuadra con el ticket (${eur(tk)})`);
      if(rondaDescuadrada(r))avisos.push("⚠️ revisar precios");
      h+=`<div class="drow"><div><div>${esc(roundLabel(r))} · ${hhmm(r.ts)} · <b>${eur(r.total)}</b></div><div class="note">${r.payer?"pagó "+esc(pname(r.payer)):"⚠️ sin pagar"}${avisos.length?" · "+avisos.join(" · "):""}</div></div><div class="acts"><button class="linkish" data-act="editRound" data-id="${r.id}">✏️ corregir</button>${r.id===last.id?`<button class="linkish" data-act="undo">↶ reabrir</button>`:""}</div></div>`;
      if((r.log||[]).length)h+=`<div class="note" style="margin:-2px 0 8px">${r.log.slice(-4).map(l=>`${hhmm(l.ts)} · ${esc(byName(l.by))}: ${esc(l.what)}`).join("<br>")}</div>`;
    });
    h+=`</section>`;
  }
  if(mode==="firebase"&&NOCHE&&S.noches[NOCHE]){

  }
  return h;
}

function vBaresAjustes(){
  const bs=baresRecientes();
  let h=`<section class="card"><h2>Bares</h2><p class="note">Cada bar recuerda lo que os ha cobrado: los precios corregidos en la Comanda y, al cerrar cada ronda, los de todo lo pedido. Lo que nunca se ha pedido allí sale con el precio de la carta. Toca un bar para ver sus precios y quitar alguno que se guardó por error.</p>`;
  if(!bs.length)return h+`<p class="hint">Aún no hay bares. Se crean al elegir el bar de la ronda (botón «Ronda» de arriba).</p></section>`;
  bs.forEach(b=>{
    const ks=Object.keys(b.prices),open=ui.barOpen===b.id;
    const nDif=ks.filter(k=>!IDX[k]||Math.abs(Number(IDX[k].price)-b.prices[k])>=0.005).length;
    h+=`<div class="set-row"><input type="text" value="${esc(b.name)}" data-barname="${b.id}" aria-label="Nombre del bar"><button class="mini${open?" on":""}" data-act="barOpen" data-id="${b.id}">${ks.length} precio${ks.length===1?"":"s"}${nDif?` · ${nDif} ≠`:""} ${open?"▾":"▸"}</button><button class="x" data-act="rmBar" data-id="${b.id}" aria-label="Borrar bar">🗑</button></div>`;
    if(open){
      if(!ks.length)h+=`<p class="note" style="margin:0 0 10px 4px">Todo a precio de carta.</p>`;
      else{
        // Primero los que difieren de la carta, que es lo que interesa ver de un vistazo.
        const dif=k=>!IDX[k]||Math.abs(Number(IDX[k].price)-b.prices[k])>=0.005;
        const orden=ks.slice().sort((x,y)=>(dif(y)-dif(x))||String(IDX[x]?IDX[x].name:x).localeCompare(String(IDX[y]?IDX[y].name:y),"es"));
        h+=`<div style="margin:0 0 10px 4px">${orden.map(k=>{const it=IDX[k],d=dif(k);return `<div class="drow"><span>${esc(it?(it.emoji?it.emoji+" ":"")+it.name:"(producto borrado)")}: <b>${eur(b.prices[k])}</b> <span class="note">${d?`≠ carta ${it?eur(it.price):"—"}`:"= carta"}</span></span><button class="linkish rm" data-act="rmBarPrice" data-id="${b.id}" data-item="${esc(k)}">Quitar</button></div>`}).join("")}</div>`;
      }
    }
  });
  return h+'</section>';
}

function vNoches(){

  cs.sort((a,b)=>ult(b)-ult(a)||a.name.localeCompare(b.name,"es"));
  const bloque=(titulo,mias,cid)=>{
    const todas=!!(ui.carpetaTodas&&ui.carpetaTodas[cid||"-"]),vis=todas?mias:mias.slice(0,5);
    // 🗑 solo en carpetas vacías (y nunca en «Otras», que es donde van las noches sueltas).

function vCartaBusqueda(q,used){
  // Busca en el nombre del producto y en el de su subgrupo ("ron" encuentra los rones).

    if(nd.group)(nd.items||[]).forEach(it=>{if(canon(it.name).includes(q)||canon(nd.name).includes(q))hits.push({it,ruta:c.name+" › "+nd.name})});

}

function render(force){

  pending=false;
  reindex();

  if(mode==="firebase"&&(netCache||netPending))$("#sync").className="sync off";
  document.querySelector("nav.tabs").style.display=(SALA&&!ui.salaError)?"":"none";
  document.querySelectorAll("nav.tabs button").forEach(b=>{b.dataset.id===ui.tab?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current")});
  // Barra con la noche en la que estás, siempre a la vista (con conexión).
  const nb=$("#nocheBtn"),conNoches=SALA&&!ui.salaError&&mode==="firebase";
  nb.style.display=conNoches?"":"none";
  if(conNoches)nb.innerHTML=NOCHE&&S.noches[NOCHE]?`📁 ${esc(nombreCarpeta(S.noches[NOCHE].carpeta))} › <b>${esc(S.noches[NOCHE].titulo)}</b> <span aria-hidden="true">▾</span>`:"Cargando las noches…";
  let html;

  const esperandoNoche=mode==="firebase"&&SALA&&!NOCHE&&["pedir","comanda","reparto","cuentas","stats","ronda"].includes(ui.tab);
  if(conNoches&&avisoReglas)nb.textContent="⚠️ Faltan las reglas nuevas";
  try{html=avisoReglas&&esperandoNoche?`<p class="status" style="color:var(--bad)">⚠️ ${esc(avisoReglas)}</p>`:esperandoNoche?`<p class="hint">Cargando las noches…</p>`:VIEWS[ui.tab]()}catch(err){console.error(err);html=`<p class="hint">⚠️ Error en esta pestaña: ${esc(err.message)}</p>`}
  $("#view").innerHTML=html;

}
document.addEventListener("focusout",()=>setTimeout(()=>{if(pending)render()},0));

/* ===== Eventos ===== */

      const pids=(share||first)?[]:(ui.multi?ui.group.slice():[ui.sel]);
      if(!share&&!first&&!pids.length){flash("Elige al menos una persona");return}
      const who=pids.length>1?pids.length+" personas":(pids.length?pname(pids[0]):"");
      let d;
      if(b.dataset.act==="pickOther"){
        const n=prompt(`${who}: ¿qué bebida?`);if(!n||!n.trim())return;
        const pr=parseFloat(String(prompt("¿Precio en € (por unidad)?","2")||"0").replace(",","."))||0;
        d={custom:n.trim().slice(0,40),price:r2(pr)};
      }else if(id==="nada"){d={drink:"nada"}}
      else{
        d={drink:id};
        const mix=b.dataset.mix!==undefined?b.dataset.mix:defMix(id);
        if(mix)d.clarification=mix;
        const ex=extraOf(id,mix);if(ex)d.price=priceWith(id,mix);
        if(askNote&&!mix){const c=prompt(`${who}: ${IDX[id]?IDX[id].name:""}\nAclaración (opcional):`,"");if(c&&c.trim())d.clarification=c.trim().slice(0,60)}
      }
      // Para compartir: por defecto la comparten todos los activos; se desmarca a quien no.
      if(share){ui.sharePending=Object.assign(tidy(d),{qty:1});ui.share=false;ui.group=activePeople().map(p=>p.id);ui.path=[];break}
      if(first){ui.pending=tidy(d);ui.path=[];ui.group=[];break}
      addDrinks(pids,d);
      ui.editMix=null;
      ui.lastAdd=(d.drink&&d.drink!=="nada"&&mixOf(d.drink))?{itemId:d.drink,items:pids.map(p=>({pid:p,idx:drinks(p).length-1}))}:null;
      ui.path=[];ui.multi=false;ui.group=[];flash(`${label(d)}${d.clarification?" "+d.clarification:""} → ${who}`);break;
    }
    case"note":{
      if(isLocked())return;
      const pid=b.dataset.pid,idx=parseInt(b.dataset.idx,10),o=drinks(pid)[idx];
      if(o&&o.drink&&mixOf(o.drink)){                       // tiene mezclas: abre los botones
        ui.editMix=(ui.editMix&&ui.editMix.pid===pid&&ui.editMix.idx===idx)?null:{pid,idx};
        ui.lastAdd=null;break;
      }
      const cur=(o||{}).clarification||"";
      const v=prompt("Aclaración (p. ej. sin espuma, con hielo). Vacío para quitarla:",cur);
      if(v===null)return;setNote(b.dataset.pid,parseInt(b.dataset.idx,10),v.trim().slice(0,60));break;
    }
    case"removeDrink":if(!isLocked())removeDrink(b.dataset.pid,parseInt(b.dataset.idx,10));break;
    case"itemPrice":{
      if(isLocked())return;
      const o=drinks(b.dataset.pid)[b.dataset.idx];if(!o)return;
      const v=prompt(`Precio de esta consumición (${label(o)}). Vacío = precio de la carta:`,String(r2(priceOf(o))));
      if(v===null)return;

    }
    case"flow":ui.flow=id;ui.pending=null;ui.path=[];ui.lastAdd=null;ui.group=[];ui.multi=false;break;
    case"pendingCancel":ui.pending=null;ui.group=[];break;

    }

    case"shareCancel":ui.share=false;ui.sharePending=null;ui.shareEdit=null;ui.group=[];ui.path=[];break;

      ui.sharePending=null;ui.group=[];ui.path=[];break;
    }
    case"shareWho":{const s=(S.current.shared||{})[id];if(!s||isLocked())return;ui.shareEdit=id;ui.group=(s.who||[]).filter(p=>findP(p)&&!findP(p).paused);window.scrollTo(0,0);break}
    case"shareSaveWho":{
      const s=(S.current.shared||{})[ui.shareEdit];if(!s||isLocked())return;

      const pausados=(s.who||[]).filter(p=>findP(p)&&findP(p).paused);

    case"shareQtyOf":{const s=(S.current.shared||{})[id];if(!s||isLocked())return;const q=Math.max(1,(s.qty||1)+parseInt(b.dataset.n,10));if(q===s.qty)return;s.qty=q;writeShared(id);break}
    case"sharePrice":{
      const s=(S.current.shared||{})[id];if(!s||isLocked())return;
      const v=prompt(`Precio de cada ${label(s)}${s.drink?" (vacío = el del bar o la carta)":""}:`,String(r2(precioCompartido(s))));if(v===null)return;
      const t=String(v).trim().replace(",",".");

    }

    }
    case"multiOn":ui.multi=true;ui.group=ui.sel?[ui.sel]:[];ui.path=[];ui.lastAdd=null;break;

    case"freeNote":{
      if(isLocked())return;
      const tg=mixTargets();if(!tg.length)return;
      const cur=(drinks(tg[0].pid)[tg[0].idx]||{}).clarification||"";
      const v=prompt("Aclaración libre (vacío para quitarla):",cur);

        const arr=drinks(x.pid).slice(),o=arr[x.idx];if(!o)return;

        if(name)n.clarification=name;else delete n.clarification;

            if(o.custom)d={custom:o.custom,price:o.price};

            if(d.drink&&extraOf(d.drink,d.clarification))d.price=priceWith(d.drink,d.clarification);   // el suplemento de la mezcla

          });
          k++;
        }
      });
      flash(k?`Repetido a ${k} persona${k>1?"s":""}${fuera?` · ${fuera} no está${fuera>1?"n":""} en esta carta`:""}`:"No falta nadie de la última ronda");break;
    }
    case"modal":ui.modal=id;if(id==="round"){ui.barQ=S.current.bar?"":(S.current.name||"");setTimeout(()=>{const el=document.getElementById("barInput");if(el)el.focus()},0)}break;
    case"modalClose":ui.modal=null;break;
    case"noop":return;
    case"setMe":{me=id;lsSet("ronda.me",me);ui.sel=me;ui.modal=null;break}

    case"repView":ui.repView=id;break;
    case"deliver":toggleDelivered(b.dataset.pid,parseInt(b.dataset.idx,10));break;

    // Corregir una ronda cerrada: el PIN se pide una vez, al entrar.
    case"editRound":if(!S.rounds.some(r=>r.id===id))return;if(!requirePin())return;ui.editRound=id;ui.rsWho=null;ui.rsGroup=[];ui.tab="ronda";window.scrollTo(0,0);break;

    case"rsWho":{const r=S.rounds.find(x=>x.id===ui.editRound);const s=r&&r.shared&&r.shared[id];if(!s)return;ui.rsWho=id;ui.rsGroup=(s.who||[]).slice();window.scrollTo(0,0);break}

/* --- arrastrar y soltar (ratón y dedo) --- */
let dragging=null;
const kids=list=>Array.prototype.filter.call(list.children,c=>c.dataset&&c.dataset.key);
document.addEventListener("pointerdown",e=>{
  const g=e.target.closest&&e.target.closest("[data-grip]");if(!g)return;
  const row=g.closest("[data-key]"),list=g.closest("[data-droplist]");
  if(!row||!list)return;
  e.preventDefault();
  dragging={row,list,ptr:e.pointerId};
  row.classList.add("dragging");
  try{g.setPointerCapture(e.pointerId)}catch(_){}
});
document.addEventListener("pointermove",e=>{
  if(!dragging)return;
  e.preventDefault();
  const rows=kids(dragging.list);
  for(let k=0;k<rows.length;k++){
    const r=rows[k];if(r===dragging.row)continue;
    const b=r.getBoundingClientRect();
    if(e.clientY>=b.top&&e.clientY<=b.bottom){
      dragging.list.insertBefore(dragging.row,e.clientY<b.top+b.height/2?r:r.nextSibling);
      break;
    }
  }
});
function endDrag(){
  if(!dragging)return;
  const list=dragging.list;
  dragging.row.classList.remove("dragging");
  const ids=kids(list).map(r=>r.dataset.key),kind=list.dataset.droplist;
  dragging=null;
  commitOrder(kind,ids);
}
document.addEventListener("pointerup",endDrag);
document.addEventListener("pointercancel",endDrag);

function copyOut(txt,okMsg){
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject())
    .then(()=>flash(okMsg))

}

// Tras abrir una categoría o subgrupo, que quede arriba en pantalla (si no, al cerrarse la de
// arriba, la recién abierta puede quedar fuera de la vista).
function alTope(id){setTimeout(()=>{const el=document.querySelector(`#view [data-key="${id}"]`);if(el&&el.scrollIntoView)el.scrollIntoView({block:"start"})},0)}
document.addEventListener("change",e=>{
  if(e.target&&e.target.id==="impText"){ui.impText=e.target.value;render(true);return}
  const t=e.target;
  if(t.id==="selectMe"){me=t.value||null;lsSet("ronda.me",me);ui.sel=me;render(true);return}
  if(t.dataset.gidx){const v=parseFloat(String(t.value).replace(",","."));if(isNaN(v)||v<0)return;const g=GROUPS[parseInt(t.dataset.gidx,10)];if(g)setGroupPrice(g.items,v);render(true);return}
  if(t.dataset.sprice){                 // Comanda: precio propio de una ración para compartir
    const s=(S.current.shared||{})[t.dataset.sprice];if(!s)return;
    const v=parseFloat(String(t.value).replace(",","."));if(isNaN(v)||v<0)return;
    s.price=r2(v);writeShared(t.dataset.sprice);render(true);return;
  }
  if(t.dataset.ticket){                 // Comanda: total del ticket de la ronda en curso (opcional)
    S.current.ticket=ticketOk(String(t.value).replace(",","."));
    if(mode==="firebase")curUpdate({ticket:S.current.ticket!=null?S.current.ticket:DEL()});else saveLocal();
    render(true);return;
  }
  if(t.dataset.rticket||t.dataset.rprice||t.dataset.rsprice){   // Corregir ronda cerrada
    const r=S.rounds.find(x=>x.id===ui.editRound);if(!r)return;
    if(t.dataset.rsprice){
      const s=(r.shared||{})[t.dataset.rsprice];if(!s)return;
      const v=parseFloat(String(t.value).replace(",","."));if(isNaN(v)||v<0)return;
      const antes=precioCompartido(s,r);if(Math.abs(antes-v)<0.005)return;
      r.shared=Object.assign({},r.shared,{[t.dataset.rsprice]:Object.assign({},s,{price:r2(v)})});
      guardarRonda(r,`Precio de ${label(s)} (para compartir): ${eur(antes)} → ${eur(v)}`);
      if(s.drink&&!extraOf(s.drink,s.clarification)&&r.bar&&S.bares[r.bar])setBarPrice(r.bar,s.drink,r2(v));
      render(true);return;
    }
    if(t.dataset.rticket){
      const v=ticketOk(String(t.value).replace(",","."));if(v===ticketOk(r.ticket))return;
      if(v==null)delete r.ticket;else r.ticket=v;
      guardarRonda(r,v==null?"Ticket: quitado":`Ticket: ${eur(v)}`,true);render(true);return;
    }
    const v=parseFloat(String(t.value).replace(",","."));if(isNaN(v)||v<0)return;
    const g=gruposRonda(r)[parseInt(t.dataset.rprice,10)];if(!g||Math.abs(g.price-v)<0.005)return;
    corregirPrecio(r,g,v);render(true);return;
  }
  if(t.dataset.barname){
    const id=t.dataset.barname,v=t.value.trim().slice(0,40),bar=S.bares[id];if(!v||!bar)return;
    if(barPorNombre(v)&&barPorNombre(v).id!==id){flash("Ya hay un bar con ese nombre");render(true);return}
    bar.name=v;barWrite({["bares."+id+".name"]:v});
    if(S.current.bar===id){S.current.name=v;if(mode==="firebase")curUpdate({name:v});else saveLocal()}
    render(true);return;
  }
  if(t.dataset.bprice){                 // Comanda: precio de un producto en este bar
    const v=parseFloat(String(t.value).replace(",","."));if(isNaN(v)||v<0)return;
    const id=t.dataset.bprice,base=r2(v-(Number(t.dataset.extra)||0));if(base<0)return;
    const eraAuto=snapshotAuto(S.current.bar);
    if(S.current.bar&&S.bares[S.current.bar]){setBarPrice(S.current.bar,id,base);flash(`Guardado para ${S.bares[S.current.bar].name}`)}
    else{editConfig(c=>{c.menus.forEach(m=>{const f=findNode(m.catalog,id);if(f)f.node.price=base})});reindex()}
    recalcAuto(eraAuto,id);render(true);return;
  }
  if(t.dataset.price){const v=parseFloat(String(t.value).replace(",","."));if(isNaN(v)||v<0)return;editConfig(c=>{c.menus.forEach(m=>{const f=findNode(m.catalog,t.dataset.price);if(f)f.node.price=r2(v)})});return}
  if(t.dataset.pname){const v=t.value.trim();if(!v)return;editConfig(c=>{c.people.forEach(p=>{if(p.id===t.dataset.pname)p.name=v.slice(0,24)})});return}
  if(t.dataset.mixname){
    const [nid,oid]=t.dataset.mixname.split("|");const v=t.value.trim();if(!v)return;
    editMenu(m=>{const f=findNode(m.catalog,nid);if(!f||!f.node.mix)return;
      const o=f.node.mix.options.find(x=>x.id===oid);if(!o)return;
      if(canon(o.name)===canon(f.node.mix.def))f.node.mix.def=v.slice(0,30);
      o.name=v.slice(0,30);});
    return;
  }
  if(t.dataset.mixextra){
    const [nid,oid]=t.dataset.mixextra.split("|");const v=parseFloat(String(t.value).replace(",","."));if(isNaN(v)||v<0)return;
    editMenu(m=>{const f=findNode(m.catalog,nid);if(!f||!f.node.mix)return;
      const o=f.node.mix.options.find(x=>x.id===oid);if(o)o.extra=r2(v);});
    return;
  }
  if(t.dataset.cname){const v=t.value.trim();if(!v)return;editMenu(m=>{const f=findNode(m.catalog,t.dataset.cname);if(f)f.node.name=v.slice(0,30)});return}
  if(t.dataset.iemoji){const v=t.value.trim().slice(0,4);editMenu(m=>{const f=findNode(m.catalog,t.dataset.iemoji);if(f)f.node.emoji=v});return}
  if(t.dataset.iname){const v=t.value.trim();if(!v)return;editMenu(m=>{const f=findNode(m.catalog,t.dataset.iname);if(f)f.node.name=v.slice(0,30)});return}
});

/* ===== Arranque ===== */
async function crearSala(code,clave,silencio){
  if(!db){alert("Sin conexión con la base de datos.");return false}
  try{
    const ref=db.collection("salas").doc(code);
    const ya=await ref.get();
    if(ya.exists){alert("Ese código ya existe.");return false}
    // La clave va a un documento aparte que las reglas no dejan leer; la sala no la guarda.
    const b=db.batch();
    b.set(db.collection("claves").doc(code),{clave});
    b.set(ref,{creada:Date.now(),por:me||""});
    await b.commit();
    if(!silencio)irASala(code);
    return true;
  }catch(e){
    console.warn(e);
    alert("No se ha podido crear la sala. Si la contraseña de administrador no es correcta, la base de datos rechaza la creación.");
    return false;
  }
}
async function copiarSala(code,clave){
  if(!await crearSala(code,clave,true))return;
  try{
    const destino=db.collection("salas").doc(code);
    await destino.collection("bar").doc("config").set(clone(S.config));
    await destino.collection("bar").doc("precios").set({bares:clone(S.bares)});
    await destino.collection("bar").doc("carpetas").set({carpetas:clone(S.carpetas)});
    // Se copia la noche en la que estás, con sus rondas (las demás noches no).
    if(NOCHE){
      await destino.collection("noches").doc(NOCHE).set(Object.assign(clone(S.current),nocheMeta()));
      for(const r of S.rounds){const d=Object.assign({},r);delete d.id;await destino.collection("noches").doc(NOCHE).collection("rounds").doc(r.id).set(clone(d))}
    }
    await destino.collection("bar").doc("migracion014").set({ts:Date.now(),por:me||"",copiaDe:SALA});
    irASala(code);
  }catch(e){console.error(e);alert("La sala se creó, pero no se pudieron copiar todos los datos.")}
}
function goLocal(err){
  if(err)console.error(err);
  const code=err&&(err.code||err.message||"");
  if(String(code).indexOf("permission-denied")>=0||String(code).indexOf("PERMISSION_DENIED")>=0)ui.salaError=true;
  if(mode!=="firebase"){mode="local";render()}
}
async function initFirebase(){
  if(!SALA){mode="local";render();return}
  if(!db){goLocal();return}
  const META={includeMetadataChanges:true};
  colRef("bar").doc("config").onSnapshot(META,snap=>{
    if(snap.exists)S.config=normConfig(snap.data());
    mode="firebase";
    if(!snap.exists)dbSet("bar/config",clone(S.config));
    render();
  },goLocal);
  // Todas las noches (su ficha y su ronda en curso). La elegida alimenta S.current.
  colRef("noches").onSnapshot(META,qs=>{
    const md=qs.metadata||{};netCache=!!md.fromCache;netPending=!!md.hasPendingWrites;
    const ns={},datos={};
    qs.docs.forEach(x=>{const d=x.data()||{};ns[x.id]=normNoche(d);datos[x.id]=d});
    S.noches=ns;NOCHES_DATA=datos;
    if(!md.fromCache)nochesDelServidor=true;
    if(NOCHE&&datos[NOCHE])S.current=Object.assign(normCurrent(datos[NOCHE]),{night:NOCHE});
    avisoReglas="";asegurarNoche();render();
  },errorNoches);
  colRef("bar").doc("carpetas").onSnapshot(snap=>{
    S.carpetas=normCarpetas(snap.exists?(snap.data()||{}).carpetas:{});render();
  },e=>console.warn("carpetas:",e));
  // Los precios por bar van aparte de la config (que se reescribe entera) para no pisarse.
  colRef("bar").doc("precios").onSnapshot(snap=>{
    S.bares=normBares(snap.exists?(snap.data()||{}).bares:{});
    render();
  },e=>console.warn("bares:",e));
  prepararNoches();
  setTimeout(()=>{if(mode==="connecting")goLocal()},10000);
}
let nochesDelServidor=false,unsubRondas=null,rondasDe="",avisoReglas="";
// Si se publica la app antes de pegar las reglas de la 014, Firebase no deja leer las noches:
// decirlo claro en vez de «ese código de sala no vale».
function errorNoches(e){
  console.warn("noches:",e);
  if(String(e&&(e.code||e.message)||"").toLowerCase().indexOf("permission")>=0){avisoReglas="Faltan las reglas nuevas de Firestore (versión 014): sin ellas no se pueden leer ni guardar las noches. Hay que pegarlas en la consola de Firebase y después volver a abrir la app. No se ha perdido nada.";render();return}
  goLocal(e);
}
const normCarpetas=m=>{const o={};Object.keys(m||{}).forEach(id=>{const c=m[id];if(c&&c.name)o[id]={name:String(c.name).slice(0,40),ts:Number(c.ts)||0}});return o};
// Rondas cerradas de la noche elegida; al cambiar de noche se deja de escuchar la anterior.
function escucharRondas(){
  escucharPagos();
  if(!db||!SALA||!NOCHE||rondasDe===NOCHE)return;
  if(typeof unsubRondas==="function")unsubRondas();
  const id=NOCHE;rondasDe=id;S.rounds=[];
  unsubRondas=colRef("noches").doc(id).collection("rounds").onSnapshot(qs=>{
    if(id!==NOCHE)return;
    S.rounds=qs.docs.map(x=>{const d=x.data();return Object.assign({id:x.id},d,{orders:normOrders(d.orders)})});
    actualizarResumen();render();
  },errorNoches);
}
// Que siempre haya una noche elegida: la recordada, si no la más reciente; si no hay ninguna
// (sala nueva, o se borraron todas desde Firebase), se crea una en «Otras».
function asegurarNoche(){
  if(NOCHE&&S.noches[NOCHE]){escucharRondas();return}
  if(!migracionHecha)return;
  const l=nochesLista();
  if(l.length){cambiarNoche(l[0].id);return}
  if(!nochesDelServidor)return;
  if(!S.carpetas.c_otras){S.carpetas.c_otras={name:"Otras",ts:Date.now()};dbUpdate("bar/carpetas",{"carpetas.c_otras":clone(S.carpetas.c_otras)},()=>({carpetas:clone(S.carpetas)}))}
  crearNoche("c_otras","Noche · "+fechaCorta(Date.now()));
}
// La conversión de lo de antes de la 014 se hace una sola vez por sala (marca bar/migracion014),
// y solo leyendo del servidor: decidirlo con lo guardado en el móvil podría pisar datos.
// Las escrituras solo salen con la app ya conectada (mode "firebase"); antes se perderían.
const esperarConexion=()=>new Promise((ok,mal)=>{const t0=Date.now();(function mira(){if(mode==="firebase")return ok();if(mode==="local"||Date.now()-t0>15000)return mal(new Error("sin conexión"));setTimeout(mira,100)})()});
async function prepararNoches(){
  try{
    await esperarConexion();
    const mk=await colRef("bar").doc("migracion014").get({source:"server"});
    if(!mk.exists)await migrar014();
    else comprobarViejo(Number((mk.data()||{}).ts)||0);
    migracionHecha=true;asegurarNoche();render();
  }catch(e){
    console.warn("noches:",e);
    if(NOCHE&&S.noches[NOCHE]){migracionHecha=true;asegurarNoche();render()}   // sin conexión, pero ya se usaba
    setTimeout(prepararNoches,15000);
  }
}
async function migrar014(){
  const srv={source:"server"},ahora=Date.now();
  const [cur,rs,ar,cp]=await Promise.all([colRef("bar").doc("current").get(srv),colRef("rounds").get(srv),
    colRef("archive").get(srv).catch(()=>({docs:[]})),colRef("bar").doc("carpetas").get(srv)]);
  const viejo=cur.exists?normCurrent(cur.data()):null;
  const rondas=rs.docs.map(x=>Object.assign({id:x.id},x.data()));
  const hayAlgo=!!(viejo&&(Object.keys(viejo.orders).length||Object.keys(viejo.shared||{}).length))||rondas.length>0;
  const idAct=(viejo&&viejo.night)||"n_inicial";
  // Noches anteriores guardadas en el archivo (cada ronda archivada lleva su noche).
  const porNoche={};
  ar.docs.forEach(x=>{const d=x.data()||{};if(!d.night||d.night===idAct)return;(porNoche[d.night]=porNoche[d.night]||[]).push(Object.assign({},d,{id:d.roundId||x.id.split("-").pop()}))});
  const yaCarpetas=cp.exists?normCarpetas((cp.data()||{}).carpetas):{},nuevas={};
  if(!yaCarpetas.c_otras)nuevas.c_otras={name:"Otras",ts:ahora};
  if(hayAlgo&&!yaCarpetas.c_pintxopote)nuevas.c_pintxopote={name:"Pintxopote",ts:ahora};
  if(Object.keys(porNoche).length&&!yaCarpetas.c_recuperadas)nuevas.c_recuperadas={name:"Recuperadas del archivo",ts:ahora};
  Object.assign(S.carpetas,yaCarpetas,nuevas);
  const u={};Object.keys(nuevas).forEach(k=>{u["carpetas."+k]=nuevas[k]});
  if(Object.keys(u).length)dbUpdate("bar/carpetas",u,()=>({carpetas:clone(S.carpetas)}));
  const fechaDe=rr=>{const ts=rr.map(r=>Number(r.ts)||0).filter(Boolean);return ts.length?Math.min(...ts):0};
  const sumar=rr=>r2(rr.reduce((s,r)=>s+(Number(r.total)||0),0));
  // Escrituras esperadas una a una: si alguna falla (p. ej. faltan las reglas), no se pone la
  // marca y la conversión se reintentará; si no, se quedaría a medias para siempre.
  const pend=[];
  const guardar=(nid,datos,rr)=>{
    pend.push(docRef("noches/"+nid).set(clone(datos)));
    rr.forEach(r=>{const d=Object.assign({},r),rid=d.id;delete d.id;pend.push(docRef("noches/"+nid+"/rounds/"+rid).set(clone(d)))});
    S.noches[nid]=normNoche(datos);NOCHES_DATA[nid]=datos;
  };
  // Lo de ahora (ronda en curso y rondas cerradas) pasa a ser la primera noche, en «Pintxopote».
  const fAct=fechaDe(rondas)||ahora;
  guardar(idAct,Object.assign({n:1,name:"",bar:"",orders:{},delivered:{},shared:{}},viejo||{},{night:idAct,
    titulo:(hayAlgo?"Pintxopote · ":"Noche · ")+fechaCorta(fAct),fecha:fAct,carpeta:hayAlgo?"c_pintxopote":"c_otras",
    creada:ahora,por:me||"",rondas:rondas.length,total:sumar(rondas)}),rondas);
  // Las noches del archivo, en «Recuperadas del archivo», sin ronda en curso.
  Object.keys(porNoche).forEach(nid=>{
    const rr=porNoche[nid].map(d=>{const o=Object.assign({},d);["night","roundId","people","savedTs","savedBy"].forEach(k=>delete o[k]);return o});
    const f=fechaDe(rr),ult=rr.slice().sort((a,b)=>(Number(b.n)||0)-(Number(a.n)||0))[0]||{};
    guardar(nid,{n:(Number(ult.n)||0)+1,name:ult.name||"",bar:ult.bar||"",night:nid,orders:{},delivered:{},shared:{},
      titulo:"Noche del "+fechaCorta(f||ahora),fecha:f||ahora,carpeta:"c_recuperadas",creada:ahora,por:me||"",rondas:rr.length,total:sumar(rr)},rr);
  });
  await Promise.all(pend);
  await docRef("bar/migracion014").set({ts:ahora,por:me||"",noche:idAct,recuperadas:Object.keys(porNoche).length});
  // bar/current y rounds se dejan como estaban, de copia.
  if(!NOCHE||!S.noches[NOCHE]){NOCHE="";cambiarNoche(idAct)}
}
// Un móvil con una versión anterior seguiría apuntando en bar/current y rounds: avisar.
async function comprobarViejo(tsMarca){
  try{
    const srv={source:"server"};
    const [cur,rs]=await Promise.all([colRef("bar").doc("current").get(srv),colRef("rounds").get(srv)]);
    let ult=0;
    if(cur.exists){const c=normCurrent(cur.data());Object.keys(c.orders).forEach(p=>(c.orders[p]||[]).forEach(o=>{ult=Math.max(ult,Number(o.ts)||0)}))}
    rs.docs.forEach(x=>{ult=Math.max(ult,Number((x.data()||{}).ts)||0)});
    avisoViejo=ult>tsMarca?"Alguien ha apuntado con una versión anterior de Eskari, y eso no sale en las noches. Que actualice la app (si la tiene instalada, cerrarla del todo y volver a abrirla).":"";
    render();
  }catch(e){}
}
render();
initFirebase();
