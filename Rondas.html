<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La ronda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EF;--surface:#FFFFFF;--surface2:#E2E7E4;--ink:#17221E;--muted:#58675F;--line:#CBD4CF;
  --accent:#C98A12;--good:#27745A;--bad:#AE3434;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#131B18;--surface:#1D2824;--surface2:#27342F;--ink:#ECEFEA;--muted:#9BA9A2;--line:#35443D;--good:#5DB592;--bad:#E27575;}
}
:root[data-theme="dark"]{--bg:#131B18;--surface:#1D2824;--surface2:#27342F;--ink:#ECEFEA;--muted:#9BA9A2;--line:#35443D;--good:#5DB592;--bad:#E27575;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding:0 12px 100px}
header{display:flex;align-items:flex-end;justify-content:space-between;padding:16px 2px 10px;gap:8px}
h1{font:700 2.1rem/1 var(--cond);margin:0}
.meta{text-align:right}
.round-no{font:700 1.2rem/1.1 var(--cond);display:block}
.sync{font-size:.8rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on .dot{background:var(--good)}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5;overflow-x:auto}
nav.tabs .in{display:flex;max-width:560px;width:100%;flex-wrap:nowrap}
nav.tabs button{background:none;border:0;border-top:3px solid transparent;color:var(--muted);font:600 .95rem var(--cond);padding:12px 8px 14px;white-space:nowrap;flex-shrink:0}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}

.selector-box{background:var(--surface2);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-size:.95rem}
.selector-box select{flex:1;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px}

.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 16px}
.person{position:relative;overflow:hidden;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:8px 8px 8px 13px;text-align:left;min-height:62px;transition:all .2s}
.person::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,transparent)}
.person .nm{display:block;font:600 1.12rem/1.1 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .dr{display:block;font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.person .ts{display:block;font-size:.75rem;color:var(--muted);opacity:.7}
.person.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.person.pending{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}

.pad-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px}
.pad-head h2{font:700 1.6rem/1.1 var(--cond);margin:0}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:430px){.keys{grid-template-columns:repeat(3,minmax(0,1fr))}}
.key{--c:#555;background:var(--c);color:#fff;border:0;border-radius:10px;min-height:70px;padding:9px 12px;font:600 1.35rem/1.05 var(--cond);text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:4px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.28)}
.key small{font:500 .88rem/1.2 var(--body);opacity:.92}
.key:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.28)}
.key:disabled{opacity:.4;cursor:default}
.key.ghost{background:var(--surface2);color:var(--ink);box-shadow:inset 0 -4px 0 var(--line)}
.key.ghost small{color:var(--muted);opacity:1}

.btn{display:block;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px 14px;font:600 1.15rem var(--cond)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;margin-top:12px}
.status{margin:14px 2px;color:var(--muted);font-size:.95rem}
.hint{color:var(--muted);padding:20px 4px;font-size:1.05rem}

.ticket{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;font-variant-numeric:tabular-nums}
.ticket h2{font:700 1.5rem var(--cond);margin:0 0 8px}
.line{display:grid;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line.compact{grid-template-columns:2ch 1fr auto;align-items:center}
.line .q{font:700 1.7rem/1 var(--cond);text-align:right}
.line .n{font:600 1.35rem/1.1 var(--cond)}
.line .p{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:.9rem}
.total{display:flex;justify-content:space-between;font:700 1.6rem var(--cond);margin-top:12px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
input.price{width:5em;text-align:right}

.group{--c:var(--line);background:var(--surface);border:1px solid var(--line);border-left:7px solid var(--c);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.group h3{margin:0 0 8px;font:700 1.4rem/1.1 var(--cond);display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font:600 1.08rem var(--cond)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sug{border-color:var(--accent)}
.chip.done{text-decoration:line-through;opacity:.5}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h2{font:700 1.35rem var(--cond);margin:0 0 8px}
.set-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.set-row input{flex:1}
.x{background:none;border:0;color:var(--muted);font-size:1.35rem;padding:6px}

table{width:100%;border-collapse:collapse}
table th,table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
table th{font:600 .95rem var(--cond);color:var(--muted)}
table th:first-child,table td:first-child{text-align:left}
.pos{color:var(--good)}.neg{color:var(--bad)}

.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>La ronda</h1>
    <div class="meta">
      <span class="round-no" id="roundNo">Ronda 1</span>
      <span class="sync" id="sync"><span class="dot"></span><span id="syncTxt">Conectando...</span></span>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs"><div class="in">
  <button data-act="tab" data-id="pedir">Pedir</button>
  <button data-act="tab" data-id="comanda">Comanda</button>
  <button data-act="tab" data-id="reparto">Reparto</button>
  <button data-act="tab" data-id="cuentas">Cuentas</button>
  <button data-act="tab" data-id="stats">Stats</button>
  <button data-act="tab" data-id="ajustes">Ajustes</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const DEFAULT_PEOPLE=["Aitor","Amigo 2","Amigo 3","Amigo 4","Amigo 5","Amigo 6","Amigo 7","Amigo 8","Amigo 9"];
const mk=(id,name,price,emoji="")=>({id,name,price,emoji});
const DEFAULT_CATALOG=[
  {id:"cerveza",name:"Cerveza",color:"#B97C0C",items:[mk("cana","Caña",2.5,"🍺"),mk("zurito","Zurito",1.8,"🍺"),mk("tercio","Tercio",3,"🍺"),mk("pinta","Pinta",4.5,"🍺"),mk("sin","Sin alcohol",2.5,"🍹"),mk("clara","Clara",2.5,"🍺")]},
  {id:"vino",name:"Vino",color:"#86243A",items:[mk("tinto","Tinto",2,"🍷"),mk("crianza","Crianza",2.5,"🍷"),mk("blanco","Blanco",2.2,"🍾"),mk("txakoli","Txakoli",2.5,"🍾"),mk("rosado","Rosado",2,"🍷")]},
  {id:"mezclas",name:"Kalimotxo y vermú",color:"#5A2E63",items:[mk("kalimotxo","Kalimotxo",2.5,"🍸"),mk("vermurojo","Vermú rojo",3,"🍸"),mk("vermublanco","Vermú blanco",3,"🍸"),mk("sidra","Sidra",2.5,"🍎")]},
  {id:"refresco",name:"Refrescos y agua",color:"#1F68A0",items:[mk("cola","Cola",2.5,"🥤"),mk("colazero","Cola zero",2.5,"🥤"),mk("naranja","Naranja",2.5,"🧡"),mk("limon","Limón",2.5,"🍋"),mk("tonica","Tónica",2.5,"💧"),mk("mosto","Mosto",2,"🍇"),mk("agua","Agua",1.8,"💧"),mk("aguagas","Agua con gas",2,"🫧")]},
  {id:"cafe",name:"Café",color:"#6A4630",items:[mk("solo","Solo",1.5,"☕"),mk("cortado","Cortado",1.6,"☕"),mk("conleche","Con leche",1.8,"☕"),mk("descafe","Descafeinado",1.8,"☕"),mk("infusion","Infusión",1.8,"🍵")]},
  {id:"copas",name:"Copas",color:"#2B7458",items:[mk("gintonic","Gin-tonic",8,"🍸"),mk("roncola","Ron-cola",7,"🥃"),mk("whiskycola","Whisky-cola",7,"🥃"),mk("vodka","Vodka",7,"🍹"),mk("pacharan","Pacharán",3,"🍑"),mk("chupito","Chupito",2,"🥃")]}
];

const clone=o=>JSON.parse(JSON.stringify(o));
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"});
const eur=v=>fmt.format(v||0);
const r2=v=>Math.round(v*100)/100;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}

function ensureCatalog(cat){if(!cat||!cat.items)return clone(DEFAULT_CATALOG);cat.items=cat.items.map(it=>({...it,emoji:it.emoji||""}));return cat}
function ensureAllCatalog(catalog){if(!Array.isArray(catalog))return clone(DEFAULT_CATALOG);return catalog.map(c=>({...c,items:(c.items||[]).map(it=>({...it,emoji:it.emoji||""}))}))}
function defaults(){return{config:{people:DEFAULT_PEOPLE.map((n,i)=>({id:"p"+(i+1),name:n})),catalog:clone(DEFAULT_CATALOG),assignerMode:""},current:{n:1,orders:{},delivered:{}},rounds:[]}}
function loadLocal(){try{const s=JSON.parse(lsGet("ronda.state"));if(s&&s.config&&s.current)return s}catch(e){}return defaults()}

const firebaseConfig={apiKey:"AIzaSyC4T6yZls3yYdKLqTSQN-HyirYx9DZgQyM",authDomain:"la-ronda-d659f.firebaseapp.com",projectId:"la-ronda-d659f",storageBucket:"la-ronda-d659f.firebasestorage.app",messagingSenderId:"1038336383449",appId:"1:1038336383449:web:dce83053f28d5bc85be1c8"};

let app, db;
try{app=firebase.initializeApp(firebaseConfig);db=firebase.firestore()}catch(e){console.error("Firebase init error:",e);db=null}

let S=loadLocal(), IDX={}, mode="local";
let me=lsGet("ronda.me");
const ui={tab:"pedir",sel:null,cat:null,payer:null,confirmReset:false};

function saveLocal(){if(mode==="local")lsSet("ronda.state",JSON.stringify(S))}
function reindex(){IDX={};S.config.catalog.forEach(c=>c.items.forEach(it=>{IDX[it.id]=Object.assign({},it,{cat:c})}))}
const people=()=>S.config.people;
const pname=id=>(people().find(p=>p.id===id)||{name:"?"}).name;
const drinks=pid=>(S.current.orders&&S.current.orders[pid])||[];
const label=o=>{if(!o)return"";if(o.custom)return o.custom;return o.drink==="nada"?"Nada":(IDX[o.drink]?IDX[o.drink].name:"?")};
const priceOf=o=>{if(!o||o.drink==="nada")return 0;if(o.custom)return o.price||2;return Number(IDX[o.drink]?.price)||0};
const emoji=o=>{if(!o||o.custom)return"";const it=IDX[o.drink];return it?(it.emoji||""):""};

function flash(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(flash.t);flash.t=setTimeout(()=>el.classList.remove("show"),2200)}
async function dbWrite(path,data){if(!db)return;try{await db.collection(path.split("/")[0]).doc(path.split("/")[1]).update(data)}catch(e){if(e.code==="invalid-argument"||e.code==="not-found")await db.collection(path.split("/")[0]).doc(path.split("/")[1]).set(data)}}
async function dbSet(path,data){if(!db)return;await db.collection(path.split("/")[0]).doc(path.split("/")[1]).set(data)}
async function dbDelete(path){if(!db)return;await db.collection(path.split("/")[0]).doc(path.split("/")[1]).delete()}

function addDrink(pid,drink){if(!S.current.orders[pid])S.current.orders[pid]=[];S.current.orders[pid].push({...drink,ts:Date.now(),by:me||"Anónimo"});if(mode==="firebase")dbWrite("bar/current",{orders:clone(S.current.orders)});else saveLocal()}
function removeDrink(pid,idx){if(S.current.orders[pid])S.current.orders[pid].splice(idx,1);if(mode==="firebase")dbWrite("bar/current",{orders:clone(S.current.orders)});else saveLocal()}
function setDelivered(pid,idx,val){S.current.delivered=S.current.delivered||{};const key=pid+"_"+idx;if(val)S.current.delivered[key]=true;else delete S.current.delivered[key];if(mode==="firebase")dbWrite("bar/current",{delivered:clone(S.current.delivered||{})});else saveLocal()}
function setConfig(cfg){S.config=cfg;if(mode==="firebase")dbSet("bar/config",clone(cfg));else saveLocal()}
function editConfig(fn){const c=clone(S.config);fn(c);setConfig(c);render()}
function roundTotal(){return r2(people().reduce((s,p)=>s+drinks(p.id).reduce((ss,o)=>ss+priceOf(o),0),0))}

function closeRound(payer){const orders={},prices={};let total=0;people().forEach(p=>{const ds=drinks(p.id);if(!ds.length)return;orders[p.id]=ds;ds.forEach(o=>{if(!o.drink||o.drink!=="nada"){const pr=priceOf(o);if(o.drink)prices[o.drink]=pr;total+=pr}})});const n=S.current.n,id="r"+String(n).padStart(4,"0");const round={n,orders,prices,payer,total:r2(total),ts:Date.now()};S.rounds=S.rounds.filter(r=>r.id!==id).concat([Object.assign({id},round)]);S.current={n:n+1,orders:{},delivered:{}};if(mode==="firebase"){dbSet("rounds/"+id,clone(round));dbSet("bar/current",{n:n+1,orders:{},delivered:{}})}else saveLocal()}
function undoLast(){if(!S.rounds.length)return;const last=S.rounds.slice().sort((a,b)=>a.n-b.n).pop();S.rounds=S.rounds.filter(r=>r.id!==last.id);S.current={n:last.n,orders:clone(last.orders||{}),delivered:{}};if(mode==="firebase"){dbDelete("rounds/"+last.id);dbSet("bar/current",clone(S.current))}else saveLocal()}
function newNight(){const ids=S.rounds.map(r=>r.id);S.rounds=[];S.current={n:1,orders:{},delivered:{}};if(mode==="firebase"){ids.forEach(id=>dbDelete("rounds/"+id));dbSet("bar/current",{n:1,orders:{},delivered:{}})}else saveLocal()}

function sortedRounds(){return S.rounds.slice().sort((a,b)=>a.n-b.n)}
function lastDrinkOf(pid){const rs=sortedRounds();for(let i=rs.length-1;i>=0;i--){const ds=rs[i].orders&&rs[i].orders[pid];if(ds&&ds.length){const o=ds[ds.length-1];if(o.drink&&o.drink!=="nada")return o.drink}}return null}
function favDrink(pid){const d={};S.rounds.forEach(r=>{const ds=r.orders&&r.orders[pid];if(ds)ds.forEach(o=>{if(o.drink&&o.drink!=="nada")d[o.drink]=(d[o.drink]||0)+1})});let best=null,max=0;Object.keys(d).forEach(x=>{if(d[x]>max){best=x;max=d[x]}});return best}
function balances(){const b={},drank={},paid={},times={};people().forEach(p=>{b[p.id]=0;drank[p.id]=0;paid[p.id]=0;times[p.id]=0});S.rounds.forEach(r=>{Object.keys(r.orders||{}).forEach(pid=>{const ds=r.orders[pid];if(ds)ds.forEach(o=>{drank[pid]+=priceOf(o)})});if(r.payer in paid){paid[r.payer]+=r.total||0;times[r.payer]++}});people().forEach(p=>{b[p.id]=r2(paid[p.id]-drank[p.id])});return{b,drank,paid,times}}
function suggestPayer(B){const ps=people();let c=ps.filter(p=>drinks(p.id).some(o=>!o.drink||o.drink!=="nada"));if(!c.length)c=ps;return c.sort((x,y)=>(B.b[x.id]-B.b[y.id])||(B.times[x.id]-B.times[y.id])||(ps.indexOf(x)-ps.indexOf(y)))[0].id}
function settle(b){const d=[],c=[];people().forEach(p=>{const v=Math.round((b[p.id]||0)*100);if(v<0)d.push({id:p.id,v:-v});else if(v>0)c.push({id:p.id,v})});d.sort((x,y)=>y.v-x.v);c.sort((x,y)=>y.v-x.v);const o=[];let i=0,j=0;while(i<d.length&&j<c.length){const m=Math.min(d[i].v,c[j].v);o.push({from:d[i].id,to:c[j].id,v:m/100});d[i].v-=m;c[j].v-=m;if(!d[i].v)i++;if(!c[j].v)j++}return o}

function vPedir(){
  if(!me)return`<div class="selector-box" style="margin:16px 0"><label>Eres: <select id="selectMe"><option value="">Elige...</option>${people().map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></label></div>`;
  if(S.config.assignerMode&&me!==S.config.assignerMode)return`<div class="hint">🔐 Esperando a ${esc(pname(S.config.assignerMode))}...</div>`;
  
  const ps=people(),ds=drinks(ui.sel||ps[0].id);
  if(!ui.sel)ui.sel=ps[0].id;
  
  let h='<div class="people">'+ps.map(p=>{const ods=drinks(p.id),c=ods.length&&ods[ods.length-1].drink?IDX[ods[ods.length-1].drink]?.cat.color:"transparent";return `<button class="person${p.id===ui.sel?" sel":""}${!ods.length?" pending":""}" style="--c:${c}" data-act="sel" data-id="${p.id}"><span class="nm">${ods.length?emoji(ods[ods.length-1]):""}${esc(p.name)}</span><span class="dr">${ods.length?esc(label(ods[ods.length-1])):"Sin pedir"}</span></button>`}).join('')+'</div>';
  h+=`<div class="pad-head"><h2>${esc(pname(ui.sel))}</h2></div>`;
  if(ds.length)h+=`<div style="margin:8px 0"><strong>Apuntadas:</strong><br/>`+ds.map((o,i)=>`<div style="font-size:.95rem;margin:4px 0">${emoji(o)} ${esc(label(o))}${o.clarification?" · "+esc(o.clarification):""} ${me===ui.sel?`<button class="linkish" style="margin-left:8px" data-act="removeDrink" data-pid="${ui.sel}" data-idx="${i}">X</button>`:""}</div>`).join('')+'</div>';
  
  const cat=ui.cat&&S.config.catalog.find(x=>x.id===ui.cat);
  if(!cat){
    h+='<div class="keys">'+S.config.catalog.map(c=>`<button class="key" style="--c:${c.color}" data-act="cat" data-id="${c.id}">${esc(c.name)}</button>`).join('')+`<button class="key ghost" data-act="pickOther">🔧 Otra</button>`;
    const p=lastDrinkOf(ui.sel);if(p)h+=`<button class="key ghost" data-act="pick" data-id="${p}">${emoji({drink:p})} Lo mismo</button>`;
    h+='</div>';
  }else{
    h+=`<div class="keys"><button class="key ghost" data-act="back">Atrás</button>`+cat.items.map(it=>`<button class="key" style="--c:${cat.color}" data-act="pick" data-id="${it.id}">${it.emoji} ${esc(it.name)}</button>`).join('')+'</div>';
  }
  return h;
}

function vComanda(){
  const gs=[];people().forEach(p=>{drinks(p.id).forEach(o=>{if(!o.drink||o.drink==="nada")return;let g=gs.find(x=>x.id===o.drink);if(!g){g={id:o.drink,pids:[]};gs.push(g)}if(!g.pids.includes(p.id))g.pids.push(p.id)})});
  if(!gs.length)return'<p class="hint">Sin pedidos</p>';
  let h=`<div class="ticket"><h2>Ronda ${S.current.n}</h2>`;
  h+=gs.map(g=>`<div class="line compact"><span style="font-weight:700">${g.pids.length}</span><span>${emoji({drink:g.id})} ${esc(label({drink:g.id}))}</span><span><input class="price" type="number" step="0.05" value="${IDX[g.id]?.price||2}" data-price="${g.id}"> €</span></div>`).join('')+`<div class="total"><span>Total</span><span>${eur(roundTotal())}</span></div></div>`;
  h+='<button class="btn" data-act="copy">Copiar</button>';
  return h;
}

function vReparto(){
  if(!people().some(p=>drinks(p.id).length))return'<p class="hint">Sin pedidos</p>';
  const del=S.current.delivered||{};
  let h='';people().forEach(p=>{const ds=drinks(p.id);if(!ds.length)return;h+=`<div class="group"><h3>${esc(pname(p.id))}</h3><div class="chips">`;ds.forEach((o,i)=>{const k=p.id+"_"+i;h+=`<button class="chip${del[k]?" done":""}" data-act="deliver" data-pid="${p.id}" data-idx="${i}">${emoji(o)} ${esc(label(o))}</button>`});h+='</div></div>'});
  const all=people().reduce((a,p)=>a+drinks(p.id).length,0);
  h=`<p class="status">${all-Object.keys(del).length} por entregar</p>`+h;
  return h;
}

function vCuentas(){
  const B=balances(),tot=roundTotal(),ps=people();
  if(ui.payer&&!ps.find(p=>p.id===ui.payer))ui.payer=null;
  const sug=suggestPayer(B);
  const any=ps.some(p=>drinks(p.id).length);
  let h=`<section class="card"><h2>Ronda ${S.current.n}: ${eur(tot)}</h2>`;
  if(any){h+=`<div class="chips">${ps.map(p=>`<button class="chip${ui.payer===p.id?" on":""}${S.rounds.length&&p.id===sug?" sug":""}" data-act="payer" data-id="${p.id}">${esc(p.name)}</button>`).join("")}</div>`;h+=`<button class="btn primary" data-act="close" ${ui.payer?"":" disabled"}>${ui.payer?`Cerrar: ${esc(pname(ui.payer))}`:"Elige"}</button>`}
  h+="</section>";
  if(S.rounds.length){
    h+=`<section class="card"><h2>Saldos</h2><table><thead><tr><th>Quién</th><th>Bebido</th><th>Pagado</th><th>Saldo</th></tr></thead><tbody>`;
    ps.forEach(p=>{const v=B.b[p.id];h+=`<tr><td>${esc(p.name)}</td><td>${eur(B.drank[p.id])}</td><td>${eur(B.paid[p.id])}</td><td class="${v>0.004?"pos":v<-0.004?"neg":""}">${v>0?"+":""}${eur(v)}</td></tr>`});
    h+="</tbody></table></section>";
    const st=settle(B.b);if(st.length){h+="<h2 style=\"margin:12px 0 8px\">Liquidación</h2>";st.forEach(s=>{h+=`<p style="margin:4px 0">${esc(pname(s.from))} paga ${eur(s.v)} a ${esc(pname(s.to))}</p>`})}
    h+='<button class="btn" data-act="undo" style="margin-top:12px">Reabrir última</button>';
  }
  h+=`<button class="btn warn" style="margin-top:12px" data-act="newNight">${ui.confirmReset?"Confirmar":"Noche nueva"}</button>`;
  return h;
}

function vStats(){
  let h='<section class="card"><h2>Favoritas</h2>';
  people().forEach(p=>{const f=favDrink(p.id);if(!f)return;h+=`<div style="padding:8px 0"><strong>${esc(pname(p.id))}</strong><br/>${emoji({drink:f})} ${esc(label({drink:f}))}</div>`});
  h+='</section>';
  return h;
}

function vAjustes(){
  const ps=people();
  let h='<section class="card"><h2>Cuadrilla</h2>'+ps.map(p=>`<div class="set-row"><input type="text" value="${esc(p.name)}" data-pname="${p.id}"><button class="x" data-act="rmPerson" data-id="${p.id}">×</button></div>`).join('')+'<button class="btn" data-act="addPerson">Añadir</button></section>';
  h+=`<section class="card"><h2>Modo asignador</h2><div class="chips">${["OFF",...ps.map(p=>p.id)].map(id=>`<button class="chip${S.config.assignerMode===id?" on":""}" data-act="toggleAssigner" data-id="${id}">${id==="OFF"?"OFF":esc(pname(id))}</button>`).join("")}</div></section>`;
  h+='<section class="card"><h2>Carta</h2><button class="btn" data-act="resetCatalog">↻ Resetear catálogo</button>'+S.config.catalog.map(c=>`<h3 style="margin:12px 0 4px;padding-left:8px;border-left:5px solid ${c.color}">${esc(c.name)}</h3>`+c.items.map(it=>`<div class="set-row"><input type="text" value="${esc(it.name)}" data-iname="${it.id}"><input class="price" type="number" step="0.05" value="${it.price}" data-price="${it.id}"> €</div>`).join('')).join('')+'</section>';
  return h;
}

const VIEWS={pedir:vPedir,comanda:vComanda,reparto:vReparto,cuentas:vCuentas,stats:vStats,ajustes:vAjustes};

function render(){
  reindex();S.current.orders=S.current.orders||{};S.current.delivered=S.current.delivered||{};
  $("#roundNo").textContent="Ronda "+S.current.n;$("#sync").className="sync"+(mode==="firebase"?" on":"");$("#syncTxt").textContent=mode==="firebase"?"Compartida":"Local";
  document.querySelectorAll("nav.tabs button").forEach(b=>{b.dataset.id===ui.tab?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current")});
  $("#view").innerHTML=VIEWS[ui.tab]();
  attachHandlers();
}

function attachHandlers(){
  document.removeEventListener("click",globalClickHandler);
  document.removeEventListener("change",globalChangeHandler);
  document.addEventListener("click",globalClickHandler);
  document.addEventListener("change",globalChangeHandler);
}

function globalClickHandler(e){
  const b=e.target.closest("[data-act]");if(!b)return;const id=b.dataset.id;
  switch(b.dataset.act){
    case"tab":ui.tab=id;ui.cat=null;window.scrollTo(0,0);render();return;
    case"sel":ui.sel=id;ui.cat=null;render();return;
    case"cat":ui.cat=id;render();return;
    case"back":ui.cat=null;render();return;
    case"pick":{const c=prompt("Aclaración? (opcional)");if(c===null)return;addDrink(ui.sel,{drink:id,clarification:c});ui.cat=null;render();return}
    case"pickOther":{const n=prompt("¿Bebida?");if(!n)return;const p=parseFloat(prompt("¿Precio? (def 2)")||"2")||2;addDrink(ui.sel,{custom:n,price:r2(p)});ui.cat=null;render();return}
    case"removeDrink":removeDrink(b.dataset.pid,parseInt(b.dataset.idx));render();return;
    case"deliver":setDelivered(b.dataset.pid,parseInt(b.dataset.idx),!(S.current.delivered||{})[b.dataset.pid+"_"+b.dataset.idx]);render();return;
    case"payer":ui.payer=ui.payer===id?null:id;render();return;
    case"close":if(ui.payer){const n=S.current.n;closeRound(ui.payer);ui.payer=null;flash(`Ronda ${n} cerrada`);render()}return;
    case"undo":undoLast();flash("Reabierta");render();return;
    case"newNight":if(!ui.confirmReset){ui.confirmReset=true;setTimeout(()=>{ui.confirmReset=false;if(ui.tab==="cuentas")render()},3000);render()}else{ui.confirmReset=false;newNight();flash("Noche nueva");render()}return;
    case"copy":{const txt=`Ronda ${S.current.n}\n`+Array.from(new Set(people().flatMap(p=>drinks(p.id).map(o=>o.drink)).filter(Boolean))).map(id=>{const c=people().filter(p=>drinks(p.id).some(o=>o.drink===id)).length;return c+" "+label({drink:id})}).join("\n");navigator.clipboard.writeText(txt).then(()=>flash("Copiada")).catch(()=>flash("Error"));return}
    case"addPerson":editConfig(c=>{c.people.push({id:"p"+Date.now().toString(36),name:"Nuevo"})});return;
    case"rmPerson":if(people().length>1)editConfig(c=>{c.people=c.people.filter(p=>p.id!==id)});return;
    case"toggleAssigner":editConfig(c=>{c.assignerMode=S.config.assignerMode===id?"":id});return;
    case"resetCatalog":editConfig(c=>{c.catalog=clone(DEFAULT_CATALOG);flash("Catálogo restaurado")});return;
  }
}

function globalChangeHandler(e){
  const t=e.target;
  if(t.id==="selectMe"){me=t.value||null;lsSet("ronda.me",me);render()}
  else if(t.dataset.price){const v=parseFloat(String(t.value).replace(",","."));if(isNaN(v)||v<0)return;editConfig(c=>{c.catalog.forEach(cat=>cat.items.forEach(it=>{if(it.id===t.dataset.price)it.price=r2(v)}))});return}
  else if(t.dataset.pname){const v=t.value.trim();if(!v)return;editConfig(c=>{c.people.forEach(p=>{if(p.id===t.dataset.pname)p.name=v.slice(0,24)})});return}
  else if(t.dataset.iname){const v=t.value.trim();if(!v)return;editConfig(c=>{c.catalog.forEach(cat=>cat.items.forEach(it=>{if(it.id===t.dataset.iname)it.name=v.slice(0,30)}))});return}
}

function initFirebase(){
  if(!db){mode="local";$("#syncTxt").textContent="Local";render();return}
  try{
    db.collection("bar").doc("config").onSnapshot(snap=>{
      if(snap.exists){S.config=clone(snap.data());S.config.catalog=ensureAllCatalog(S.config.catalog);mode="firebase"}else{dbSet("bar/config",clone(defaults().config));mode="firebase"}
      render();
    },err=>{console.log("Config error");mode="local";$("#syncTxt").textContent="Local";render()});
    
    db.collection("bar").doc("current").onSnapshot(snap=>{
      if(snap.exists){S.current=snap.data();mode="firebase"}else{dbSet("bar/current",clone(defaults().current));mode="firebase"}
      render();
    },err=>{console.log("Current error");mode="local"});
    
    db.collection("rounds").orderBy("n").onSnapshot(qs=>{
      S.rounds=qs.docs.map(x=>Object.assign({id:x.id},x.data()));mode="firebase";render();
    },err=>{console.log("Rounds error");mode="local"});
  }catch(e){console.error("Listener error:",e);mode="local";$("#syncTxt").textContent="Local";render()}
}

render();
setTimeout(()=>{initFirebase();if(mode==="local")$("#syncTxt").textContent="Local"},800);
</script>
