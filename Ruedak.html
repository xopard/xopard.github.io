<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruedak</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F5F99'/%3E%3Ccircle cx='32' cy='32' r='20.5' fill='none' stroke='%23FFFFFF' stroke-width='8'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%23FFFFFF' stroke-width='1.6'/%3E%3Cg stroke='%23FFFFFF' stroke-width='3' stroke-linecap='round'%3E%3Cline x1='32' y1='32' x2='32' y2='18.5'/%3E%3Cline x1='32' y1='32' x2='44.8' y2='27.8'/%3E%3Cline x1='32' y1='32' x2='39.9' y2='42.9'/%3E%3Cline x1='32' y1='32' x2='24.1' y2='42.9'/%3E%3Cline x1='32' y1='32' x2='19.2' y2='27.8'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='5.5' fill='%23F08A1C'/%3E%3C/svg%3E">
<meta name="theme-color" content="#1F5F99">
<style>
:root {
  --fondo: #f5f6f8; --papel: #ffffff; --tinta: #1c232c; --suave: #5b6673; --raya: #dbe0e6; --tinte: #eef2f6;
  --acento: #1f5f99; --acento-tinte: #e3eef8; --naranja: #e07b0c;
  --rojo: #c63b3b; --rojo-tinte: #fbeaea; --ambar: #b9780b; --ambar-tinte: #fcf2dc; --verde: #2e8550; --verde-tinte: #e4f3e9;
  --gris: #9aa4af; --radio: 10px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fondo: #111418; --papel: #1a1f26; --tinta: #e6eaef; --suave: #9ba6b3; --raya: #2d353f; --tinte: #222932;
    --acento: #7fb3e6; --acento-tinte: #1c2a38; --naranja: #f5a34a;
    --rojo: #ff7b72; --rojo-tinte: #3b2020; --ambar: #f0b44c; --ambar-tinte: #3a2e17; --verde: #62c98a; --verde-tinte: #183424;
    --gris: #6c7783; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fondo); color: var(--tinta); font-size: 15px; line-height: 1.45; }
a { color: var(--acento); }
h1, h2, h3 { line-height: 1.2; margin: 0; }
h1 { font-size: 1.6em; }
h2 { font-size: 1.15em; }
h3 { font-size: 0.82em; text-transform: uppercase; letter-spacing: 0.06em; color: var(--suave); margin: 1.4em 0 0.4em; }
p { margin: 0.4em 0; }
.sub { color: var(--suave); font-size: 0.9em; }
.mono { font-family: ui-monospace, Consolas, monospace; font-size: 0.88em; overflow-wrap: anywhere; }

/* barra superior */
.barra { position: sticky; top: 0; z-index: 5; background: var(--papel); border-bottom: 1px solid var(--raya);
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 16px; }
.marca { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 1.15em; color: var(--acento); text-decoration: none; letter-spacing: 0.02em; }
.marca svg { width: 22px; height: 22px; flex: none; }
.marca .k, .marca-grande .k { color: var(--naranja); }
.marca-grande { color: var(--acento); font-size: 2.2em; letter-spacing: 0.02em; }
#nav { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; min-width: 0; }
#nav a { text-decoration: none; color: var(--suave); padding: 4px 10px; border-radius: 999px; font-size: 0.92em; white-space: nowrap; }
#nav a.activa { background: var(--acento-tinte); color: var(--acento); font-weight: 600; }
#estado-guardado { font-size: 0.82em; color: var(--suave); white-space: nowrap; }
#estado-guardado.sucio { color: var(--ambar); }

main { max-width: 1100px; margin: 0 auto; padding: 16px; }
.cargando { color: var(--suave); }

/* tarjetas */
.tarjetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.tarjeta, .caja { background: var(--papel); border: 1px solid var(--raya); border-radius: var(--radio); padding: 14px 16px; min-width: 0; }
.tarjeta header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.tarjeta header a { color: var(--tinta); text-decoration: none; }
.km { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-weight: 600; }
.resumen { display: flex; flex-wrap: wrap; gap: 6px; }
.mini { list-style: none; padding: 0; margin: 0.6em 0 0; display: grid; gap: 4px; }
.mini li { display: grid; grid-template-columns: 12px minmax(0, 1fr); column-gap: 8px; align-items: baseline; }
.mini li .sub { grid-column: 2; }
.mas { display: inline-block; margin-top: 0.7em; font-size: 0.92em; }
section.bloque { margin-top: 26px; }
section.bloque > h2 { margin-bottom: 8px; }

/* semáforo y etiquetas */
.punto { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--gris); flex: none; }
.punto.rojo { background: var(--rojo); } .punto.ambar { background: var(--ambar); } .punto.verde { background: var(--verde); }
.chip { display: inline-block; font-size: 0.8em; font-weight: 600; padding: 1px 9px; border-radius: 999px; background: var(--tinte); color: var(--suave); white-space: nowrap; }
.chip.rojo { background: var(--rojo-tinte); color: var(--rojo); }
.chip.ambar { background: var(--ambar-tinte); color: var(--ambar); }
.chip.verde { background: var(--verde-tinte); color: var(--verde); }

/* botones y formularios */
.boton { font: inherit; font-size: 0.92em; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--raya); background: var(--papel); color: var(--tinta); cursor: pointer; }
.boton:hover { border-color: var(--suave); }
.boton.primario { background: var(--acento); border-color: var(--acento); color: #fff; }
.boton.peque { padding: 2px 9px; font-size: 0.82em; font-weight: 500; }
a.boton { display: inline-block; text-decoration: none; }
.botones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
select, input, textarea { font: inherit; color: var(--tinta); background: var(--papel); border: 1px solid var(--raya); border-radius: 7px; padding: 5px 8px; max-width: 100%; }
label { display: block; margin: 10px 0 0; font-size: 0.9em; color: var(--suave); }
label input, label select, label textarea { display: block; width: 100%; margin-top: 3px; }
label.interruptor { display: inline-flex; align-items: center; gap: 8px; color: var(--tinta); margin: 0; }
label.interruptor input { width: auto; margin: 0; }

/* cabecera de vehículo y pestañas */
.cab-veh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.pestanas { display: flex; flex-wrap: wrap; gap: 4px; margin: 14px 0 6px; border-bottom: 1px solid var(--raya); padding-bottom: 8px; }
.pestana { text-decoration: none; color: var(--suave); padding: 4px 10px; border-radius: 7px; font-size: 0.92em; }
.pestana.activa { background: var(--tinta); color: var(--papel); }
.herramientas { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 8px 0; }

/* lista de elementos */
.lista-el { background: var(--papel); border: 1px solid var(--raya); border-radius: var(--radio); }
.fila-el { display: grid; grid-template-columns: 12px minmax(0, 1fr) 170px 300px 128px;
  grid-template-areas: "p n u x d" ". t t t t"; gap: 4px 12px; align-items: start; padding: 9px 12px; border-top: 1px solid var(--raya); }
.fila-el:first-child { border-top: 0; }
.fila-el > .punto { grid-area: p; margin-top: 5px; }
.el-nombre { grid-area: n; min-width: 0; } .el-ult { grid-area: u; } .el-prox { grid-area: x; } .el-dec { grid-area: d; }
.el-detalle { grid-area: t; min-width: 0; }
.el-boton { font: inherit; font-weight: 700; color: var(--tinta); background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.el-boton::before { content: "▸ "; color: var(--suave); font-weight: 400; }
.el-boton[aria-expanded="true"]::before { content: "▾ "; }
.el-ult, .el-prox { font-size: 0.9em; }
.el-ult .lleva { display: block; }
.el-prox .lim + .lim { margin-top: 2px; }
.el-prox .lim.manda { font-weight: 600; }
.el-prox .chip { font-size: 0.75em; padding: 0 7px; }
.uso-fila { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.uso { flex: 1; max-width: 180px; height: 6px; background: var(--tinte); border-radius: 3px; overflow: hidden; }
.uso > span { display: block; height: 100%; background: var(--gris); }
.uso > .rojo { background: var(--rojo); } .uso > .ambar { background: var(--ambar); } .uso > .verde { background: var(--verde); }
.etq { display: none; color: var(--suave); font-size: 0.85em; margin-right: 4px; }
.cabecera-el { color: var(--suave); font-size: 0.78em; text-transform: uppercase; letter-spacing: 0.05em; }
details > summary { cursor: pointer; }
details > summary::marker { color: var(--suave); }
.detalle { margin: 8px 0 4px; padding: 8px 10px; background: var(--tinte); border-radius: 8px; font-size: 0.9em; }
dl.datos { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; margin: 0; }
dl.datos dt { color: var(--suave); }
dl.datos dd { margin: 0; overflow-wrap: anywhere; }

/* tablas */
.tabla-wrap { overflow-x: auto; }
table.tabla { width: 100%; border-collapse: collapse; font-size: 0.9em; font-variant-numeric: tabular-nums; }
.tabla th { text-align: left; font-size: 0.8em; color: var(--suave); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding: 5px 8px; border-bottom: 2px solid var(--raya); white-space: nowrap; }
.tabla td { padding: 5px 8px; border-bottom: 1px solid var(--raya); vertical-align: top; }
.tabla .num { text-align: right; white-space: nowrap; }

/* visitas */
.lista-visitas { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.visita { background: var(--papel); border: 1px solid var(--raya); border-radius: var(--radio); padding: 9px 12px; min-width: 0; }
.visita summary { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; }
.visita summary b { min-width: 6.5em; }
.visita .cuerpo { margin-top: 8px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }

/* barras de gastos */
.barras { display: grid; gap: 5px; }
.b-fila { display: grid; grid-template-columns: 4.5em minmax(0, 1fr) 7.5em; gap: 8px; align-items: center; font-size: 0.9em; }
.b-fila > span:first-child { min-width: 0; overflow-wrap: anywhere; line-height: 1.25; }
.barras.larga .b-fila { grid-template-columns: minmax(0, 14em) minmax(0, 1fr) 7.5em; }
.b-pista { background: var(--tinte); border-radius: 4px; height: 14px; overflow: hidden; }
.b-relleno { display: block; height: 100%; background: var(--acento); border-radius: 4px; }
.b-valor { text-align: right; font-variant-numeric: tabular-nums; }
.b-nota { grid-column: 2 / -1; margin-top: -3px; font-size: 0.8em; color: var(--suave); }
.barras:has(.b-nota) { gap: 8px; }
.tabla .tarde { color: var(--rojo); font-weight: 600; }
details.mas-detalle { margin-top: 10px; }
details.mas-detalle > summary { color: var(--suave); font-size: 0.9em; }
.cifra .sub { display: block; }
.cifras { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 8px 0 14px; }
.cifra { background: var(--papel); border: 1px solid var(--raya); border-radius: var(--radio); padding: 8px 12px; }
.cifra b { display: block; font-size: 1.25em; }

/* avisos, diálogo y mensajes */
.aviso { border-radius: var(--radio); padding: 10px 14px; margin-bottom: 14px; border: 1px solid; }
.aviso.error, .aviso.conflicto { background: var(--rojo-tinte); border-color: var(--rojo); }
.aviso.info { background: var(--acento-tinte); border-color: var(--acento); }
.vacio { max-width: 560px; margin: 40px auto; text-align: center; }
dialog { border: 1px solid var(--raya); border-radius: 12px; padding: 0; width: min(440px, calc(100vw - 32px)); background: var(--papel); color: var(--tinta); }
dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
.dlg { padding: 16px 18px; }
.dlg .error { color: var(--rojo); font-size: 0.9em; }
.dlg-botones { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--tinta); color: var(--papel); padding: 8px 16px; border-radius: 999px;
  font-size: 0.9em; opacity: 0; transition: opacity 0.2s; pointer-events: none; max-width: calc(100vw - 32px); }
#toast.ver { opacity: 1; }
ul.importacion { padding-left: 1.2em; }
ul.importacion li.mal { color: var(--rojo); }
.pend { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 9px 12px; border-top: 1px solid var(--raya); }
.pend:first-child { border-top: 0; }
.pend .botones { margin-top: 0; flex-wrap: nowrap; }
.boton.peligro { color: var(--rojo); border-color: var(--rojo); }
.tabla .boton.peque { white-space: nowrap; }
.tabla td.det { min-width: 13em; }                /* en el móvil la tabla se desplaza de lado en vez de partir el detalle palabra a palabra */
.tabla td.fecha { white-space: nowrap; }
.tabla td.desde { white-space: nowrap; }

/* diálogos de edición */
dialog { max-height: calc(100vh - 32px); overflow: auto; }
.dlg-botones .boton.peligro { margin-right: auto; }
.rejilla { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; }
.rejilla .ancha { grid-column: 1 / -1; }
.dlg fieldset { border: 1px solid var(--raya); border-radius: 8px; margin: 14px 0 0; padding: 2px 10px 10px; min-width: 0; }
.dlg legend { font-size: 0.85em; color: var(--suave); padding: 0 4px; }
.dlg label.interruptor { margin-top: 12px; }
.dlg fieldset label.interruptor { margin-right: 14px; }
.propuesta { display: grid; gap: 8px; margin-top: 10px; }
.prop-fila { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; padding-bottom: 8px; border-bottom: 1px solid var(--raya); }
.prop-fila > .punto { margin-top: 5px; }
.ficha-fila { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 6px; padding: 8px 0; border-top: 1px solid var(--raya); }
.ficha-fila input { width: 100%; font-weight: 600; }
.ficha-fila textarea { grid-column: 1 / -1; width: 100%; resize: vertical; }
.ficha-botones { display: flex; gap: 4px; }

/* hoja para el taller (en pantalla; al imprimir, ver @media print al final) */
.hoja { background: var(--papel); border: 1px solid var(--raya); border-radius: var(--radio); padding: 20px 22px; max-width: 840px; margin: 0 auto; }
.hoja > * + * { margin-top: 1.3em; }
.hoja h1 { font-size: 1.8em; }
.hoja h2 { font-size: 1.05em; text-transform: uppercase; letter-spacing: 0.05em; color: var(--acento); display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2em 0.7em; margin-bottom: 0.5em; }
.hoja h2 small { font-size: 0.78em; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--suave); }
.h-cab { border-bottom: 3px solid var(--tinta); padding-bottom: 0.7em; display: grid; gap: 0.3em; }
.h-eyebrow { font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.8em; color: var(--suave); }
.h-ficha { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--raya); border: 1px solid var(--raya); margin: 0; }
.h-ficha div { background: var(--papel); padding: 0.4em 0.65em; min-width: 0; }
.h-ficha .w2 { grid-column: span 2; }
.h-ficha .w3 { grid-column: 1 / -1; }
.h-ficha dt { font-size: 0.7em; text-transform: uppercase; letter-spacing: 0.07em; color: var(--suave); font-weight: 600; }
.h-ficha dd { margin: 0.1em 0 0; font-weight: 600; overflow-wrap: anywhere; }
.hoja .tarde { color: var(--rojo); font-weight: 600; }
.h-avisos { display: grid; gap: 0.6em; }
.h-aviso { border: 2px solid var(--ambar); background: var(--ambar-tinte); padding: 0.55em 0.85em; }
.h-aviso strong { display: block; color: var(--ambar); text-transform: uppercase; letter-spacing: 0.03em; }
.hoja table { width: 100%; border-collapse: collapse; }
.hoja th { text-align: left; font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.07em; color: var(--suave); font-weight: 600; padding: 0.4em 0.5em; border-bottom: 2px solid var(--tinta); white-space: nowrap; }
.hoja td { padding: 0.5em; border-bottom: 1px solid var(--raya); vertical-align: top; }
.hoja tr, .h-lista li, .h-hecho div, .h-junto { break-inside: avoid; page-break-inside: avoid; }
.hoja td.c-casilla { width: 2.2em; padding-right: 0; }
.hoja td.c-recambio { width: 26%; }
.hoja td.c-ultimo { width: 13%; white-space: nowrap; }
.casilla { display: inline-block; width: 1.1em; height: 1.1em; border: 2px solid var(--tinta); border-radius: 2px; }
.h-tarea { font-weight: 600; }
.h-nota { color: var(--suave); font-size: 0.9em; margin-top: 0.15em; }
.h-nota.h-libre { font-style: italic; }
.h-lista { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--tinta); }
.h-lista li { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); padding: 0.5em 0 0.5em 0.5em; border-bottom: 1px solid var(--raya); }
.h-hecho { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.45em 1.4em; background: var(--tinte); padding: 0.7em 0.85em; }
.h-hecho div { min-width: 0; }
.h-hecho b { display: block; font-weight: 600; }
.h-hecho span { color: var(--suave); font-size: 0.9em; }
.h-pedir { margin: 0; padding-left: 1.2em; }
.h-pedir li + li { margin-top: 0.2em; }
.h-lineas i { display: block; height: 1.9em; border-bottom: 1px solid var(--raya); }
.h-firmas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1em; margin-top: 2em; }
.h-firmas div { border-top: 1px solid var(--tinta); padding-top: 0.25em; font-size: 0.75em; color: var(--suave); text-transform: uppercase; letter-spacing: 0.06em; }
.h-pie { font-size: 0.8em; color: var(--suave); border-top: 1px solid var(--raya); padding-top: 0.5em; }

@media (max-width: 760px) {
  main { padding: 12px; }
  .barra { padding: 8px 12px 6px; }
  #estado-guardado { margin-left: auto; }
  #nav { order: 3; flex: 0 0 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .cabecera-el { display: none; }
  .fila-el { grid-template-columns: 12px minmax(0, 1fr) auto; grid-template-areas: "p n d" ". u u" ". x x" ". t t"; }
  .etq { display: inline; }
  .b-fila { grid-template-columns: 3.4em minmax(0, 1fr) 6.6em; }
  .barras.larga .b-fila { grid-template-columns: minmax(0, 1fr) 6.6em; row-gap: 2px; }
  .barras.larga .b-fila > span:first-child { grid-column: 1 / -1; }
  .barras.larga { gap: 10px; }
  dl.datos { grid-template-columns: minmax(0, 1fr); }
  dl.datos dt { margin-top: 6px; font-size: 0.88em; }
  .hoja { padding: 14px; }
  .h-ficha { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .h-ficha .w2 { grid-column: 1 / -1; }
  .h-hecho, .h-firmas { grid-template-columns: minmax(0, 1fr); }
  .hoja table { min-width: 540px; }
}

/* Impresión: solo la hoja para el taller, en A4 y en claro aunque la pantalla esté en oscuro */
@page { size: A4; margin: 11mm 12mm 12mm; }
@media print {
  :root { --fondo: #fff; --papel: #fff; --tinta: #000; --suave: #444b55; --raya: #a3adb8; --tinte: #eef2f6; --acento: #1d5a8c;
    --rojo: #a3271f; --ambar: #8a5a00; --ambar-tinte: #f7efdc; color-scheme: light; }
  body { background: #fff; font-size: 9pt; line-height: 1.28; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .hoja h1 { font-size: 1.6em; }
  .h-nota { margin-top: 0.05em; }
  .barra, #toast, .no-imprimir, .aviso { display: none !important; }
  main { padding: 0; max-width: none; }
  .hoja { border: 0; border-radius: 0; padding: 0; max-width: none; }
  .hoja > * + * { margin-top: 0.7em; }
  .hoja h2 { margin-bottom: 0.25em; }
  .hoja td { padding: 0.3em 0.5em; }
  .hoja table { min-width: 0; }
  .h-lista li { padding-block: 0.3em; }
  /* el A4 mide menos de 760 px: hay que deshacer aquí las reglas del móvil */
  .h-ficha { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .h-ficha .w2 { grid-column: span 2; }

  return `<div class="aviso ${a.tipo}" role="alert"><p>${esc(a.texto)}</p><div class="botones">${botones}<button class="boton" data-accion="cerrar-aviso">Cerrar</button></div></div>`;
}
function aviso(a) { S.aviso = a; }

function vistaSinDatos() {

// Inicio: una tarjeta por vehículo, próximas caducidades y pendientes abiertos.
function vistaInicio() {
  const vs = vehiculos();
  const tarjetas = vs.map(v => {
    const est = v.elementos.map(e => estadoElemento(v, e));
    const rojos = est.filter(e => e.color === 'rojo'), ambar = est.filter(e => e.color === 'ambar');
    const urg = [...rojos, ...ambar].sort(porUrgencia).slice(0, 5);
    const cads = v.caducidades.map(c => ({ c, e: estadoCaducidad(v, c) })).sort((a, b) => a.c.vence.localeCompare(b.c.vence));
    const u = kmActual(v);
    return `<article class="tarjeta">
      <header><a href="#/v/${v.id}"><h2>${esc(v.nombre)}</h2></a><span class="sub">${esc(v.matricula || TIPOS_VEH[v.tipo] || '')}</span></header>
      <p class="km">${fKm(u.km)} <span class="sub">${fFecha(u.fecha)}</span><button class="boton peque" data-accion="km" data-veh="${v.id}">Apuntar km</button></p>
      <p class="resumen">${rojos.length ? `<span class="chip rojo">${plural(rojos.length, 'vencido', 'vencidos')}</span>` : ''}${ambar.length ? `<span class="chip ambar">${fNum(ambar.length)} pronto</span>` : ''}${!rojos.length && !ambar.length ? '<span class="chip verde">Todo en plazo</span>' : ''}</p>
      ${urg.length ? `<ul class="mini">${urg.map(e => `<li>${punto(e.color)}<span>${esc(e.el.nombre)}</span><span class="sub">${esc(e.texto)}</span></li>`).join('')}</ul>` : ''}
      ${cads.length ? `<ul class="mini">${cads.map(({ c, e }) => `<li>${punto(e.color)}<span>${esc(c.tipo)}</span><span class="sub">${esc(e.texto)}</span></li>`).join('')}</ul>` : ''}
      <a class="mas" href="#/v/${v.id}">Ver ${esc(v.nombre)} →</a>
    </article>`;
  }).join('');
  const cads = vs.flatMap(v => v.caducidades.map(c => ({ v, c, e: estadoCaducidad(v, c) }))).sort((a, b) => a.c.vence.localeCompare(b.c.vence));
  const pends = vs.flatMap(v => v.pendientes.filter(p => p.estado === 'abierto').map(p => ({ v, p })));
  return `<div class="tarjetas">${tarjetas}</div>
    <section class="bloque"><h2>Próximas caducidades</h2>
      ${cads.length ? `<div class="tabla-wrap"><table class="tabla"><thead><tr><th></th><th>Vehículo</th><th>Qué</th><th>Vence</th></tr></thead><tbody>
      ${cads.map(({ v, c, e }) => `<tr><td>${punto(e.color)}</td><td><a href="#/v/${v.id}/caducidades">${esc(v.nombre)}</a></td><td>${esc(c.tipo)}</td><td>${esc(e.texto)}</td></tr>`).join('')}
      </tbody></table></div>` : '<p class="sub">No hay caducidades apuntadas.</p>'}
    </section>
    <section class="bloque"><h2>Pendientes abiertos</h2>
      ${pends.length ? `<ul class="mini">${pends.map(({ v, p }) => `<li><span class="punto"></span><span><a href="#/v/${v.id}/pendientes">${esc(v.nombre)}</a> · ${esc(p.texto)}</span><span class="sub">${esc(TIPOS_PEND[p.tipo] || p.tipo)} desde ${fFecha(p.desde)}</span></li>`).join('')}</ul>` : '<p class="sub">No hay pendientes abiertos.</p>'}
    </section>`;
}

function vistaVehiculo(v, pest) {
  if (!PESTANAS.some(([k]) => k === pest)) pest = 'estado';
  const k = kmHoy(v);
  const cuerpo = { estado: pestEstado, historial: pestHistorial, ficha: pestFicha, km: pestKm, neumaticos: pestNeumaticos,
    caducidades: pestCaducidades, pendientes: pestPendientes, gastos: pestGastos }[pest](v);
  return `<div class="cab-veh"><h1>${esc(v.nombre)}</h1><span class="sub">${esc([v.matricula, TIPOS_VEH[v.tipo]].filter(Boolean).join(' · '))}</span></div>
    <p class="km">${fKm(k.base.km)} <span class="sub">el ${fFecha(k.base.fecha)}${k.estimado ? ` · hoy ≈ ${fKm(Math.round(k.km))}` : ''}</span>
      <button class="boton peque" data-accion="km" data-veh="${v.id}">Apuntar km</button>
      <a class="boton peque" href="#/v/${v.id}/hoja">Hoja para el taller</a></p>
    <nav class="pestanas" aria-label="Pestañas">${PESTANAS.map(([id, t]) => `<a class="pestana${id === pest ? ' activa' : ''}" href="#/v/${v.id}/${id}">${t}</a>`).join('')}</nav>
    ${cuerpo}`;

function pestEstado(v) {
  const todos = leerLS(LS.verTodos) === '1';
  const est = v.elementos.map(e => estadoElemento(v, e));
  const vis = est.filter(e => todos || e.el.intervalo || e.el.proxima?.decision);
  const cuenta = c => est.filter(e => e.color === c).length;
  const dec = {}; for (const e of est) { const d = e.el.proxima?.decision; if (d) dec[d] = (dec[d] || 0) + 1; }
  const grupos = new Map();
  for (const e of vis) { const g = e.el.grupo || 'Otros'; if (!grupos.has(g)) grupos.set(g, []); grupos.get(g).push(e); }
  return `<div class="herramientas">
      <span class="resumen"><span class="chip rojo">${plural(cuenta('rojo'), 'vencido', 'vencidos')}</span><span class="chip ambar">${fNum(cuenta('ambar'))} pronto</span><span class="chip verde">${fNum(cuenta('verde'))} en plazo</span></span>
      <label class="interruptor"><input type="checkbox" data-accion="ver-todos" ${todos ? 'checked' : ''}> Ver todos los elementos (${v.elementos.length})</label>
      <button class="boton peque" data-accion="nuevo-elemento" data-veh="${v.id}">Añadir elemento</button>
      <button class="boton peque" data-accion="proponer" data-veh="${v.id}">Proponer la próxima visita</button>
    </div>
    ${Object.keys(dec).length ? `<p class="sub">Para la próxima visita: ${DECISIONES.filter(([k]) => dec[k]).map(([k, t]) => `${t} ${dec[k]}`).join(' · ')}</p>` : ''}
    ${[...grupos].map(([g, es]) => `<h3>${esc(g)}</h3><div class="lista-el">
      <div class="fila-el cabecera-el"><span></span><span>Elemento</span><span>Último cambio</span><span>Próximo</span><span>Próxima visita</span></div>
      ${es.map(e => filaElemento(v, e)).join('')}</div>`).join('')}`;
}
// Km redondeados para «lleva» y «faltan»: a la centena en los coches, a la decena en la bici.
function kmRedondo(v, n) { const p = v.tipo === 'bici' ? 10 : 100; return fKm(Math.round(n / p) * p); }
// Próximo: una línea por límite (km y tiempo), con lo que falta; si hay dos, se marca el que llega primero.
function proximoHTML(v, e) {
  const el = e.el, h = hoy();
  if (!el.intervalo) return 'Sin intervalo';
  const porKm = e.porHoras ? `Por horas de uso (${fNum(el.intervalo.horas)} h ≈ ${kmRedondo(v, e.intKm)})` : 'Por km';
  const lim = [];
  if (e.venceKm != null) lim.push(['km', e.faltanKm <= 0 ? `${porKm}: pasado de ${fKm(e.venceKm)}, ≈ ${kmRedondo(v, -e.faltanKm)} de más`
    : `${porKm}: a los ${fKm(e.venceKm)}, faltan ≈ ${kmRedondo(v, e.faltanKm)}${e.fechaKm ? ` (≈ ${fMes(e.fechaKm)})` : ''}`]);
  if (e.vFecha) lim.push(['tiempo', e.vFecha <= h ? `Por tiempo: venció el ${fFecha(e.vFecha)}, ${cuanto(dias(h, e.vFecha))}` : `Por tiempo: el ${fFecha(e.vFecha)}, ${cuanto(dias(h, e.vFecha))}`]);
  const pct = Math.min(100, Math.round(e.usado * 100));
  return lim.map(([t, txt]) => `<div class="lim${lim.length > 1 && t === e.manda ? ' manda' : ''}">${esc(txt)}${lim.length > 1 && t === e.manda ? ` <span class="chip ${e.color}">${e.color === 'rojo' ? 'vencido' : 'primero'}</span>` : ''}</div>`).join('')
    + `<div class="uso-fila"><span class="uso" title="Gastado el ${pct} % del intervalo"><span class="${e.color}" style="width:${pct}%"></span></span><span class="sub">${pct} %</span></div>`;
}
function filaElemento(v, e) {
  const el = e.el, u = e.ult;
  const ult = u ? `${fMes(u.visita.fecha)}${u.visita.km != null ? ' · ' + fKm(u.visita.km) : ''}` : el.intervalo ? 'Nunca' : '—';
  const tiempo = e.base ? duracion(dias(e.base.fecha, hoy())) : '';   // «11 meses», «4,4 años»
  const lleva = e.base ? `<span class="sub lleva">${e.primera ? 'Desde el alta: ' : 'Lleva '}${tiempo}${e.kmHechos != null ? ` y ≈ ${kmRedondo(v, e.kmHechos)}` : ''}</span>` : '';
  const abierto = S.abiertos.has(v.id + '/' + el.id);
  return `<div class="fila-el">${punto(e.color)}
    <div class="el-nombre"><button class="el-boton" data-accion="ver-el" data-veh="${v.id}" data-el="${esc(el.id)}" aria-expanded="${abierto}">${esc(el.nombre)}</button></div>
    <div class="el-detalle"${abierto ? '' : ' hidden'}>${detalleElemento(v, e)}</div>
    <div class="el-ult"><span class="etq">Último:</span>${ult}${lleva}</div>
    <div class="el-prox"><span class="etq">Próximo:</span>${proximoHTML(v, e)}</div>
    <div class="el-dec"><select data-accion="decision" data-veh="${v.id}" data-el="${esc(el.id)}" aria-label="Próxima visita: ${esc(el.nombre)}">
      ${DECISIONES.map(([val, t]) => `<option value="${val}"${(el.proxima?.decision || '') === val ? ' selected' : ''}>${t}</option>`).join('')}</select></div>
  </div>`;
}
function detalleElemento(v, e) {
  const el = e.el, hist = lineasDe(v, el.id).reverse();
  const filas = [['Referencia', el.referencia], ['Especificación', el.especificacion], ['Intervalo', textoIntervalo(el.intervalo)],
    ['Fuente', el.fuente], ['Nota', el.nota]].filter(([, x]) => x);
  return `<div class="detalle"><dl class="datos">${filas.map(([k, x]) => `<dt>${k}</dt><dd>${esc(x)}</dd>`).join('')}
      <dt>Próxima visita</dt><dd>${esc(el.proxima?.nota || '—')} <button class="boton peque" data-accion="nota-proxima" data-veh="${v.id}" data-el="${esc(el.id)}">Editar</button></dd></dl>
    ${hist.length ? tablaLineas(v, hist) : '<p class="sub">Sin registros en el historial.</p>'}
    <div class="botones"><button class="boton peque" data-accion="editar-elemento" data-veh="${v.id}" data-el="${esc(el.id)}">Editar el elemento</button></div></div>`;
}
// Duración en palabras, como en el resto de la app: «16 días», «23 meses», «4,4 años».
function duracion(d) { return cuanto(-Math.max(0, d)).replace(/^(hace|en) /, ''); }
// Para cada cambio de un elemento (líneas «Cambiado» o «Hecho»): tiempo y km desde el cambio anterior, o desde el alta (010).
// Es lo que en los neumáticos se ve como «km que hicieron», para todos los elementos.
function desdeAnterior(v, el) {
  const m = new Map();
  let prev = { fecha: v.alta.fecha, km: v.alta.km, alta: true, aprox: false };
  for (const x of lineasDe(v, el.id).filter(y => REINICIAN.includes(y.linea.accion))) {
    const km = x.visita.km ?? kmEnFecha(v, x.visita.fecha), aprox = x.visita.km == null;
    m.set(x.linea, { dias: dias(prev.fecha, x.visita.fecha), km: km != null && prev.km != null ? Math.max(0, km - prev.km) : null,
      desdeAlta: prev.alta, aprox: aprox || prev.aprox });
    prev = { fecha: x.visita.fecha, km, alta: false, aprox };
  }
  return m;
}
function textoDesdeAnterior(v, d) {
  if (!d) return '';
  if (!d.dias && !d.km) return '<span class="sub">el mismo día</span>';
  const km = d.km == null ? '' : ` · ${d.aprox ? '≈ ' + kmRedondo(v, d.km) : fKm(Math.round(d.km * 10) / 10)}`;
  return `${duracion(d.dias)}${km}${d.desdeAlta ? '<br><span class="sub">desde el alta</span>' : ''}`;
}
// Historial de un elemento: cuándo, dónde (con el total de la factura), qué, desde el cambio anterior, detalle e importe de la línea.
function tablaLineas(v, hist) {
  const cant = l => l.cantidad != null ? fNum(l.cantidad, Number.isInteger(l.cantidad) ? 0 : 1) + (l.unidad ? ' ' + l.unidad : '') : '';
  const idEl = hist[0]?.linea.elemento, el = idEl ? elemento(v, idEl) : null, desde = el ? desdeAnterior(v, el) : new Map();
  return `<div class="tabla-wrap"><table class="tabla" style="margin-top:8px"><thead><tr><th>Fecha</th><th>Dónde</th><th>Qué</th><th>Desde el cambio anterior</th><th>Detalle</th><th class="num">Importe</th><th></th></tr></thead><tbody>
    ${hist.map(({ visita: x, linea: l }) => `<tr><td class="fecha">${fFecha(x.fecha)}${x.km != null ? `<br><span class="sub">${fKm(x.km)}</span>` : ''}</td>
      <td>${esc(nombreTaller(x.taller))}${x.importe != null ? `<br><span class="sub">Factura ${fEur(x.importe)}</span>` : ''}</td>
      <td>${ACCIONES[l.accion] || esc(l.accion)}</td>
      <td class="desde">${textoDesdeAnterior(v, desde.get(l))}</td>
      <td class="det">${esc([l.marca, l.texto, cant(l), l.dot ? 'DOT ' + l.dot : '', l.nota].filter(Boolean).join(' · '))}</td>
      <td class="num">${l.importe != null ? fEur(l.importe) + (x.lineasConIva ? '' : '<br><span class="sub">sin IVA</span>') : ''}</td>
      <td><button class="boton peque" data-accion="editar-linea" data-veh="${v.id}" data-vis="${esc(x.id)}" data-lin="${x.lineas.indexOf(l)}">Editar</button></td></tr>`).join('')}
  </tbody></table></div>
  <p class="sub">«Factura»: el total de la visita, con IVA. El importe de la línea va como viene en la factura.</p>`;
}

function pestHistorial(v) {
  const vs = [...v.visitas].sort((a, b) => -porFecha(a, b));
  return `<div class="herramientas"><span class="sub">${plural(vs.length, 'visita', 'visitas')}. Pulsa una para ver el detalle.</span>
      <button class="boton peque" data-accion="nueva-visita" data-veh="${v.id}">Añadir visita</button></div>
    <div class="lista-visitas">${vs.map(x => visitaHTML(v, x)).join('')}</div>`;
}
// Mano de obra: horas, precio y total. El total sale de la factura (manoObraImporte) o de horas × precio.
function manoObraTotal(x) {
  return x.manoObraImporte ?? (x.manoObraHoras != null && x.manoObraPrecioHora ? Math.round(x.manoObraHoras * x.manoObraPrecioHora * 100) / 100 : null);
}
function textoManoObra(x) {
  const total = manoObraTotal(x);
  const horas = x.manoObraHoras != null ? `${fNum(x.manoObraHoras, Number.isInteger(x.manoObraHoras) ? 0 : 1)} h${x.manoObraPrecioHora ? ` a ${fNum(x.manoObraPrecioHora, 2)} €/h` : ''}`
    : x.manoObraPrecioHora ? `a ${fNum(x.manoObraPrecioHora, 2)} €/h` : '';
  if (total == null && !horas) return '';
  return `Mano de obra: ${[horas, total != null ? fEur(total) + (x.lineasConIva ? '' : ' sin IVA') : ''].filter(Boolean).join(' · ')}`;
}
function visitaHTML(v, x) {
  const tipo = x.tipo !== 'taller' ? `<span class="chip">${esc(TIPOS_VISITA[x.tipo] || x.tipo)}</span>` : '';
  const itv = x.itv ? `<span class="chip ${x.itv.resultado === 'favorable' ? 'verde' : 'rojo'}">${x.itv.resultado === 'favorable' ? 'Favorable' : 'Desfavorable'}</span>` : '';
  const dudosas = x.lineas.filter(l => l.accion === 'dudoso').length;
  const conImporte = x.lineas.some(l => l.importe != null);
  const mo = textoManoObra(x), f = x.factura;
  return `<details class="visita" id="det-vis-${esc(x.id)}"><summary><b>${fFecha(x.fecha)}</b><span>${esc(nombreTaller(x.taller))}</span>
      <span class="sub">${x.km != null ? fKm(x.km) : ''}</span><span>${x.importe != null ? fEur(x.importe) : ''}</span>${tipo}${itv}${dudosas ? `<span class="chip ambar">${plural(dudosas, 'línea dudosa', 'líneas dudosas')}</span>` : ''}</summary>
    <div class="cuerpo">
      ${x.itv?.defectos ? `<p>Defectos: ${esc(x.itv.defectos)}</p>` : ''}
      ${x.lineas.length ? `<div class="tabla-wrap"><table class="tabla"><thead><tr><th>Elemento</th><th>Detalle</th><th class="num">Cant.</th><th class="num">Importe</th><th>Acción</th><th></th></tr></thead><tbody>
        ${x.lineas.map((l, i) => { const el = l.elemento ? elemento(v, l.elemento) : null; return `<tr><td>${esc(el ? el.nombre : l.texto || l.elemento)}</td>
          <td class="det">${esc([el ? l.texto : '', l.marca, l.referencia, l.dot ? 'DOT ' + l.dot : '', l.nota].filter(Boolean).join(' · '))}</td>
          <td class="num">${l.cantidad != null ? fNum(l.cantidad, Number.isInteger(l.cantidad) ? 0 : 1) + (l.unidad ? ' ' + esc(l.unidad) : '') : ''}</td>
          <td class="num">${l.importe != null ? fEur(l.importe) : ''}</td><td>${ACCIONES[l.accion] || esc(l.accion)}</td>
          <td><button class="boton peque" data-accion="editar-linea" data-veh="${v.id}" data-vis="${esc(x.id)}" data-lin="${i}">Editar</button></td></tr>`; }).join('')}
      </tbody></table></div>` : '<p class="sub">Sin líneas.</p>'}
      ${conImporte ? `<p class="sub">Importes de las líneas ${x.lineasConIva ? 'con' : 'sin'} IVA${x.importe != null ? '; el total de la visita lleva IVA' : ''}.</p>` : ''}
      ${mo ? `<p>${mo}</p>` : ''}
      ${x.notas ? `<p class="sub">${esc(x.notas)}</p>` : ''}
      ${f ? `<p>Factura${f.numero ? ` nº ${esc(f.numero)}` : ''}${f.fichero ? `: <span class="mono">${esc(f.fichero)}</span>` : ''}${f.enlace ? ` · <a href="${esc(f.enlace)}" target="_blank" rel="noopener">abrir</a>` : ''}</p>` : ''}
      <div class="botones"><button class="boton peque" data-accion="nueva-linea" data-veh="${v.id}" data-vis="${esc(x.id)}">Añadir línea</button>
        <button class="boton peque" data-accion="editar-visita" data-veh="${v.id}" data-vis="${esc(x.id)}">Editar la visita</button></div>
    </div></details>`;
}

function pestFicha(v) {
  const filas = [...v.ficha.map(f => [f.campo, f.valor]), ['Alta', `${fFecha(v.alta.fecha)} · ${fKm(v.alta.km)}`]];
  if (v.baja) filas.push(['Baja', `${fFecha(v.baja.fecha)} · ${v.baja.motivo || ''}`]);
  const cf = v.carpetaFacturas;
  return `<div class="caja"><dl class="datos">${filas.map(([k, x]) => `<dt>${esc(k)}</dt><dd>${esc(x)}</dd>`).join('')}
    ${cf ? `<dt>Facturas</dt><dd><span class="mono">${esc(cf.ruta || cf.nombre || '')}</span>${cf.enlace ? ` · <a href="${esc(cf.enlace)}" target="_blank" rel="noopener">abrir la carpeta</a>` : ''}</dd>` : ''}
  </dl></div>
  <div class="botones"><button class="boton peque" data-accion="editar-ficha" data-veh="${v.id}">Editar la ficha</button></div>
  <p class="sub">Las lecturas de km y los km de cada año están en la pestaña <a href="#/v/${v.id}/km">Km</a>.</p>`;
}

// ─── Km: todas las lecturas y los km de cada año ─────────────────────────────
// Todas las lecturas: alta, visitas con km y lecturas sueltas. Las de la misma fecha y los mismos km van en una fila.
function lecturasTodas(v) {
  const L = [{ fecha: v.alta.fecha, km: v.alta.km, fuente: 'Alta' }];
  for (const x of v.visitas) if (x.km != null) {
    const donde = x.tipo === 'taller' ? nombreTaller(x.taller) : [TIPOS_VISITA[x.tipo] || x.tipo, x.taller ? nombreTaller(x.taller) : ''].filter(Boolean).join(' · ');
    L.push({ fecha: x.fecha, km: x.km, fuente: donde + (x.factura?.numero ? ` (factura ${x.factura.numero})` : '') });
  }
  v.lecturas.forEach((l, i) => { if (l.km != null) L.push({ fecha: l.fecha, km: l.km, fuente: l.fuente || 'Lectura', indice: i }); });

// ─── Hoja para el taller ─────────────────────────────────────────────────────
// Sale de la decisión «próxima visita» de cada elemento (Sí, Revisar, Presupuesto, No) y de los pendientes abiertos.

function vistaHoja(v) {

  // Un pendiente de un elemento que ya sale en la hoja va en la fila de ese elemento; los demás, aparte.

  const sueltos = abiertos.filter(p => !enHoja.has(p.elemento));
  const pendRevisar = sueltos.filter(p => p.tipo !== 'presupuesto'), pendPresupuesto = sueltos.filter(p => p.tipo === 'presupuesto');
  const itv = v.caducidades.find(c => /^itv$/i.test(c.tipo));

    ['Kilómetros', `${fKm(u.km)} (${fFecha(u.fecha)})`],

    ...v.ficha.filter(x => !/^fuente/i.test(x.campo)).map(x => [x.campo, x.valor])].filter(([k]) => !(h.ocultar || []).includes(k));
  // Tres columnas: cada dato ocupa 1, 2 o 3 según lo largo que sea, y la última casilla de cada fila se estira hasta el borde.
  const anchos = campos.map(([, x]) => x.length > 90 ? 3 : x.length > 38 ? 2 : 1);
  for (let i = 0, usado = 0; i < anchos.length; i++) {
    if (usado + anchos[i] > 3) { anchos[i - 1] += 3 - usado; usado = 0; }
    usado = (usado + anchos[i]) % 3;
    if (i === anchos.length - 1 && usado) anchos[i] += 3 - usado;
  }
  const celda = ([k, x, tarde], i) => `<div class="${['', '', 'w2', 'w3'][anchos[i]]}"><dt>${esc(k)}</dt><dd${tarde ? ' class="tarde"' : ''}>${esc(x)}</dd></div>`;

    const [t, ...resto] = b.split('\n');

  });
  // Mismos datos para todos los elementos (010), sacados del semáforo: intervalo, lo que lleva desde el último cambio y cuándo toca

  const ultimoTxt = e => e.ult ? `Último cambio: ${fMes(e.ult.visita.fecha)}${e.ult.visita.km != null ? ` (${fKm(e.ult.visita.km)})` : ''}` : '';
  const lleva = e => !e.base ? '' : e.primera ? `Nunca cambiado: ${duracion(dias(e.base.fecha, f))}${e.kmHechos != null ? ` y ≈ ${kmRedondo(v, e.kmHechos)}` : ''} desde el alta`
    : `Lleva ${duracion(dias(e.base.fecha, f))}${e.kmHechos != null ? ` y ≈ ${kmRedondo(v, e.kmHechos)}` : ''}`;
  const toca = e => !e.el.intervalo || !e.texto ? '' : e.color === 'rojo' ? e.texto : `Toca: ${e.texto}`;
  const datos = (e, conUltimo) => {
    const p = [conUltimo ? ultimoTxt(e) : '', e.el.intervalo ? textoIntervalo(e.el.intervalo) : '', lleva(e), toca(e)].filter(Boolean);
    return p.length ? `<div class="h-nota">${esc(p.join('. '))}.</div>` : '';

    .filter(Boolean).map(t => `<div class="h-nota h-libre">${esc(t)}</div>`).join('');
  const ultimo = e => e.ult ? `${fMes(e.ult.visita.fecha)}${e.ult.visita.km != null ? `<div class="h-nota">${fKm(e.ult.visita.km)}</div>` : ''}`
    : e.el.intervalo ? 'Nunca' : '—';

// Devuelve los campos del formulario, null si se cancela, o { _borrar: true } con el botón «borrar».
// preparar(form): se llama al abrir y en cada cambio (para enseñar u ocultar campos).
function dialogo({ titulo, cuerpo, ok = 'Guardar', cancelar = 'Cancelar', borrar, validar, preparar, ancho }) {
  return new Promise(resolve => {
    const d = $('#dlg');
    d.style.width = ancho ? `min(${ancho}px, calc(100vw - 32px))` : '';
    d.innerHTML = `<form class="dlg" novalidate><h2>${esc(titulo)}</h2><div>${cuerpo}</div><p class="error" hidden></p>
      <div class="dlg-botones">${borrar ? `<button type="button" class="boton peligro" data-dlg="borrar">${esc(borrar)}</button>` : ''}${cancelar ? `<button type="button" class="boton" data-dlg="no">${esc(cancelar)}</button>` : ''}<button type="submit" class="boton primario">${esc(ok)}</button></div></form>`;
    const f = d.querySelector('form'), err = d.querySelector('.error');
    let hecho = false;
    const cerrar = v => { if (hecho) return; hecho = true; d.close(); resolve(v); };
    d.querySelector('[data-dlg="no"]')?.addEventListener('click', () => cerrar(null));
    d.querySelector('[data-dlg="borrar"]')?.addEventListener('click', () => cerrar({ _borrar: true }));
    d.oncancel = e => { e.preventDefault(); cerrar(null); };
    f.addEventListener('input', () => { err.hidden = true; });
    if (preparar) { f.addEventListener('change', () => preparar(f)); preparar(f); }
    f.addEventListener('submit', e => {
      e.preventDefault();
      const datos = Object.fromEntries(new FormData(f));
      const m = validar ? validar(datos) : null;
      if (m) { err.textContent = m; err.hidden = false; return; }
      cerrar(datos);
    });
    d.showModal();
    d.scrollTop = 0;
    f.querySelector('input:not([type=hidden]), select, textarea')?.focus();
  });
}
async function confirmar(titulo, texto, ok) { return !!(await dialogo({ titulo, cuerpo: `<p>${esc(texto)}</p>`, ok })); }

const cTexto = (etq, name, val, extra = '') => `<label>${etq}<input type="text" name="${name}" value="${esc(val ?? '')}" autocomplete="off" ${extra}></label>`;
const cNum = (etq, name, n, dec) => cTexto(etq, name, fEdit(n, dec), 'inputmode="decimal"');

const cFecha = (etq, name, f) => `<label>${etq}<input type="date" name="${name}" value="${esc(f || '')}"></label>`;
const cLista = (etq, name, ops, actual) => `<label>${etq}<select name="${name}">${ops.map(([k, t]) => `<option value="${esc(k)}"${String(actual ?? '') === String(k) ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select></label>`;

const cCasilla = (etq, name, marcada) => `<label class="interruptor"><input type="checkbox" name="${name}"${marcada ? ' checked' : ''}> ${etq}</label>`;
// Primer campo numérico mal escrito, o null.
function malNumero(x, campos) { for (const [k, etq] of campos) if (String(x[k] ?? '').trim() && numero(x[k]) == null) return `${etq}: no es un número.`; return null; }
const esFecha = f => /^\d{4}-\d{2}-\d{2}$/.test(f || '');
function opcionesTaller(actual) {
  const ts = [...D().talleres].sort((a, b) => a.nombre.localeCompare(b.nombre, 'es')).map(t => [t.id, t.nombre]);
  if (actual && actual !== 'yo' && !ts.some(([id]) => id === actual)) ts.unshift([actual, actual]);
  return [['', '—'], ['yo', 'Yo'], ...ts];
}
function crearTaller(nombre) {
  const t = D().talleres.find(x => x.nombre.toLowerCase() === nombre.toLowerCase());
  if (t) return t.id;
  const id = idLibre(slug(nombre), D().talleres.map(x => x.id));
  D().talleres.push({ id, nombre });
  return id;
}
function opcionesElemento(v, actual) {
  const grupos = new Map();
  for (const e of [...v.elementos].sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'))) {
    const g = e.grupo || 'Otros'; if (!grupos.has(g)) grupos.set(g, []); grupos.get(g).push(e);
  }
  return `<option value="">— Sin elemento (mano de obra, material, tasas…) —</option>` + [...grupos].sort((a, b) => a[0].localeCompare(b[0], 'es'))
    .map(([g, es]) => `<optgroup label="${esc(g)}">${es.map(e => `<option value="${esc(e.id)}"${e.id === actual ? ' selected' : ''}>${esc(e.nombre)}</option>`).join('')}</optgroup>`).join('');
}
// Km de una visita que no cuadran con el resto de lecturas (una errata al escribirlos), o null.
function kmIncoherentes(v, fecha, km, visita) {
  const L = [{ fecha: v.alta.fecha, km: v.alta.km }, ...v.visitas.filter(y => y !== visita && y.km != null), ...v.lecturas.filter(l => l.km != null)];
  const antes = L.filter(l => l.fecha < fecha && l.km > km).sort((a, b) => b.km - a.km)[0];
  if (antes) return `El ${fFecha(antes.fecha)} ya tenía ${fKm(antes.km)}: no puede tener menos el ${fFecha(fecha)}.`;
  const despues = L.filter(l => l.fecha > fecha && l.km < km).sort((a, b) => a.km - b.km)[0];
  if (despues) return `El ${fFecha(despues.fecha)} tenía ${fKm(despues.km)}: no puede tener más el ${fFecha(fecha)}.`;
  return null;
}

async function apuntarKm(id) {
  const v = veh(id), u = kmActual(v), bici = v.tipo === 'bici';
  const r = await dialogo({
    titulo: `Apuntar km · ${v.nombre}`,
    cuerpo: `<p class="sub">Última lectura: ${fKm(u.km)} el ${fFecha(u.fecha)}.</p>
      <label>Fecha<input type="date" name="fecha" value="${hoy()}" max="${hoy()}"></label>
      <label>Km del cuentakilómetros<input type="text" name="km" inputmode="decimal" autocomplete="off" placeholder="${bici ? '1234,5' : '123456'}"></label>
      <label>De dónde sale<input type="text" name="fuente" value="Yo"></label>`,
    validar: x => {
      const km = numero(x.km);
      if (km == null || km < 0) return 'Escribe los km.';
      if (!/^\d{4}-\d{2}-\d{2}$/.test(x.fecha || '')) return 'Falta la fecha.';
      if (x.fecha > hoy()) return 'La fecha no puede ser futura.';
      if (x.fecha >= u.fecha && km < u.km) return `Son menos km que la última lectura (${fKm(u.km)}).`;
      return null;
    }
  });
  if (!r) return;
  v.lecturas.push({ fecha: r.fecha, km: numero(r.km), fuente: r.fuente.trim() || 'Yo' });
  await guardar('Km apuntados');
}

// (011) «Proponer la próxima visita»: «Sí» para lo vencido y «Revisar» para lo que vence pronto (ámbar).
// Si el elemento estaba sin decidir («—»), sale ya con la propuesta; si ya se había elegido otra cosa, sale con lo elegido.
// Lo que ya está en «Sí» no se toca. Antes de guardar se enseña todo en un diálogo.
async function proponerProxima(vid) {
  const v = veh(vid);
  const filas = v.elementos.map(e => estadoElemento(v, e)).filter(e => e.color === 'rojo' || e.color === 'ambar')
    .map(e => ({ e, actual: e.el.proxima?.decision || '', propuesta: e.color === 'rojo' ? 'SI' : 'Revisar' }))
    .filter(f => f.actual !== 'SI' && f.actual !== f.propuesta)
    .sort((a, b) => porUrgencia(a.e, b.e));
  if (!filas.length) return dialogo({ titulo: 'Proponer la próxima visita', ok: 'Cerrar', cancelar: null,
    cuerpo: '<p>No hay nada vencido ni que venza pronto que no esté ya marcado.</p>' });
  const r = await dialogo({
    titulo: `Próxima visita · ${v.nombre}`, ancho: 620,
    cuerpo: `<p class="sub">«Sí» para lo vencido y «Revisar» para lo que vence pronto. Lo que ya habías decidido tú sale con tu decisión: cámbiala si quieres.</p>
      <div class="propuesta">${filas.map((f, i) => `<div class="prop-fila">${punto(f.e.color)}<div><b>${esc(f.e.el.nombre)}</b><br><span class="sub">${esc(f.e.texto)}${f.actual ? ` · ahora: ${esc(DECISIONES.find(([k]) => k === f.actual)?.[1] || f.actual)}` : ''}</span></div>
        <select name="d${i}" aria-label="${esc(f.e.el.nombre)}">${DECISIONES.map(([k, t]) => `<option value="${k}"${(f.actual || f.propuesta) === k ? ' selected' : ''}>${t}</option>`).join('')}</select></div>`).join('')}</div>`,
    ok: 'Guardar'
  });
  if (!r) return;
  let n = 0;
  filas.forEach((f, i) => { if (r['d' + i] !== f.actual) { f.e.el.proxima = { ...(f.e.el.proxima || { nota: '' }), decision: r['d' + i] }; n++; } });
  if (n) await guardar(`Próxima visita: ${plural(n, 'cambio', 'cambios')}`);
}

async function renovarCaducidad(vid, cid) {
  const v = veh(vid), c = v.caducidades.find(x => x.id === cid), dt = c.datos || {};

    validar: x => !x.texto.trim() ? 'Escribe qué pasa.' : !esFecha(x.desde) ? 'Falta la fecha de «desde».' : null
  });
  if (!r) return;
  if (r._borrar) {
    if (!await confirmar('Borrar el pendiente', `Se borra «${p.texto}». Si ya no hace falta, también se puede cerrar como «Descartado».`, 'Borrar')) return;
    v.pendientes.splice(v.pendientes.indexOf(p), 1);
    return guardar('Pendiente borrado');
  }
  Object.assign(p, { tipo: r.tipo, texto: r.texto.trim(), elemento: r.elemento || undefined, desde: r.desde, nota: limpio(r.nota) });

// Reabrir: el cierre anterior se queda escrito en la nota.
async function reabrirPendiente(vid, pid) {
  const p = veh(vid).pendientes.find(x => x.id === pid);
  const antes = `${p.estado === 'hecho' ? 'Hecho' : 'Descartado'}${p.cierre?.fecha ? ' el ' + fFecha(p.cierre.fecha) : ''}${p.cierre?.nota ? ` (${p.cierre.nota})` : ''}; reabierto el ${fFecha(hoy())}.`;
  p.nota = [p.nota, antes].filter(Boolean).join(' ');
  p.estado = 'abierto'; delete p.cierre;
  await guardar('Pendiente reabierto');
}

  });

// Ficha (013): datos libres y en orden, un nombre y un valor por fila. Se pueden añadir, quitar y mover.
// Cada fila lleva su nombre de antes (orig): si cambia el nombre de un dato oculto en la hoja del taller, sigue oculto con el nombre nuevo.
const FICHA_RESERVADOS = ['Alta', 'Baja', 'Facturas', 'Matrícula', 'Kilómetros', 'ITV'];   // ya los pone la app en la ficha o en la hoja
function filasFicha(x) {
  return Object.keys(x).filter(k => /^campo\d+$/.test(k)).map(k => {
    const i = k.slice(5);
    return { campo: x[k].trim(), valor: String(x['valor' + i] ?? '').replace(/\s*\n\s*/g, ' ').trim(), orig: x['orig' + i] || '' };
  }).filter(f => f.campo || f.valor);
}
async function editarFicha(vid) {
  const v = veh(vid);
  let n = 0;
  const fila = (f = { campo: '', valor: '' }, orig = '') => { const i = n++; return `<div class="ficha-fila">
      <input type="text" name="campo${i}" value="${esc(f.campo)}" placeholder="Dato" aria-label="Dato" autocomplete="off"><input type="hidden" name="orig${i}" value="${esc(orig)}">
      <div class="ficha-botones"><button type="button" class="boton peque" data-ficha="subir" aria-label="Subir">↑</button><button type="button" class="boton peque" data-ficha="bajar" aria-label="Bajar">↓</button><button type="button" class="boton peque peligro" data-ficha="quitar" aria-label="Quitar">✕</button></div>
      <textarea name="valor${i}" rows="${Math.min(4, Math.max(1, Math.ceil(f.valor.length / 42)))}" placeholder="Valor" aria-label="Valor">${esc(f.valor)}</textarea></div>`; };
  const r = await dialogo({
    titulo: `Ficha · ${v.nombre}`, ancho: 600,
    cuerpo: `<p class="sub">Un dato por fila, en el orden en que salen en la ficha y en la hoja para el taller. Los que empiezan por «Fuente» van al pie de la hoja.</p>
      <div class="ficha-filas">${v.ficha.map(f => fila(f, f.campo)).join('')}</div>
      <div class="botones"><button type="button" class="boton peque" data-ficha="nuevo">Añadir un dato</button></div>`,
    preparar: f => {
      if (f.dataset.listo) return;
      f.dataset.listo = '1';
      f.addEventListener('click', e => {
        const b = e.target.closest('[data-ficha]'), fl = b?.closest('.ficha-fila');
        if (!b) return;
        if (b.dataset.ficha === 'nuevo') { f.querySelector('.ficha-filas').insertAdjacentHTML('beforeend', fila()); f.querySelector('.ficha-filas').lastElementChild.querySelector('input').focus(); }
        else if (b.dataset.ficha === 'subir' && fl.previousElementSibling) fl.previousElementSibling.before(fl);
        else if (b.dataset.ficha === 'bajar' && fl.nextElementSibling) fl.nextElementSibling.after(fl);
        else if (b.dataset.ficha === 'quitar') fl.remove();
      });
    },
    validar: x => {
      const fs = filasFicha(x), vistos = new Set();
      for (const f of fs) {
        if (!f.campo) return `Falta el nombre del dato «${f.valor.slice(0, 40)}».`;
        if (!f.valor) return `Falta el valor de «${f.campo}». Si sobra, quítalo con ✕.`;
        if (FICHA_RESERVADOS.some(c => c.toLowerCase() === f.campo.toLowerCase())) return `«${f.campo}» ya lo pone la app: elige otro nombre.`;
        if (vistos.has(f.campo.toLowerCase())) return `Hay dos datos que se llaman «${f.campo}».`;
        vistos.add(f.campo.toLowerCase());
      }
      return null;
    }
  });
  if (!r) return;
  const fs = filasFicha(r), antes = new Set(v.ficha.map(f => f.campo));
  v.ficha = fs.map(({ campo, valor }) => ({ campo, valor }));
  if (v.hoja?.ocultar) {
    const nombre = new Map(fs.filter(f => f.orig).map(f => [f.orig, f.campo]));
    const ocultar = v.hoja.ocultar.filter(c => !antes.has(c) || nombre.has(c)).map(c => nombre.get(c) ?? c);
    v.hoja = { ...v.hoja, ocultar: ocultar.length ? ocultar : undefined };
  }
  await guardar('Ficha guardada');
}

// Lo que la hoja para el taller no saca de los datos. Se guarda con el vehículo (v.hoja) para la próxima vez.
async function ajustarHoja(vid) {
  const v = veh(vid), h = v.hoja || {}, ocultos = h.ocultar || [];
  // Primero los datos fijos de la cabecera (matrícula, km, ITV) y después los de la ficha; se ocultan por su nombre.
  const campos = [...(v.matricula ? ['Matrícula'] : []), 'Kilómetros', ...(v.caducidades.some(c => /^itv$/i.test(c.tipo)) ? ['ITV'] : []),
    ...v.ficha.filter(x => !/^fuente/i.test(x.campo)).map(x => x.campo)].map(campo => ({ campo }));
  const r = await dialogo({
    titulo: `Hoja para el taller · ${v.nombre}`, ancho: 560,
    cuerpo: `${cTexto('Motivo de la visita', 'motivo', h.motivo, 'placeholder="Revisión antes de la ITV"')}
      ${cLista('Taller', 'taller', opcionesTaller(h.taller).filter(([k]) => k !== 'yo'), h.taller || '')}
      ${cArea('Avisos para el taller', 'avisos', h.avisos, 5)}
      <p class="sub">Un aviso por párrafo, con una línea en blanco entre dos. La primera línea es el título.</p>
      ${cArea('En la factura, por favor (una petición por línea)', 'pedir', h.pedir, 3)}
      <p class="sub">Ya salen siempre: detallar aceites y recambios con referencia, cantidad y km, y llamar antes de reparar algo que no esté en la hoja.</p>
      ${campos.length ? `<fieldset><legend>Datos que salen arriba en la hoja</legend>${campos.map((x, i) => cCasilla(esc(x.campo), 'ficha' + i, !ocultos.includes(x.campo))).join('')}</fieldset>` : ''}`
  });
  if (!r) return;
  const ocultar = campos.filter((x, i) => !r['ficha' + i]).map(x => x.campo);
  v.hoja = { motivo: limpio(r.motivo), taller: r.taller || undefined, avisos: limpio(r.avisos), pedir: limpio(r.pedir), ocultar: ocultar.length ? ocultar : undefined };
  await guardar('Hoja guardada');
}
// El título de la página es el nombre que propone el navegador para el PDF.
function imprimirHoja(vid) {
  const v = veh(vid), antes = document.title;
  document.title = `Hoja taller ${v.nombre}${v.matricula ? ' ' + v.matricula.replace(/\s/g, '') : ''} (${hoy().slice(0, 7)})`;
  window.addEventListener('afterprint', () => { document.title = antes; }, { once: true });
  window.print();
}

// ─── Exportar a Excel ────────────────────────────────────────────────────────

// Los guardados van en cola, uno detrás de otro.
function guardar(msg) { S.cola = S.cola.then(() => guardarAhora(msg)); return S.cola; }
async function guardarAhora(msg) {

// ─── Dropbox ─────────────────────────────────────────────────────────────────
function b64url(bytes) { return btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
async function conectarDropbox() {
  if (!clave()) return toast('Falta la clave de la app de Dropbox');
  const verificador = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const reto = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verificador))));
  const estado = b64url(crypto.getRandomValues(new Uint8Array(12)));
  escribirLS(LS.pkce, JSON.stringify({ verificador, estado }));
  location.href = 'https://www.dropbox.com/oauth2/authorize?' + new URLSearchParams({ client_id: clave(), response_type: 'code', redirect_uri: REDIRECT,
    code_challenge: reto, code_challenge_method: 'S256', token_access_type: 'offline', state: estado });
}
// A la vuelta de Dropbox la dirección trae ?code=…&state=…: se cambia por un token y se quita de la dirección.
async function volverDeDropbox() {
  const q = new URLSearchParams(location.search), code = q.get('code');
  if (!code) return false;
  history.replaceState(null, '', location.pathname + location.hash);
  const p = JSON.parse(leerLS(LS.pkce) || 'null');
  escribirLS(LS.pkce, null);
  if (!p || p.estado !== q.get('state')) throw new Error('La vuelta de Dropbox no corresponde a esta petición');
  const r = await red(DBX.token, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ code, grant_type: 'authorization_code', client_id: clave(), redirect_uri: REDIRECT, code_verifier: p.verificador }) });
  const j = await r.json();
  if (!j.access_token) throw new Error('Dropbox no ha dado acceso');
  S.token = j.access_token;
  if (j.refresh_token) escribirLS(LS.refresh, j.refresh_token);
  return true;
}
async function renovarToken() {
  const rt = leerLS(LS.refresh);
  if (!rt) throw new Error('SIN_SESION');
  const r = await red(DBX.token, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: rt, client_id: clave() }) });
  const j = await r.json().catch(() => ({}));
  if (!j.access_token) throw new Error('SIN_SESION');
  S.token = j.access_token;
}
async function dbx(fn) {
  if (!S.token) await renovarToken();
  try { return await fn(); } catch (e) { if (e.message !== 'TOKEN') throw e; await renovarToken(); return await fn(); }
}
async function bajar(ruta) {
  const r = await red(DBX.contenido + 'files/download', { method: 'POST', headers: { Authorization: 'Bearer ' + S.token, 'Dropbox-API-Arg': JSON.stringify({ path: ruta }) } });
  if (r.status === 401) throw new Error('TOKEN');
  if (r.status === 409) return null;                          // no existe
  if (!r.ok) throw new Error('Dropbox respondió ' + r.status);
  let rev = null; try { rev = JSON.parse(r.headers.get('Dropbox-API-Result')).rev; } catch (e) { }
  return { texto: await r.text(), rev };
}
// rev: solo se guarda si el fichero de Dropbox sigue en esa versión; si otro aparato guardó después, CONFLICTO.
async function subir(ruta, texto, rev, copia = false) {
  const mode = copia || !rev ? 'add' : { '.tag': 'update', update: rev };
  const r = await red(DBX.contenido + 'files/upload', { method: 'POST', headers: { Authorization: 'Bearer ' + S.token,
    'Dropbox-API-Arg': JSON.stringify({ path: ruta, mode, autorename: copia, mute: true }), 'Content-Type': 'application/octet-stream' },
    body: new TextEncoder().encode(texto) });
  if (r.status === 401) throw new Error('TOKEN');
  if (r.status === 409) { const t = await r.text().catch(() => ''); throw new Error(t.includes('conflict') ? 'CONFLICTO' : 'Dropbox: ' + t.slice(0, 80)); }
  if (!r.ok) throw new Error('Dropbox respondió ' + r.status);
  return r.json();
}
async function revActual(ruta) {
  const r = await red(DBX.api + 'files/get_metadata', { method: 'POST', headers: { Authorization: 'Bearer ' + S.token, 'Content-Type': 'application/json' }, body: JSON.stringify({ path: ruta }) });
  if (r.status === 401) throw new Error('TOKEN');
  if (r.status === 409) return null;
  if (!r.ok) throw new Error('Dropbox respondió ' + r.status);
  return (await r.json()).rev;
}
async function cargarDropbox() {
  const r = await dbx(() => bajar(RUTA));
  S.datos = r ? leerDatos(r.texto) : null;
  S.rev = r ? r.rev : null;
  S.origen = 'dropbox'; S.archivo = null; S.sucio = false;
}
// Al volver a la pestaña: si otro aparato ha guardado y aquí no hay nada pendiente, se recargan los datos.
async function comprobarCambios() {
  if (S.origen !== 'dropbox' || S.sucio) return;
  try {
    const rev = await dbx(() => revActual(RUTA));
    if (rev && rev !== S.rev) { await cargarDropbox(); render(); toast('Datos actualizados con los cambios de otro aparato'); }
  } catch (e) { console.warn('No se ha podido comprobar la versión de Dropbox', e.message); }
}
async function desconectarDropbox() {
  const r = await dialogo({ titulo: 'Desconectar Dropbox', ok: 'Desconectar', cuerpo: '<p>En este aparato dejarán de verse los datos hasta que vuelvas a conectar. En Dropbox no se borra nada.</p>' });

// ─── Importar ────────────────────────────────────────────────────────────────
// Dos tipos de fichero: datos completos (formato 1 con vehiculos) o una importación
// { formato: 1, tipo: "importacion", descripcion, operaciones: [ { op, vehiculo, … } ] }. Ver PROYECTO.md.
async function leerImport(f) {
  if (!f) return;
  let obj;
  try { obj = JSON.parse(await f.text()); } catch (e) { S.importacion = { nombre: f.name, error: 'No es un fichero JSON válido.' }; render(); return; }
  S.importacion = prepararImport(obj, f.name);
  render();
}
function prepararImport(obj, nombre) {
  if (obj && obj.formato === 1 && Array.isArray(obj.vehiculos)) {
    let datos; try { datos = leerDatos(JSON.stringify(obj)); } catch (e) { return { nombre, error: e.message }; }
    const n = datos.vehiculos.reduce((s, v) => s + v.visitas.length, 0);
    return { nombre, completo: true, datos, items: [{ ok: true, texto: `Datos completos: ${datos.vehiculos.map(v => v.nombre).join(', ')}; ${plural(n, 'visita', 'visitas')}.${D() ? ' Sustituyen a todos los datos actuales.' : ''}` }] };
  }
  if (!obj || obj.tipo !== 'importacion' || !Array.isArray(obj.operaciones)) return { nombre, error: 'No es una importación de Ruedak ni unos datos completos.' };
  if (!D()) return { nombre, error: 'Primero hay que cargar unos datos completos.' };
  const copia = structuredClone(D());
  const items = obj.operaciones.map(op => aplicarOperacion(copia, op));
  return { nombre, descripcion: obj.descripcion, completo: false, datos: copia, items, validas: items.filter(i => i.ok).length };
}
function aplicarOperacion(d, op) {
  const mal = texto => ({ ok: false, texto });
  const v = op.vehiculo ? d.vehiculos.find(x => x.id === op.vehiculo) : null;
  const nv = v ? v.nombre : op.op === 'taller' ? 'Talleres' : String(op.vehiculo);
  const porId = (lista, obj, que) => {             // añade o actualiza por id
    if (!obj?.id) return mal(`${nv}: ${que} sin id`);
    const i = lista.findIndex(x => x.id === obj.id);
    if (i < 0) { lista.push(obj); return { ok: true, texto: `${nv}: ${que} nuevo «${obj.nombre || obj.texto || obj.tipo || obj.id}»` }; }
    lista[i] = { ...lista[i], ...obj };
    return { ok: true, texto: `${nv}: ${que} «${lista[i].nombre || lista[i].texto || lista[i].tipo || obj.id}» actualizado` };
  };
  if (op.op !== 'taller' && op.op !== 'vehiculo' && !v) return mal(`Vehículo «${op.vehiculo}» desconocido`);
  switch (op.op) {
    case 'visita': {
      const x = op.visita;
      if (op.actualizar) {                       // completar una visita que ya existe: solo los campos que trae, sin tocar sus líneas
        const y = x?.id ? v.visitas.find(z => z.id === x.id) : null;
        if (!y) return mal(`${nv}: no existe la visita ${x?.id || '(sin id)'} para completarla`);
        const { id, lineas, completarLineas = [], ...campos } = x;
        if (lineas) return mal(`${nv}: al completar la visita ${x.id} no se pueden cambiar sus líneas`);
        // completarLineas (008): [{ elemento, accion?, …campos }]: completa la única línea de ese elemento (y acción) en la visita.
        // Primero se comprueban todas, para no dejar nada a medias si una no vale.
        const destinos = completarLineas.map(c => y.lineas.filter(l => l.elemento === c.elemento && (!c.accion || l.accion === c.accion)));
        const fallo = completarLineas.findIndex((c, i) => destinos[i].length !== 1);
        if (fallo >= 0) { const c = completarLineas[fallo];
          return mal(`${nv}: en la visita del ${fFecha(y.fecha)} no hay una sola línea de «${elemento(v, c.elemento)?.nombre || c.elemento}»${c.accion ? ` (${ACCIONES[c.accion] || c.accion})` : ''} que completar`); }
        if (campos.factura) campos.factura = { ...y.factura, ...campos.factura };
        const cambiados = Object.keys(campos).filter(k => JSON.stringify(y[k]) !== JSON.stringify(campos[k]));
        Object.assign(y, campos); v.visitas.sort(porFecha);
        completarLineas.forEach(({ elemento: e, accion, ...resto }, i) => Object.assign(destinos[i][0], resto));
        if (completarLineas.length) cambiados.push('líneas: ' + completarLineas.map(c => elemento(v, c.elemento)?.nombre || c.elemento).join(', '));
        return { ok: true, texto: `${nv}: visita del ${fFecha(y.fecha)} completada (${cambiados.join(', ') || 'sin cambios'})${textoLibres(liberarDecisiones(v, y))}` };
      }
      if (!x?.id || !/^\d{4}-\d{2}-\d{2}$/.test(x.fecha || '')) return mal(`${nv}: visita sin id o sin fecha`);
      if (v.visitas.some(y => y.id === x.id)) return mal(`${nv}: la visita ${x.id} ya existe; no se duplica`);
      x.lineas = x.lineas || [];
      const malos = x.lineas.filter(l => l.elemento && !v.elementos.some(e => e.id === l.elemento)).map(l => l.elemento);
      if (malos.length) return mal(`${nv}: la visita ${x.id} usa elementos que no existen (${malos.join(', ')})`);
      v.visitas.push(x); v.visitas.sort(porFecha);
      return { ok: true, texto: `${nv}: visita del ${fFecha(x.fecha)} · ${nombreTaller(x.taller, d)}${x.km != null ? ' · ' + fKm(x.km) : ''}${x.importe != null ? ' · ' + fEur(x.importe) : ''} · ${plural(x.lineas.length, 'línea', 'líneas')}${textoLibres(liberarDecisiones(v, x))}` };
    }
    case 'lectura': {
      const l = op.lectura;
      if (!l || l.km == null || !l.fecha) return mal(`${nv}: lectura sin fecha o sin km`);
      if (v.lecturas.some(x => x.fecha === l.fecha && x.km === l.km)) return mal(`${nv}: la lectura de ${fKm(l.km)} del ${fFecha(l.fecha)} ya existe`);
      v.lecturas.push(l);
      return { ok: true, texto: `${nv}: ${fKm(l.km)} el ${fFecha(l.fecha)}` };
    }
    case 'elemento': {                           // (011) «proxima» se mezcla campo a campo: una nota nueva no cambia la decisión
      const ob = op.elemento, actual = ob?.id ? v.elementos.find(e => e.id === ob.id) : null;
      if (actual && ob.proxima) ob.proxima = { ...actual.proxima, ...ob.proxima };
      return porId(v.elementos, ob, 'elemento');
    }
    case 'pendiente': return porId(v.pendientes, op.pendiente, 'pendiente');
    case 'caducidad': {
      const c = op.caducidad, actual = c?.id ? v.caducidades.find(x => x.id === c.id) : null;
      if (!c?.id) return mal(`${nv}: caducidad sin id`);
      if (actual) return mezclarCaducidad(actual, c, op.historialQuitar, nv);
      if (!c.tipo || !esFecha(c.vence)) return mal(`${nv}: caducidad nueva sin tipo o sin fecha de vencimiento`);
      c.historial = c.historial || []; v.caducidades.push(c);
      return { ok: true, texto: `${nv}: caducidad nueva «${c.tipo}»` };
    }
    case 'ficha': {                              // (013) añade o cambia datos por su nombre; no quita ninguno
      const filas = op.ficha;                    // [{ campo, valor, despues? }]: «despues» = tras qué dato va uno nuevo (si no, al final)
      if (!Array.isArray(filas) || !filas.length) return mal(`${nv}: ficha sin datos`);
      const malo = filas.find(f => !String(f?.campo ?? '').trim() || !String(f?.valor ?? '').trim()
        || FICHA_RESERVADOS.some(c => c.toLowerCase() === String(f.campo).trim().toLowerCase()));
      if (malo) return mal(`${nv}: dato de la ficha no válido («${malo?.campo || ''}»)`);
      const igual = c => x => x.campo.toLowerCase() === String(c).trim().toLowerCase(), hechos = [];
      for (const f of filas) {
        const campo = f.campo.trim(), valor = String(f.valor).trim(), actual = v.ficha.find(igual(campo));
        if (actual) { hechos.push(`«${actual.campo}» ${actual.valor === valor ? 'sin cambios' : 'cambiado'}`); actual.valor = valor; continue; }
        const i = f.despues ? v.ficha.findIndex(igual(f.despues)) : -1;
        v.ficha.splice(i < 0 ? v.ficha.length : i + 1, 0, { campo, valor });
        hechos.push(`«${campo}» añadido`);
      }
      return { ok: true, texto: `${nv}: ficha: ${hechos.join(', ')}` };
    }
    case 'taller': return porId(d.talleres, op.taller, 'taller');
    case 'vehiculo': {
      const n = op.vehiculo;
      if (!n?.id || !n.nombre || !n.tipo || !n.alta) return mal('Vehículo nuevo incompleto (id, nombre, tipo y alta)');
      if (d.vehiculos.some(x => x.id === n.id)) return mal(`El vehículo ${n.id} ya existe`);
      for (const k of ['elementos', 'visitas', 'lecturas', 'caducidades', 'pendientes', 'ficha']) n[k] = n[k] || [];
      d.vehiculos.push(n);
      return { ok: true, texto: `Vehículo nuevo: ${n.nombre}` };
    }
    default: return mal(`Operación desconocida: ${op.op}`);
  }
}
// Completa una caducidad que ya existe sin perder nada de lo que hay (006):
// - historial: añade los periodos que faltan y completa los que ya están (mismos desde, hasta y pagado).
//   Solo quita los que vengan en historialQuitar, con esas mismas tres fechas;
// - vence: nunca hacia atrás. Si se renovó en la app después de preparar el fichero, se queda lo de la app;
// - datos: campo a campo.
function mezclarCaducidad(c, nueva, quitar = [], nv) {
  const { id, historial = [], datos, vence, ...resto } = nueva;
  const clave = h => [h.desde || '', h.hasta || '', h.pagado || ''].join('|');
  const notas = [];
  Object.assign(c, resto);
  if (datos) c.datos = { ...c.datos, ...datos };
  if (vence && vence > c.vence) { c.vence = vence; notas.push(`vence el ${fFecha(vence)}`); }
  else if (vence && vence < c.vence) notas.push(`se mantiene el vencimiento del ${fFecha(c.vence)}`);
  let h = [...(c.historial || [])], nuevos = 0, completados = 0, quitados = 0;
  for (const q of quitar) { const n = h.length; h = h.filter(x => clave(x) !== clave(q)); quitados += n - h.length; }
  for (const x of historial) {
    const y = h.find(z => clave(z) === clave(x));
    if (y) { Object.assign(y, x); completados++; } else { h.push(x); nuevos++; }
  }
  const orden = x => x.desde || x.pagado || x.hasta || '';
  c.historial = h.sort((a, b) => orden(a).localeCompare(orden(b)));
  const cambios = [nuevos && plural(nuevos, 'periodo añadido', 'periodos añadidos'), completados && plural(completados, 'completado', 'completados'),
    quitados && plural(quitados, 'quitado', 'quitados'), ...notas].filter(Boolean);
  return { ok: true, texto: `${nv}: ${c.tipo}: ${cambios.join(', ') || 'sin cambios'}` };
}
async function confirmarImport() {
  const imp = S.importacion;
  if (!imp || imp.error || !(imp.completo || imp.validas)) return;
  if (S.origen === 'dropbox' && S.rev && D()) {          // copia de lo que hay antes de importar
    const n = new Date(), f = iso(n.getFullYear(), n.getMonth() + 1, n.getDate()) + '_' + String(n.getHours()).padStart(2, '0') + String(n.getMinutes()).padStart(2, '0');
    try { await dbx(() => subir(`/copias/ruedak_${f}.json`, JSON.stringify(D(), null, 1), null, true)); }
    catch (e) { aviso({ tipo: 'error', texto: `No se ha podido guardar la copia previa en Dropbox (${e.message}). No se ha importado nada.` }); render(); return; }
  }
  S.datos = imp.datos; S.importacion = null;
  location.hash = '#/';
  await guardar(imp.completo ? 'Datos cargados' : `Importado: ${plural(imp.validas, 'cambio', 'cambios')}`);
}

    'nueva-caducidad': () => editarCaducidad(vid, null), 'editar-caducidad': () => editarCaducidad(vid, cad),
    'borrar-lectura': () => borrarLectura(vid, lec), 'editar-ficha': () => editarFicha(vid),
    'ajustar-hoja': () => ajustarHoja(vid), imprimir: () => imprimirHoja(vid), 'exportar-excel': exportarExcel,
    proponer: () => proponerProxima(vid),
    conectar: conectarDropbox, desconectar: desconectarDropbox, 'abrir-local': abrirLocal, 'guardar-como': guardarComo,
    descargar: () => descargar(JSON.stringify(D(), null, 1), 'ruedak.json'), 'guardar-ajustes': guardarAjustes,
    'confirmar-import': confirmarImport, 'cancelar-import': () => { S.importacion = null; render(); },
    'cerrar-aviso': () => { aviso(null); render(); },
    reintentar: () => guardar('Guardado'),
    recargar: async () => { try { await cargarDropbox(); aviso(null); toast('Datos recargados'); } catch (e) { aviso({ tipo: 'error', texto: 'No se han podido recargar los datos: ' + e.message }); } render(); }
  };
  if (acciones[accion]) acciones[accion]();
});
document.addEventListener('change', e => {
  const t = e.target, a = t.dataset?.accion;
  if (a === 'decision') cambiarDecision(t.dataset.veh, t.dataset.el, t.value);
  else if (a === 'ver-todos') { escribirLS(LS.verTodos, t.checked ? '1' : null); render(); }
  else if (a === 'importar') leerImport(t.files[0]);
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') comprobarCambios(); });
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
window.addEventListener('beforeunload', e => { if (S.sucio) { e.preventDefault(); e.returnValue = ''; } });

// Para las pruebas (test-humo.html).
window.Ruedak = {
  version: APP_VERSION, S, comprobarCambios, numero, hojasExcel, excel: () => xlsx(hojasExcel()),
  kmPorAno: vid => kmPorAno(veh(vid)), lecturasTodas: vid => lecturasTodas(veh(vid)),
  desdeAnterior: (vid, eid) => { const v = veh(vid); return [...desdeAnterior(v, elemento(v, eid))].map(([l, d]) => ({ ...d, visita: v.visitas.find(x => x.lineas.includes(l))?.id })); },
  juegosNeumaticos: (vid, eid) => juegosNeumaticos(veh(vid), elemento(veh(vid), eid)),
  estadoElemento: (vid, eid) => { const v = veh(vid), el = v && elemento(v, eid); return el ? estadoElemento(v, el) : null; },
  estadoCaducidad: (vid, cid) => { const v = veh(vid), c = v?.caducidades.find(x => x.id === cid); return c ? estadoCaducidad(v, c) : null; },
  kmHoy: vid => kmHoy(veh(vid))
};

// ─── Arranque ────────────────────────────────────────────────────────────────
(async function arrancar() {
  try {
    if (await volverDeDropbox() || leerLS(LS.refresh)) await cargarDropbox();
  } catch (e) {
    if (e.message === 'SIN_SESION') { escribirLS(LS.refresh, null); aviso({ tipo: 'error', texto: 'La conexión con Dropbox ha caducado. Vuelve a conectar en Ajustes.' }); }
    else aviso({ tipo: 'error', texto: 'No se han podido leer los datos de Dropbox: ' + e.message });
  }
  S.cargando = false;
  render();
})();
</script>
